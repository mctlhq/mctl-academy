name: Content evidence

# Verbatim citation verification against the private snapshot store.
#
# Split from ci.yml because it needs credentials: GitHub does not expose
# secrets to fork-triggered workflow runs, so this job cannot work on a fork
# PR at all. That is exactly why content PRs from forks are not accepted —
# see CONTRIBUTING.md. Structural validation (ci.yml) still runs everywhere.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evidence:
    name: Verify citations
    # Same-repo, non-dependabot only. Both exclusions exist for the same
    # reason: the secrets below are empty, the verifier fails closed — correct
    # — and a permanently red check nobody can fix in the PR is just noise.
    #
    # Fork PRs: GitHub does not expose secrets to fork-triggered runs at all.
    # Dependabot PRs: the run reads the separate Dependabot secret store, which
    # is a different store from Actions secrets. Putting the R2 credentials
    # there would be worse than the red check: `bun install` above installs the
    # freshly bumped dependencies before this step, so a postinstall script in
    # a bumped package would run with the snapshot store's credentials in env.
    # A dependency bump changes no content, so there is nothing to verify.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Fails closed by design: if the store is unreachable or a snapshot is
      # missing, published content does not pass. An unverifiable citation is
      # treated as a wrong one.
      - name: Verify citations
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: academy-source-snapshots
        run: npm run verify:evidence
