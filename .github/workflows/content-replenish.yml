                    # a later step goes, and a repoint to a local bare repo is
                    # served by that repo's `git receive-pack`, which runs ITS
                    # pre-receive hook -- arbitrary code in the step carrying
                    # the App token, routing around the .git/hooks hash by
                    # changing whose hooks run. Only the credential is
                    # normalised away, because actions/checkout leaves none and
                    # the action embeds the App token while both name the same
                    # repository, together with a trailing .git, which the
                    # action adds and checkout does not. Scheme, host and path
                    # all still have to match.
                    url=${kv#*$'\n'}
                    case "$url" in
                      *://*)
