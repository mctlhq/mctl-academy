              # names of every git configuration key that can run a command,
              # from every level git reads, includes followed. A planted
              # `filter.x.smudge` -- the reachable path dee48d2 closed, since a
              # smudge filter is a shell command and needs no execute bit --
              # appears here as a new line and fails the comparison, whatever
              # the file it was written into. Names only: values can hold a
              # token, and the name alone is the finding. A key the runner image
              # already carries sits on both sides and raises nothing, which is
              # why this is in the manifest instead of an assertion that the set
              # is empty. Keys are lowercased by `git config --list`, so the
              # patterns are too -- `core.hooksPath` is `core.hookspath` here.
