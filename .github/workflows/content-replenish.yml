          }
          manifest > "${RUNNER_TEMP}/reviewer-guard.txt"
          echo "digest=$("$SHA" < "${RUNNER_TEMP}/reviewer-guard.txt" | "$CUT" -d" " -f1)" >> "$GITHUB_OUTPUT"
