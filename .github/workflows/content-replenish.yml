                  core.hookspath|core.fsmonitor|core.sshcommand|core.askpass| \
                  core.pager|core.editor|core.attributesfile| \
                  include.path|includeif.*.path|alias.*| \
                  credential.helper|credential.*.helper| \
                  diff.*.command|diff.*.textconv|merge.*.driver| \
