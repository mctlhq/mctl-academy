          set -euo pipefail
          # Resolved from root-owned /usr/bin like every other tool in this
          # window: ~/.bun/bin is already on PATH and the runner user owns it.
          bin() { if [ -x "/usr/bin/$1" ]; then printf %s "/usr/bin/$1"; else command -v "$1"; fi; }
          JQ=$(bin jq)
          out="$RUNNER_TEMP/claude-execution-output.json"
          # Every agent in this job writes that one path, so the step before
          # each agent removes it. Absent therefore means "this attempt
          # reported nothing" -- not "the previous agent's answer" -- and it
          # reads as failure, as does a file jq cannot parse. All three
          # unknowns resolve to the value that RETRIES rather than the one that
          # skips the retry, which is the whole point of deciding from the
          # execution output instead of the step outcome.
          is_error=true
          if [ -f "$out" ]; then
            is_error=$("$JQ" -r 'if type != "array" then "true"
              else ([.[] | select(.type == "result")] | if length > 0 then (.[-1].is_error // false | tostring) else "true" end)
              end' "$out" 2>/dev/null || echo true)
