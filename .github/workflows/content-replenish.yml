      # compare it with the one the snapshot step put in its output. The saved
      # manifest is used only to print a readable diff -- it is a file, so it
      # is exactly as untrustworthy as the tree it describes.
      - name: Nothing the next steps trust moved
        env:
          # Read while the shell or the loader starts, before the first line of
          # this script: a check written inside the script has already lost.
          # $GITHUB_ENV carries them from the agent's step into every step that
          # follows, and a step-level env: is what outranks that. On every
          # shell step of these jobs, not only the ones around an agent -- the
          # boundary check, the capture holding the R2 keys and the pushes
          # carrying the App token all start a bash too. Setting them here also
          # means the environment comparison sees the same names on both sides,
          # which is the point: they are neutral there because they are neutral
          # everywhere.
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_DEBUG: ""
          # Not "": the loader splits this like PATH, where an empty entry
          # means the current directory, and Actions offers no way to unset a
          # variable the agent may have set.
          LD_LIBRARY_PATH: /nonexistent
          EXPECTED_DIGEST: ${{ steps.author-guard.outputs.digest }}
          EXPECTED_PATH: ${{ steps.author-guard.outputs.path }}
        run: |
          set -euo pipefail
          # Every utility below is resolved from /usr/bin, which is root-owned,
          # rather than from PATH. A file named sha256sum or env dropped into a
          # directory that is ALREADY on PATH -- ~/.bun/bin is on it and the
          # runner user owns it -- would be resolved by this very script, and a
          # sha256sum that prints the expected digest, or an env that filters a
          # variable out of its own output, defeats the check from inside. The
          # fallback keeps the block runnable off a runner, where these live
          # elsewhere.
          bin() { if [ -x "/usr/bin/$1" ]; then printf %s "/usr/bin/$1"; else command -v "$1"; fi; }
          SHA=$(bin sha256sum)
          FIND=$(bin find)
          SORT=$(bin sort)
          XARGS=$(bin xargs)
          CUT=$(bin cut)
          ENVX=$(bin env)
          DIFF=$(bin diff)
          GIT=$(bin git)
          # Everything a later step trusts and no agent is told to write:
          # _run/ (which the boundary check excludes and .gitignore hides),
          # .git/hooks, and every configuration file the tools the later steps
          # run will read. This is deliberately not a snapshot of the machine
          # -- node_modules, the bun cache and the action's own temp churn on
          # every run -- but of what those steps execute or read as config:
          # git's three config levels (system, XDG or $HOME, repository; git
          # reads the XDG file *in addition to* ~/.gitconfig, and one
          # core.hooksPath there is arbitrary code on the next git command),
          # npm's and bun's per-user files, and the resolution of PATH itself.
          # The lines carry absolute paths, so repointing $HOME or
          # $XDG_CONFIG_HOME through $GITHUB_ENV changes the manifest as surely
          # as editing the file it lands on.
          manifest() {
            {
              "$FIND" _run .git/hooks -type f -print0 2>/dev/null | LC_ALL=C "$SORT" -z | "$XARGS" -0 -r "$SHA"
              for f in "$HOME/.gitconfig" "${XDG_CONFIG_HOME:-$HOME/.config}/git/config" \
                       /etc/gitconfig "$HOME/.npmrc" "$HOME/.bunfig.toml"; do
                if [ -f "$f" ]; then "$SHA" "$f"; else echo "absent $f"; fi
              done
              # .git/config is NOT hashed as bytes, and it is the one file here
              # that cannot be: claude-code-action rewrites four of its keys on
              # every run, from src/github/operations/git-config.ts at the pin
              # in this file -- `git config user.name`, `git config user.email`,
              # `git remote set-url origin` with the token embedded, and
              # `git config --unset-all http.<server>/.extraheader`, which
              # removes what actions/checkout put there. Byte equality across an
              # agent step is therefore unattainable, and the guard failed on it
              # on run 34696477988 with no agent involvement.
              #
              # Every OTHER key is compared, value by value and hashed (the
              # origin url holds a token, so nothing here prints a value). A key
              # the action starts writing that is not on this list fails the
              # comparison rather than passing quietly, which is the direction
              # this has to fail in. The separate invariant below is what covers
              # the execution surface -- a filter.*.smudge planted here is what
              # dee48d2 is about, and it is caught by shape, not by diff.
              "$GIT" config --list --local -z 2>/dev/null | while IFS= read -r -d '' kv; do
                key=${kv%%$'\n'*}
                case "$key" in
                  user.name|user.email) continue ;;
                  http.*.extraheader) continue ;;
                  remote.origin.url)
                    # NOT skipped. This is where the credentialed `git push` in
                    # a later step goes, and a repoint to a local bare repo is
                    # served by that repo's `git receive-pack`, which runs ITS
                    # pre-receive hook -- arbitrary code in the step carrying
                    # the App token, routing around the .git/hooks hash by
                    # changing whose hooks run. Only the credential is
                    # normalised away, because actions/checkout leaves none and
                    # the action embeds the App token while both name the same
                    # repository, together with a trailing .git, which the
                    # action adds and checkout does not. Scheme, host and path
                    # all still have to match.
                    url=${kv#*$'\n'}
                    case "$url" in
                      *://*)
                        scheme=${url%%://*}
                        rest=${url#*://}
                        case "${rest%%/*}" in *@*) rest=${rest#*@} ;; esac
                        url="$scheme://$rest"
                        ;;
                    esac
                    url=${url%.git}
                    printf 'gitconfig %s %s\n' "$key" \
                      "$(printf '%s' "$url" | "$SHA" | "$CUT" -d" " -f1)"
                    continue
                    ;;
                esac
                printf 'gitconfig %s %s\n' "$key" \
                  "$(printf '%s' "${kv#*$'\n'}" | "$SHA" | "$CUT" -d" " -f1)"
              done | LC_ALL=C "$SORT"
              # And the execution surface, by SHAPE rather than by diff: the
              # names of every git configuration key that can run a command,
              # from every level git reads, includes followed. A planted
              # `filter.x.smudge` -- the reachable path dee48d2 closed, since a
              # smudge filter is a shell command and needs no execute bit --
              # appears here as a new line and fails the comparison, whatever
              # the file it was written into. Names only: values can hold a
              # token, and the name alone is the finding. A key the runner image
              # already carries sits on both sides and raises nothing, which is
              # why this is in the manifest instead of an assertion that the set
              # is empty. Keys are lowercased by `git config --list`, so the
              # patterns are too -- `core.hooksPath` is `core.hookspath` here.
              "$GIT" config --list --name-only -z 2>/dev/null | while IFS= read -r -d '' key; do
                case "$key" in
                  filter.*.smudge|filter.*.clean|filter.*.process| \
                  core.hookspath|core.fsmonitor|core.sshcommand|core.askpass| \
                  core.pager|core.editor|core.attributesfile| \
                  include.path|includeif.*.path|alias.*| \
                  credential.helper|credential.*.helper| \
                  diff.*.command|diff.*.textconv|merge.*.driver| \
                  gpg.program|gpg.*.program|init.templatedir|ssh.variant| \
                  pager.*|trailer.*.command)
                    echo "gitexec $key" ;;
                esac
