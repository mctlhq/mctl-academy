              # will resolve them. The runner user owns the directories some of
              # these live in -- ~/.bun/bin above all -- so "the agent cannot
              # write them" is false, and the next step runs `bun install`.
              for c in git node bun gh; do
                p=$(command -v "$c" 2>/dev/null || true)
                if [ -n "$p" ]; then "$SHA" "$p"; else echo "absent $c"; fi
              done
              # Every environment variable, not a list of the dangerous ones:
              # $GITHUB_ENV is a per-step file, so the agent's copy is gone by
              # the time this runs, but what it did is visible here. Values are
              # hashed, so the diff this feeds names variables and never prints
              # a secret. Excluded are the ones the runner legitimately changes
              # between two steps, plus PATH, which is compared entry by entry
              # below because the action's own setup-bun step touches it.
              "$ENVX" -0 | LC_ALL=C "$SORT" -z | while IFS= read -r -d '' kv; do
                case "${kv%%=*}" in
                  PATH|EXPECTED_DIGEST|EXPECTED_PATH) continue ;;
                  GITHUB_ACTION|GITHUB_ACTION_PATH|GITHUB_ACTION_REPOSITORY) continue ;;
                  # Set by the runner per step, like the three above, and seen
                  # to change across an agent step on run 34696477988 with no
                  # agent involvement.
                  GITHUB_ARTIFACTS|GITHUB_ARTIFACTS_LIST) continue ;;
                  GITHUB_ENV|GITHUB_PATH|GITHUB_OUTPUT|GITHUB_STATE|GITHUB_STEP_SUMMARY) continue ;;
                  # No arm for INPUT_* or STATE_*: the runner sets those when it
                  # invokes an action, never for a `run:` step like this one, so
                  # excluding them would hide the one namespace whose only
                  # possible origin here is $GITHUB_ENV -- and download-artifact
                  # below reads INPUT_GITHUB-TOKEN, INPUT_REPOSITORY and
                  # INPUT_RUN-ID from exactly there.
                esac
                printf '%s %s\n' "${kv%%=*}" "$(printf '%s' "${kv#*=}" | "$SHA" | "$CUT" -d" " -f1)"
              done
            }
          }
          now="${RUNNER_TEMP}/author-guard-after.txt"
          manifest > "$now"
          if [ "$("$SHA" < "$now" | "$CUT" -d" " -f1)" != "$EXPECTED_DIGEST" ]; then
            echo "::error::the agent changed a file the following steps trust"
            "$DIFF" "${RUNNER_TEMP}/author-guard.txt" "$now" || true
            exit 1
          fi
          bad=""
          # $GITHUB_PATH *prepends*, so one line appended to it wins every
          # command resolution in every following step. An allowlist, not a
          # list of bad shapes: nothing may appear on PATH that was not there
          # before the agent ran. This workflow's own setup-bun step has
          # already put the bun directory there, so the action's copy of that
          # step adds nothing new; anything the agent put there -- $HOME/bin as
          # much as the workspace -- fails the run and is named in the error.
          before="$EXPECTED_PATH"
          old_ifs=$IFS
          IFS=:
          # An empty entry is a real one: to PATH it means the current
          # directory. Bash keeps leading and interior empty fields when IFS is
          # a non-whitespace character and drops a TRAILING one -- and a
          # trailing colon is the cheapest way to add the working directory to
          # PATH without naming it. A sentinel field makes that last one
          # interior, and the loop drops it BY POSITION, one iteration behind:
          # skipping it by value would have made its own name the single string
          # this guard waves through, which is the opposite of an allowlist.
          # The sentinel is appended in an assignment, not written next to the
          # expansion: splitting applies to what an expansion produces, not to
          # literal text beside it, so `$PATH:__pathguard__` gives a last field
          # of ":__pathguard__" on bash 5 and the empty entry is never formed.
          # bash 3.2 splits it the other way, which is why this passed on a Mac
          # and failed on the runner.
          padded="$PATH:__pathguard__"
          prev=
          seen=
          for d in $padded; do
            if [ -n "$seen" ]; then
              case ":$before:" in *":$prev:"*) ;; *)
                echo "::error::PATH gained '$prev' after the agent ran"
                bad=1
              ;; esac
            fi
            seen=1
            prev=$d
          done
          IFS=$old_ifs
          [ -z "$bad" ] || exit 1

      # node_modules is exempt from the boundary check because `bun install`
      # leaves tens of thousands of untracked files there, and the agents write
      # under an unscoped grant, so nothing stops a write landing in it. Such a
      # write would execute as soon as the next `node` resolves an import,
      # which is the boundary check itself. So the dependencies are discarded
      # and reinstalled, and the executable surface is checked, before ANY
      # repository code runs again.
      - name: Guard the executable surface and rebuild dependencies
        env:
          # Read while the shell or the loader starts, before the first line of
          # this script: a check written inside the script has already lost.
          # $GITHUB_ENV carries them from the agent's step into every step that
          # follows, and a step-level env: is what outranks that. On every
          # shell step of these jobs, not only the ones around an agent -- the
          # boundary check, the capture holding the R2 keys and the pushes
          # carrying the App token all start a bash too. Setting them here also
          # means the environment comparison sees the same names on both sides,
          # which is the point: they are neutral there because they are neutral
          # everywhere.
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_DEBUG: ""
          # Not "": the loader splits this like PATH, where an empty entry
          # means the current directory, and Actions offers no way to unset a
          # variable the agent may have set.
          LD_LIBRARY_PATH: /nonexistent
        run: |
          set -euo pipefail
          # Every utility below is resolved from /usr/bin, which is root-owned,
          # rather than from PATH. A file named sha256sum or env dropped into a
          # directory that is ALREADY on PATH -- ~/.bun/bin is on it and the
          # runner user owns it -- would be resolved by this very script, and a
          # sha256sum that prints the expected digest, or an env that filters a
          # variable out of its own output, defeats the check from inside. The
          # fallback keeps the block runnable off a runner, where these live
          # elsewhere.
          bin() { if [ -x "/usr/bin/$1" ]; then printf %s "/usr/bin/$1"; else command -v "$1"; fi; }
          SHA=$(bin sha256sum)
          FIND=$(bin find)
          SORT=$(bin sort)
          XARGS=$(bin xargs)
          CUT=$(bin cut)
          ENVX=$(bin env)
          DIFF=$(bin diff)
          GIT=$(bin git)
          TR=$(bin tr)
          RM=$(bin rm)
          # Pure git: not one line of repository code has run since the agent
          # stopped, and that is the point. The boundary check below is itself
          # `node scripts/...`, so an agent that edited a script under scripts/
          # or a workflow under .github/ would have its own code executed by
          # the check meant to catch it, with this job's snapshot credentials.
          # Deliberately no --exclude-standard: `git ls-files --others` applies
          # the exclusions whether or not a path was named, so the flag would
          # hand .gitignore a veto over what this check can see -- and .npmrc
          # is one of the files most likely to be added to it.
          # bun reads .env by itself, and NODE_OPTIONS set there survives into
          # every node the install and the gates below start.
          surface="scripts .github package.json bun.lock bun.lockb bunfig.toml .npmrc .env .env.*"
          changed=$("$GIT" diff --name-only -z "${{ steps.base.outputs.sha }}" -- $surface | "$TR" '\0' '\n')
          created=$("$GIT" ls-files --others -z -- $surface | "$TR" '\0' '\n')
          # Node resolves imports by walking UP from the script's directory, so
          # scripts/node_modules/yaml would be loaded in preference to the root
          # one that is about to be reinstalled.
          nested=$("$FIND" . -path ./node_modules -prune -o -name node_modules -type d -print)
          if [ -n "$changed$created$nested" ]; then
            echo "::error::the executable surface moved after the agent ran: $changed $created $nested"
            exit 1
          fi
          "$RM" -rf node_modules
          # The lockfile pins what is installed, not what the cache hands over:
          # bun copies packages out of ~/.bun/install/cache, which the runner
          # user owns, so a poisoned entry there would be installed under a
          # verified name. Emptying it costs a cold download on a job that runs
          # once a week.
          bun pm cache rm || "$RM" -rf "${HOME}/.bun/install/cache"
          bun install --frozen-lockfile

      - name: Deterministic gates on the authored content
        env:
          # Read while the shell or the loader starts, before the first line of
          # this script: a check written inside the script has already lost.
          # $GITHUB_ENV carries them from the agent's step into every step that
          # follows, and a step-level env: is what outranks that. On every
          # shell step of these jobs, not only the ones around an agent -- the
          # boundary check, the capture holding the R2 keys and the pushes
          # carrying the App token all start a bash too. Setting them here also
          # means the environment comparison sees the same names on both sides,
          # which is the point: they are neutral there because they are neutral
          # everywhere.
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_DEBUG: ""
          # Not "": the loader splits this like PATH, where an empty entry
          # means the current directory, and Actions offers no way to unset a
          # variable the agent may have set.
          LD_LIBRARY_PATH: /nonexistent
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          git status --short content/ || true
          # Reject changes to trusted validators, schemas and source records
          # before running any repository code with snapshot credentials.
          # Edited AND created paths, because `git diff` never lists an
          # untracked file. The two scratch directories, _run/ and _agent/,
          # are the only exceptions and they live in boundaryProblems itself
          # rather than in a per-call list; tests/replenish-prepare.test.mjs
          # drives it against a real repository holding both and an intruder.
          node scripts/replenish-prepare.mjs boundary --base "${{ steps.base.outputs.sha }}"
          # Untracked files count: the cap is measured on new files as well as
          # edits, against the pre-agent commit, not against main.
          node scripts/replenish-prepare.mjs guard --base "${{ steps.base.outputs.sha }}" --max "$MAX_QUESTIONS" --forbid-published-now
          bun run lint:content
          node scripts/verify-evidence.mjs
          bun run test:content
          node scripts/content-quality-report.mjs

      - name: Commit and push the authored branch
        id: commit
        env:
          # Read while the shell or the loader starts, before the first line of
          # this script: a check written inside the script has already lost.
          # $GITHUB_ENV carries them from the agent's step into every step that
          # follows, and a step-level env: is what outranks that. On every
          # shell step of these jobs, not only the ones around an agent -- the
          # boundary check, the capture holding the R2 keys and the pushes
          # carrying the App token all start a bash too. Setting them here also
          # means the environment comparison sees the same names on both sides,
          # which is the point: they are neutral there because they are neutral
          # everywhere.
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_DEBUG: ""
          # Not "": the loader splits this like PATH, where an empty entry
          # means the current directory, and Actions offers no way to unset a
          # variable the agent may have set.
          LD_LIBRARY_PATH: /nonexistent
        run: |
          set -euo pipefail
          git add content/questions/
          n=$(git diff --staged --name-only -- content/questions | wc -l | tr -d ' ')
          # Exactly the predicate the review job uses to build its review set:
          # the agent's items AND the items the mechanical re-validation
          # returned to review_ready. A run that repaired something but
          # authored nothing still has work to review; a run that only
          # quarantined does not, and Source drift already owns that PR.
          # Counting changed files instead would push a quarantine-only branch
          # the review job then finds nothing to do on -- a green run, an
          # orphan branch and no PR.
          pending=$(node scripts/replenish-prepare.mjs review-ids --base origin/main | grep -c . || true)
          if [ "${pending:-0}" = "0" ]; then
            # Captured sources, a quarantine and the watermark alone are not
            # worth a PR; the branch is not pushed, so nothing accumulates.
            # The next run rediscovers the same pages, which is honest.
            echo "No question file is review_ready against main; no review, no PR, branch not pushed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          s=$(git diff --name-only origin/main -- content/sources | wc -l | tr -d ' ')
          if [ "$n" != "0" ]; then
            git -c user.name="$BOT_NAME" -c user.email="$BOT_EMAIL" commit -m "content(replenish): author ${n} question file(s) from ${s} captured source(s)" \
              -m "Authored by ${AUTHOR_ID} (${AUTHOR_MODEL}) from captured documentation; every item is review_ready and awaits the independent review recorded in the next commit."
          else
            echo "::notice::the author wrote nothing; pushing ${pending} mechanically re-validated item(s) for review"
          fi
          git push origin "HEAD:${{ steps.branch.outputs.name }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Three artifacts, and the split is the point: nothing an agent wrote may
      # be on the reviewer's filesystem while it judges, and "treat it as data"
      # is a prompt, not a boundary.
      #
      # `handoff` is the only one the review job downloads before reviewing:
      # captured pages (verbatim source text), the discovery report and the
      # quality report, none of them agent-written.
      #
      # `pr-inputs` carries selected.json/dropped.json. Those come from the
      # SELECTOR agent's own select.json -- validateSelection carries its title
      # strings through, and a dropped row is the unvalidated object verbatim --
      # so they are downloaded only after the reviewer has finished, by the step
      # that builds the PR body, their sole consumer.
      #
      # `authoring` holds _agent/CHANGES.md, the author agent's account of what it
      # wrote, and is downloaded by no job at all.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: handoff-${{ github.run_id }}
          path: |
            _run/captured/
            _run/candidates.json
            _run/report-before.json
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-inputs-${{ github.run_id }}
          path: |
            _run/selected.json
            _run/dropped.json
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: authoring-${{ github.run_id }}
          path: |
            _run/
            _agent/
            !_run/from-discover/
          retention-days: 14
          if-no-files-found: ignore

  review:
    needs: author
    if: needs.author.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Generate mctl-agents App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-academy
          permission-contents: write
          permission-pull-requests: write

      # A secret cannot be read in an `if:`, so whether the second token exists
      # becomes a step output here. Without it the retry steps below would be
      # skipped by an expression nobody can debug from the log.
      - name: Is there a second token to fall back on
        id: fallback-token
        env:
          FALLBACK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
        run: |
          set -euo pipefail
          if [ -n "$FALLBACK" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no CLAUDE_CODE_OAUTH_TOKEN_2 is configured; an exhausted primary token stops the run"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      # A fresh checkout of the pushed branch: the reviewer inherits nothing
      # from the author's job, not its prompt, not its scratch files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ needs.author.outputs.branch }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned, not `latest`, and pinned to this exact version on purpose:
          # claude-code-action embeds its own oven-sh/setup-bun at
          # `bun-version: 1.3.14`, which runs inside the agent step. With
          # `latest` here the two disagree, that copy downloads, and
          # ~/.bun/bin/bun changes under the manifest the snapshot just hashed
          # -- which failed the guard on run 34696477988 with no agent
          # involvement. Matching the version makes the action's copy find what
          # it wants already installed. The two pins must move together;
          # tests/replenish-prepare.test.mjs asserts they agree.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: handoff-${{ github.run_id }}
          path: _run/from-author

      - name: List the items under review
        id: items
        env:
          # Read while the shell or the loader starts, before the first line of
          # this script: a check written inside the script has already lost.
          # $GITHUB_ENV carries them from the agent's step into every step that
          # follows, and a step-level env: is what outranks that. On every
          # shell step of these jobs, not only the ones around an agent -- the
          # boundary check, the capture holding the R2 keys and the pushes
          # carrying the App token all start a bash too. Setting them here also
          # means the environment comparison sees the same names on both sides,
          # which is the point: they are neutral there because they are neutral
          # everywhere.
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_DEBUG: ""
          # Not "": the loader splits this like PATH, where an empty entry
          # means the current directory, and Actions offers no way to unset a
          # variable the agent may have set.
          LD_LIBRARY_PATH: /nonexistent
        run: |
          set -euo pipefail
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          mkdir -p _run _agent
          # Exactly the handoff artifact, which carries no file any agent
          # wrote: CHANGES.md and the selector's rows are in artifacts this job
          # does not download until after the reviewer has finished.
          # upload-artifact roots an artifact at the least common ancestor of
          # the files it MATCHED, so a set of paths that all sit under _run/
          # arrives without that prefix -- entries captured/, candidates.json.
          # The candidates artifact keeps its _run/ prefix (read at line 194)
          # only because it also carries a path outside _run/, which lifts its
          # ancestor to the workspace root. Keeping at least one file directly
          # under _run/ here is what holds this read path; a handoff of
          # _run/captured/ alone would root at _run/captured and break it.
          cp -r _run/from-author/captured _run/captured
          for f in candidates.json report-before.json; do
            [ -f "_run/from-author/$f" ] && cp "_run/from-author/$f" "_run/$f" || true
          done
          # The items this run put up for review: every review_ready file that
          # differs from main, read as YAML. Against main, not the pre-agent
          # commit, so the items the mechanical re-validation repinned are
          # reviewed too, not only what the agent touched.
          node scripts/replenish-prepare.mjs review-ids --base origin/main > _run/review-ids.txt
          count=$(grep -c . _run/review-ids.txt || true)
          # The author job pushed this branch BECAUSE something was reviewable.
          # Both jobs compute the same predicate, but at different times against
          # a moving origin/main -- Source drift's quarantine PR merges at the
          # same hour and touches the same files. An empty set here is an
          # orphaned branch, not a valid outcome, so it must not be a green run.
          if [ "${count:-0}" = "0" ]; then
            echo "::error::the author job pushed ${{ needs.author.outputs.branch }} but nothing is review_ready against main; the branch is orphaned"
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          cat _run/review-ids.txt

      # Nebius Token Factory speaks OpenAI chat-completions; the CLI speaks the
      # Anthropic Messages API. This translates between them on loopback, so
      # ANTHROPIC_BASE_URL above reaches a real endpoint. It writes nothing to
      # the workspace and dies with the job.
      - name: Start the Nebius relay
        if: env.PROVIDER == 'nebius'
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NEBIUS_API_KEY:-}" ]; then
            echo "::error::provider is nebius but no NEBIUS_API_KEY secret is configured"
            exit 1
          fi
          nohup python3 scripts/nebius-relay.py > "$RUNNER_TEMP/relay.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8787/health > /dev/null || {
            echo "::error::the relay did not come up"; cat "$RUNNER_TEMP/relay.log"; exit 1; }

      # The agents' grant is the unscoped Write tool, so this is what bounds
      # them outside content/questions and their own scratch file: a digest of
      # everything the following steps trust, taken while nothing but this
      # workflow has run. The digest is kept in the step's OUTPUT, not in a
      # file: the agent can rewrite any file in the workspace, and the runner's
      # step-output store is not a path.
      - name: Snapshot what the agent must not touch
        if: steps.items.outputs.count != '0'
        id: reviewer-guard
        env:
          # Read while the shell or the loader starts, before the first line of
          # this script: a check written inside the script has already lost.
          # $GITHUB_ENV carries them from the agent's step into every step that
          # follows, and a step-level env: is what outranks that. On every
          # shell step of these jobs, not only the ones around an agent -- the
          # boundary check, the capture holding the R2 keys and the pushes
          # carrying the App token all start a bash too. Setting them here also
          # means the environment comparison sees the same names on both sides,
          # which is the point: they are neutral there because they are neutral
          # everywhere.
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_DEBUG: ""
          # Not "": the loader splits this like PATH, where an empty entry
          # means the current directory, and Actions offers no way to unset a
          # variable the agent may have set.
          LD_LIBRARY_PATH: /nonexistent
        run: |
          set -euo pipefail
          # Every utility below is resolved from /usr/bin, which is root-owned,
          # rather than from PATH. A file named sha256sum or env dropped into a
          # directory that is ALREADY on PATH -- ~/.bun/bin is on it and the
          # runner user owns it -- would be resolved by this very script, and a
          # sha256sum that prints the expected digest, or an env that filters a
          # variable out of its own output, defeats the check from inside. The
          # fallback keeps the block runnable off a runner, where these live
          # elsewhere.
          bin() { if [ -x "/usr/bin/$1" ]; then printf %s "/usr/bin/$1"; else command -v "$1"; fi; }
          SHA=$(bin sha256sum)
          FIND=$(bin find)
          SORT=$(bin sort)
          XARGS=$(bin xargs)
          CUT=$(bin cut)
          ENVX=$(bin env)
          DIFF=$(bin diff)
          GIT=$(bin git)
          RM=$(bin rm)
          # Everything a later step trusts and no agent is told to write:
          # _run/ (which the boundary check excludes and .gitignore hides),
          # .git/hooks, and every configuration file the tools the later steps
          # run will read. This is deliberately not a snapshot of the machine
          # -- node_modules, the bun cache and the action's own temp churn on
          # every run -- but of what those steps execute or read as config:
          # git's three config levels (system, XDG or $HOME, repository; git
          # reads the XDG file *in addition to* ~/.gitconfig, and one
          # core.hooksPath there is arbitrary code on the next git command),
          # npm's and bun's per-user files, and the resolution of PATH itself.
          # The lines carry absolute paths, so repointing $HOME or
          # $XDG_CONFIG_HOME through $GITHUB_ENV changes the manifest as surely
          # as editing the file it lands on.
          manifest() {
            {
              "$FIND" _run .git/hooks -type f -print0 2>/dev/null | LC_ALL=C "$SORT" -z | "$XARGS" -0 -r "$SHA"
              for f in "$HOME/.gitconfig" "${XDG_CONFIG_HOME:-$HOME/.config}/git/config" \
                       /etc/gitconfig "$HOME/.npmrc" "$HOME/.bunfig.toml"; do
                if [ -f "$f" ]; then "$SHA" "$f"; else echo "absent $f"; fi
              done
              # .git/config is NOT hashed as bytes, and it is the one file here
              # that cannot be: claude-code-action rewrites four of its keys on
              # every run, from src/github/operations/git-config.ts at the pin
              # in this file -- `git config user.name`, `git config user.email`,
              # `git remote set-url origin` with the token embedded, and
              # `git config --unset-all http.<server>/.extraheader`, which
              # removes what actions/checkout put there. Byte equality across an
              # agent step is therefore unattainable, and the guard failed on it
              # on run 34696477988 with no agent involvement.
              #
              # Every OTHER key is compared, value by value and hashed (the
              # origin url holds a token, so nothing here prints a value). A key
              # the action starts writing that is not on this list fails the
              # comparison rather than passing quietly, which is the direction
              # this has to fail in. The separate invariant below is what covers
              # the execution surface -- a filter.*.smudge planted here is what
              # dee48d2 is about, and it is caught by shape, not by diff.
              "$GIT" config --list --local -z 2>/dev/null | while IFS= read -r -d '' kv; do
                key=${kv%%$'\n'*}
                case "$key" in
                  user.name|user.email) continue ;;
                  http.*.extraheader) continue ;;
                  remote.origin.url)
                    # NOT skipped. This is where the credentialed `git push` in
                    # a later step goes, and a repoint to a local bare repo is
                    # served by that repo's `git receive-pack`, which runs ITS
                    # pre-receive hook -- arbitrary code in the step carrying
                    # the App token, routing around the .git/hooks hash by
                    # changing whose hooks run. Only the credential is
                    # normalised away, because actions/checkout leaves none and
                    # the action embeds the App token while both name the same
                    # repository, together with a trailing .git, which the
                    # action adds and checkout does not. Scheme, host and path
                    # all still have to match.
                    url=${kv#*$'\n'}
                    case "$url" in
                      *://*)
                        scheme=${url%%://*}
                        rest=${url#*://}
                        case "${rest%%/*}" in *@*) rest=${rest#*@} ;; esac
                        url="$scheme://$rest"
                        ;;
                    esac
                    url=${url%.git}
                    printf 'gitconfig %s %s\n' "$key" \
                      "$(printf '%s' "$url" | "$SHA" | "$CUT" -d" " -f1)"
                    continue
                    ;;
                esac
                printf 'gitconfig %s %s\n' "$key" \
                  "$(printf '%s' "${kv#*$'\n'}" | "$SHA" | "$CUT" -d" " -f1)"
              done | LC_ALL=C "$SORT"
              # And the execution surface, by SHAPE rather than by diff: the
              # names of every git configuration key that can run a command,
              # from every level git reads, includes followed. A planted
              # `filter.x.smudge` -- the reachable path dee48d2 closed, since a
              # smudge filter is a shell command and needs no execute bit --
              # appears here as a new line and fails the comparison, whatever
              # the file it was written into. Names only: values can hold a
              # token, and the name alone is the finding. A key the runner image
              # already carries sits on both sides and raises nothing, which is
              # why this is in the manifest instead of an assertion that the set
              # is empty. Keys are lowercased by `git config --list`, so the
              # patterns are too -- `core.hooksPath` is `core.hookspath` here.
              "$GIT" config --list --name-only -z 2>/dev/null | while IFS= read -r -d '' key; do
                case "$key" in
                  filter.*.smudge|filter.*.clean|filter.*.process| \
                  core.hookspath|core.fsmonitor|core.sshcommand|core.askpass| \
                  core.pager|core.editor|core.attributesfile| \
                  include.path|includeif.*.path|alias.*| \
                  credential.helper|credential.*.helper| \
                  diff.*.command|diff.*.textconv|merge.*.driver| \
                  gpg.program|gpg.*.program|init.templatedir|ssh.variant| \
                  pager.*|trailer.*.command)
                    echo "gitexec $key" ;;
                esac
              done | LC_ALL=C "$SORT"
              # The binaries themselves, resolved the way the following steps
              # will resolve them. The runner user owns the directories some of
              # these live in -- ~/.bun/bin above all -- so "the agent cannot
              # write them" is false, and the next step runs `bun install`.
              for c in git node bun gh; do
                p=$(command -v "$c" 2>/dev/null || true)
                if [ -n "$p" ]; then "$SHA" "$p"; else echo "absent $c"; fi
              done
              # Every environment variable, not a list of the dangerous ones:
              # $GITHUB_ENV is a per-step file, so the agent's copy is gone by
              # the time this runs, but what it did is visible here. Values are
              # hashed, so the diff this feeds names variables and never prints
              # a secret. Excluded are the ones the runner legitimately changes
              # between two steps, plus PATH, which is compared entry by entry
              # below because the action's own setup-bun step touches it.
              "$ENVX" -0 | LC_ALL=C "$SORT" -z | while IFS= read -r -d '' kv; do
                case "${kv%%=*}" in
                  PATH|EXPECTED_DIGEST|EXPECTED_PATH) continue ;;
                  GITHUB_ACTION|GITHUB_ACTION_PATH|GITHUB_ACTION_REPOSITORY) continue ;;
                  # Set by the runner per step, like the three above, and seen
                  # to change across an agent step on run 34696477988 with no
                  # agent involvement.
                  GITHUB_ARTIFACTS|GITHUB_ARTIFACTS_LIST) continue ;;
                  GITHUB_ENV|GITHUB_PATH|GITHUB_OUTPUT|GITHUB_STATE|GITHUB_STEP_SUMMARY) continue ;;
