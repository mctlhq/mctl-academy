      # exhausted token comes back as is_error with a single turn and no cost,
      # and the step still succeeds. Read the execution output the action
      # always writes, the same way claude-review does, so a spent quota window
      # is not mistaken for an agent that had nothing to say.
      - name: Independent reviewer decides per item -- did it run at all
        id: reviewer-agent-check
        if: steps.items.outputs.count != '0'
        env:
          OUTCOME: ${{ steps.reviewer-agent.outcome }}
          # Same reason as every other shell step between an agent and the
          # verified digest: BASH_ENV and its siblings are read before the first
          # line of this script, and a step-level env: outranks $GITHUB_ENV.
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          # Not "": the loader splits this like PATH, where an empty entry
          # means the current directory, and Actions offers no way to unset
          # a variable the agent may have set.
          LD_LIBRARY_PATH: /nonexistent
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_DEBUG: ""
