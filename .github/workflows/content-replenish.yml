name: Content replenish

# Weekly, after Source drift: find what the bank is missing and turn it into
# one content pull request that a human merges.
#
#   discover  deterministic: uncited pages in the llms.txt indices, sources
#             whose live bytes changed (classified against the R2 snapshot),
#             Mock shortfalls and thin objectives
#   author    capture the chosen pages (R2), mechanically re-validate what a
#             re-capture repairs, then an authoring agent writes at most
#             MAX_QUESTIONS review_ready items from the captured bytes
#   review    a separate job, a separate model, a fresh checkout: an
#             independent reviewing agent decides per item against the two
#             CONTENT-POLICY criteria; its decisions become the committed
#             receipt, only approved ids are promoted, the PR is opened
#
# What stays with people: CODEOWNER merge of the PR, the exam-provenance
# attestation, and the retention review of any new source host. Nothing here
# pushes to main or approves a pull request; the deterministic gates (schema,
# lint, verbatim citation check against R2, receipt fingerprints) run both in
# this workflow and again as required checks on the PR it opens.
#
# The two agents never share a prompt, a job or a model. The reviewer sees
# the final YAML and the captured pages, nothing the author was told. Reports
# the agents read (_run/candidates.json, _run/captured/*.md) are files they
# open as data; none of that text is interpolated into a prompt or a shell
# line.
#
# The three agents run with the UNSCOPED Write tool, not a path allowlist: on
# anthropics/claude-code-action every scoped form tried here was denied at call
# time while the step still reported success, so a scoped grant does not narrow
# what an agent may write -- it stops the agent writing at all, silently. What
# the bare tool then reaches is the WORKSPACE, not the filesystem: probed in
# the review job of PR #245 at this same pin, a Write to /tmp/be.sh was refused
# with the identical "you haven't granted it yet" message while a Write inside
# the workspace succeeded. So the entries below that live outside the workspace
# -- $HOME, /etc, the resolved binaries -- are defence in depth against that
# confinement failing; _run/, .git/, node_modules/ and .env are the ones
# carrying the weight. Four
# runs on 2026-09-06 established this: `_agent/**`, its absolute
# `//<workspace>/_agent/**` form and `_run/agent/**` were all refused with
# "Claude requested permissions to write to <path>, but you haven't granted it
# yet", and the bare tool was accepted. One earlier run, 34051711495, accepted
# `Write(content/questions/**)` and wrote five files; that has not been
# reproduced and nothing here relies on it, so the rule below is written for
# the behaviour that reproduces. So the grant is not the boundary. The
# boundary is deterministic and below: each agent is followed by a prune of its
# scratch directory, then a boundary check, then guardChanges on the questions.
#
# Every scratch file this workflow writes lives under _run/, and the agents'
# own output goes to _agent/. That is what lets the
# pre-agent boundary check below be a plain "nothing outside content/questions
# moved" rule instead of a list that has to be re-derived
# whenever a step starts writing a new file. The check does not honour
# .gitignore: an ignored path is still a path the next step would load.

on:
  schedule:
    # Mondays 06:30 UTC, after Source drift (06:00) has had its say.
    - cron: "30 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discover only: print candidates, write nothing, open nothing"
        type: boolean
        default: false
      max_new:
        description: "New documentation pages to capture this run"
        type: string
        default: "3"
      max_questions:
        description: "Question files the author may add or change"
        type: string
        default: "20"
      force:
        description: "Run even when a replenish PR is already open"
        type: boolean
        default: false
      provider:
        description: "Which models write and review this run"
        type: choice
        default: anthropic
        options:
          - anthropic
          - nebius

permissions: {}

concurrency:
  group: content-replenish
  cancel-in-progress: false

env:
  MAX_NEW: ${{ inputs.max_new || '3' }}
  MAX_QUESTIONS: ${{ inputs.max_questions || '20' }}
  # `nebius` serves both agents from Nebius Token Factory through the local
  # relay below, on an independent quota. The identifiers move with the models:
  # a receipt that says agent:claude-reviewer when DeepSeek did the judging
  # would misattribute every approval it records. Scheduled runs have no
  # inputs, so the cron keeps running on Anthropic.
  PROVIDER: ${{ inputs.provider || 'anthropic' }}
  AUTHOR_ID: ${{ inputs.provider == 'nebius' && 'agent:glm-author' || 'agent:claude-author' }}
  REVIEWER_ID: ${{ inputs.provider == 'nebius' && 'agent:deepseek-reviewer' || 'agent:claude-reviewer' }}
  AUTHOR_MODEL: ${{ inputs.provider == 'nebius' && 'zai-org/GLM-5.3' || 'claude-sonnet-5' }}
  REVIEWER_MODEL: ${{ inputs.provider == 'nebius' && 'deepseek-ai/DeepSeek-V4-Pro' || 'claude-opus-5' }}
  # claude-code-action forwards this to the CLI from the CALLING workflow's env
  # (its own `env:` block shadows a step-level one), and empty means Anthropic.
  ANTHROPIC_BASE_URL: ${{ inputs.provider == 'nebius' && 'http://127.0.0.1:8787' || '' }}
  BOT_NAME: mctl-agents[bot]
  BOT_EMAIL: mctl-agents[bot]@users.noreply.github.com

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
      empty: ${{ steps.discover.outputs.empty }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One replenish PR in flight at a time: a second run would author the
      # same gaps again and the two PRs would conflict on the receipt file.
      - name: Skip while a replenish PR is open
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          # A gh failure must not read as "a PR is open": tell them apart.
          open=$(gh pr list --repo "${{ github.repository }}" --state open --label agents:replenish --json number --jq 'length')
          if [ "$open" != "0" ] && [ "$FORCE" != "true" ]; then
            echo "::notice::$open replenish PR(s) already open; skipping (dispatch with force to override)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.guard.outputs.skip != 'true'
        with:
          # Pinned, not `latest`, and pinned to this exact version on purpose:
          # claude-code-action embeds its own oven-sh/setup-bun at
          # `bun-version: 1.3.14`, which runs inside the agent step. With
          # `latest` here the two disagree, that copy downloads, and
          # ~/.bun/bin/bun changes under the manifest the snapshot just hashed
          # -- which failed the guard on run 34696477988 with no agent
          # involvement. Matching the version makes the action's copy find what
          # it wants already installed. The two pins must move together;
          # tests/replenish-prepare.test.mjs asserts they agree.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
        if: steps.guard.outputs.skip != 'true'

      - name: Discover new pages, live drift and gaps
        id: discover
        if: steps.guard.outputs.skip != 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          case "$MAX_NEW" in *[!0-9]*|"") echo "::error::max_new must be an integer"; exit 1;; esac
          mkdir -p _run _agent
          node scripts/discover-docs.mjs --out _run/candidates.json --max-new "$MAX_NEW" --check-live --update-state
          empty=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("_run/candidates.json","utf8")).empty)')
          echo "empty=$empty" >> "$GITHUB_OUTPUT"
          {
            echo "## Discovery"
            echo
            node -e 'console.log(JSON.parse(require("fs").readFileSync("_run/candidates.json","utf8")).summary)'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.guard.outputs.skip != 'true'
        with:
          name: candidates-${{ github.run_id }}
          path: |
            _run/candidates.json
            content/discovery-state.yaml
          retention-days: 14

  author:
    needs: discover
    if: needs.discover.outputs.skip != 'true' && needs.discover.outputs.empty != 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.branch.outputs.name }}
      changed: ${{ steps.commit.outputs.changed }}
      base: ${{ steps.base.outputs.sha }}
      captured: ${{ steps.capture.outputs.captured }}
    steps:
      - name: Generate mctl-agents App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-academy
          permission-contents: write

      # A secret cannot be read in an `if:`, so whether the second token exists
      # becomes a step output here. Without it the retry steps below would be
      # skipped by an expression nobody can debug from the log.
      - name: Is there a second token to fall back on
        id: fallback-token
        env:
          FALLBACK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
        run: |
          set -euo pipefail
          if [ -n "$FALLBACK" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no CLAUDE_CODE_OAUTH_TOKEN_2 is configured; an exhausted primary token stops the run"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned, not `latest`, and pinned to this exact version on purpose:
          # claude-code-action embeds its own oven-sh/setup-bun at
          # `bun-version: 1.3.14`, which runs inside the agent step. With
          # `latest` here the two disagree, that copy downloads, and
          # ~/.bun/bin/bun changes under the manifest the snapshot just hashed
          # -- which failed the guard on run 34696477988 with no agent
          # involvement. Matching the version makes the action's copy find what
          # it wants already installed. The two pins must move together;
          # tests/replenish-prepare.test.mjs asserts they agree.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidates-${{ github.run_id }}
          path: _run/from-discover

      - name: Start the replenish branch
        id: branch
        env:
          # Read while the shell or the loader starts, before the first line of
          # this script: a check written inside the script has already lost.
          # $GITHUB_ENV carries them from the agent's step into every step that
          # follows, and a step-level env: is what outranks that. On every
          # shell step of these jobs, not only the ones around an agent -- the
          # boundary check, the capture holding the R2 keys and the pushes
          # carrying the App token all start a bash too. Setting them here also
          # means the environment comparison sees the same names on both sides,
          # which is the point: they are neutral there because they are neutral
          # everywhere.
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_DEBUG: ""
          # Not "": the loader splits this like PATH, where an empty entry
          # means the current directory, and Actions offers no way to unset a
          # variable the agent may have set.
          LD_LIBRARY_PATH: /nonexistent
        run: |
          set -euo pipefail
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          case "$MAX_NEW" in *[!0-9]*|"") echo "::error::max_new must be an integer"; exit 1;; esac
          case "$MAX_QUESTIONS" in *[!0-9]*|"") echo "::error::max_questions must be an integer"; exit 1;; esac
          name="content/replenish-$(date -u +%F)-${{ github.run_id }}"
          git checkout -b "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # The agents have no shell, so the caps reach them as a file, not
          # as environment or prompt text. `now` is there for the same reason:
          # the author agent has no clock, and asking it to invent the time of
          # day put a coin flip on the fatal path -- a guess later than this
          # 06:30 UTC run is a future authored.at, which the lint refuses.
          mkdir -p _run _agent
          printf '{ "max_new": %s, "max_questions": %s, "now": "%s" }\n' \
            "$MAX_NEW" "$MAX_QUESTIONS" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _run/limits.json
          cp _run/from-discover/_run/candidates.json _run/candidates.json
          node scripts/content-quality-report.mjs --json > _run/report-before.json
          echo "new_pages=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("_run/candidates.json","utf8")).newPages.length)')" >> "$GITHUB_OUTPUT"

      # Nebius Token Factory speaks OpenAI chat-completions; the CLI speaks the
      # Anthropic Messages API. This translates between them on loopback, so
      # ANTHROPIC_BASE_URL above reaches a real endpoint. It writes nothing to
      # the workspace and dies with the job.
      - name: Start the Nebius relay
        if: env.PROVIDER == 'nebius'
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NEBIUS_API_KEY:-}" ]; then
            echo "::error::provider is nebius but no NEBIUS_API_KEY secret is configured"
            exit 1
          fi
          nohup python3 scripts/nebius-relay.py > "$RUNNER_TEMP/relay.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8787/health > /dev/null || {
            echo "::error::the relay did not come up"; cat "$RUNNER_TEMP/relay.log"; exit 1; }

      # Objective mapping is a judgement call the deterministic step cannot
      # make from a URL; the agent chooses, replenish-prepare validates. It
      # may pick only urls the report offered and only objectives the course
      # maps define, and it can write exactly one file.
      # The agents' grant is the unscoped Write tool, so this is what bounds
      # them outside content/questions and their own scratch file: a digest of
      # everything the following steps trust, taken while nothing but this
      # workflow has run. The digest is kept in the step's OUTPUT, not in a
      # file: the agent can rewrite any file in the workspace, and the runner's
      # step-output store is not a path.
      - name: Snapshot what the agent must not touch
        if: steps.branch.outputs.new_pages != '0'
        id: selector-guard
        env:
          # Read while the shell or the loader starts, before the first line of
          # this script: a check written inside the script has already lost.
          # $GITHUB_ENV carries them from the agent's step into every step that
          # follows, and a step-level env: is what outranks that. On every
          # shell step of these jobs, not only the ones around an agent -- the
          # boundary check, the capture holding the R2 keys and the pushes
          # carrying the App token all start a bash too. Setting them here also
          # means the environment comparison sees the same names on both sides,
          # which is the point: they are neutral there because they are neutral
          # everywhere.
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_DEBUG: ""
          # Not "": the loader splits this like PATH, where an empty entry
          # means the current directory, and Actions offers no way to unset a
          # variable the agent may have set.
          LD_LIBRARY_PATH: /nonexistent
        run: |
          set -euo pipefail
          # Every utility below is resolved from /usr/bin, which is root-owned,
          # rather than from PATH. A file named sha256sum or env dropped into a
          # directory that is ALREADY on PATH -- ~/.bun/bin is on it and the
          # runner user owns it -- would be resolved by this very script, and a
          # sha256sum that prints the expected digest, or an env that filters a
          # variable out of its own output, defeats the check from inside. The
          # fallback keeps the block runnable off a runner, where these live
          # elsewhere.
          bin() { if [ -x "/usr/bin/$1" ]; then printf %s "/usr/bin/$1"; else command -v "$1"; fi; }
          SHA=$(bin sha256sum)
          FIND=$(bin find)
          SORT=$(bin sort)
          XARGS=$(bin xargs)
          CUT=$(bin cut)
          ENVX=$(bin env)
          DIFF=$(bin diff)
          GIT=$(bin git)
          RM=$(bin rm)
          # Everything a later step trusts and no agent is told to write:
          # _run/ (which the boundary check excludes and .gitignore hides),
          # .git/hooks, and every configuration file the tools the later steps
          # run will read. This is deliberately not a snapshot of the machine
          # -- node_modules, the bun cache and the action's own temp churn on
          # every run -- but of what those steps execute or read as config:
          # git's three config levels (system, XDG or $HOME, repository; git
          # reads the XDG file *in addition to* ~/.gitconfig, and one
          # core.hooksPath there is arbitrary code on the next git command),
          # npm's and bun's per-user files, and the resolution of PATH itself.
          # The lines carry absolute paths, so repointing $HOME or
          # $XDG_CONFIG_HOME through $GITHUB_ENV changes the manifest as surely
          # as editing the file it lands on.
          manifest() {
            {
              "$FIND" _run .git/hooks -type f -print0 2>/dev/null | LC_ALL=C "$SORT" -z | "$XARGS" -0 -r "$SHA"
              for f in "$HOME/.gitconfig" "${XDG_CONFIG_HOME:-$HOME/.config}/git/config" \
                       /etc/gitconfig "$HOME/.npmrc" "$HOME/.bunfig.toml"; do
                if [ -f "$f" ]; then "$SHA" "$f"; else echo "absent $f"; fi
              done
              # .git/config is NOT hashed as bytes, and it is the one file here
              # that cannot be: claude-code-action rewrites four of its keys on
              # every run, from src/github/operations/git-config.ts at the pin
              # in this file -- `git config user.name`, `git config user.email`,
              # `git remote set-url origin` with the token embedded, and
              # `git config --unset-all http.<server>/.extraheader`, which
              # removes what actions/checkout put there. Byte equality across an
              # agent step is therefore unattainable, and the guard failed on it
              # on run 34696477988 with no agent involvement.
              #
              # Every OTHER key is compared, value by value and hashed (the
              # origin url holds a token, so nothing here prints a value). A key
              # the action starts writing that is not on this list fails the
              # comparison rather than passing quietly, which is the direction
              # this has to fail in. The separate invariant below is what covers
              # the execution surface -- a filter.*.smudge planted here is what
              # dee48d2 is about, and it is caught by shape, not by diff.
              "$GIT" config --list --local -z 2>/dev/null | while IFS= read -r -d '' kv; do
                key=${kv%%$'\n'*}
                case "$key" in
                  user.name|user.email) continue ;;
                  http.*.extraheader) continue ;;
                  remote.origin.url)
                    # NOT skipped. This is where the credentialed `git push` in
                    # a later step goes, and a repoint to a local bare repo is
                    # served by that repo's `git receive-pack`, which runs ITS
                    # pre-receive hook -- arbitrary code in the step carrying
                    # the App token, routing around the .git/hooks hash by
                    # changing whose hooks run. Only the credential is
                    # normalised away, because actions/checkout leaves none and
                    # the action embeds the App token while both name the same
                    # repository, together with a trailing .git, which the
                    # action adds and checkout does not. Scheme, host and path
                    # all still have to match.
                    url=${kv#*$'\n'}
                    case "$url" in
                      *://*)
                        scheme=${url%%://*}
                        rest=${url#*://}
                        case "${rest%%/*}" in *@*) rest=${rest#*@} ;; esac
                        url="$scheme://$rest"
                        ;;
                    esac
                    url=${url%.git}
                    printf 'gitconfig %s %s\n' "$key" \
                      "$(printf '%s' "$url" | "$SHA" | "$CUT" -d" " -f1)"
                    continue
                    ;;
                esac
                printf 'gitconfig %s %s\n' "$key" \
                  "$(printf '%s' "${kv#*$'\n'}" | "$SHA" | "$CUT" -d" " -f1)"
              done | LC_ALL=C "$SORT"
              # And the execution surface, by SHAPE rather than by diff: the
              # names of every git configuration key that can run a command,
              # from every level git reads, includes followed. A planted
              # `filter.x.smudge` -- the reachable path dee48d2 closed, since a
              # smudge filter is a shell command and needs no execute bit --
              # appears here as a new line and fails the comparison, whatever
              # the file it was written into. Names only: values can hold a
              # token, and the name alone is the finding. A key the runner image
              # already carries sits on both sides and raises nothing, which is
              # why this is in the manifest instead of an assertion that the set
              # is empty. Keys are lowercased by `git config --list`, so the
              # patterns are too -- `core.hooksPath` is `core.hookspath` here.
              "$GIT" config --list --name-only -z 2>/dev/null | while IFS= read -r -d '' key; do
                case "$key" in
                  filter.*.smudge|filter.*.clean|filter.*.process| \
                  core.hookspath|core.fsmonitor|core.sshcommand|core.askpass| \
                  core.pager|core.editor|core.attributesfile| \
                  include.path|includeif.*.path|alias.*| \
                  credential.helper|credential.*.helper| \
                  diff.*.command|diff.*.textconv|merge.*.driver| \
                  gpg.program|gpg.*.program|init.templatedir|ssh.variant| \
                  pager.*|trailer.*.command)
                    echo "gitexec $key" ;;
                esac
              done | LC_ALL=C "$SORT"
              # The binaries themselves, resolved the way the following steps
              # will resolve them. The runner user owns the directories some of
              # these live in -- ~/.bun/bin above all -- so "the agent cannot
              # write them" is false, and the next step runs `bun install`.
              for c in git node bun gh; do
                p=$(command -v "$c" 2>/dev/null || true)
                if [ -n "$p" ]; then "$SHA" "$p"; else echo "absent $c"; fi
              done
              # Every environment variable, not a list of the dangerous ones:
              # $GITHUB_ENV is a per-step file, so the agent's copy is gone by
              # the time this runs, but what it did is visible here. Values are
              # hashed, so the diff this feeds names variables and never prints
              # a secret. Excluded are the ones the runner legitimately changes
              # between two steps, plus PATH, which is compared entry by entry
              # below because the action's own setup-bun step touches it.
              "$ENVX" -0 | LC_ALL=C "$SORT" -z | while IFS= read -r -d '' kv; do
                case "${kv%%=*}" in
                  PATH|EXPECTED_DIGEST|EXPECTED_PATH) continue ;;
                  GITHUB_ACTION|GITHUB_ACTION_PATH|GITHUB_ACTION_REPOSITORY) continue ;;
                  # Set by the runner per step, like the three above, and seen
                  # to change across an agent step on run 34696477988 with no
                  # agent involvement.
                  GITHUB_ARTIFACTS|GITHUB_ARTIFACTS_LIST) continue ;;
                  GITHUB_ENV|GITHUB_PATH|GITHUB_OUTPUT|GITHUB_STATE|GITHUB_STEP_SUMMARY) continue ;;
                  # No arm for INPUT_* or STATE_*: the runner sets those when it
                  # invokes an action, never for a `run:` step like this one, so
                  # excluding them would hide the one namespace whose only
                  # possible origin here is $GITHUB_ENV -- and download-artifact
                  # below reads INPUT_GITHUB-TOKEN, INPUT_REPOSITORY and
                  # INPUT_RUN-ID from exactly there.
                esac
                printf '%s %s\n' "${kv%%=*}" "$(printf '%s' "${kv#*=}" | "$SHA" | "$CUT" -d" " -f1)"
              done
            }
          }
          manifest > "${RUNNER_TEMP}/selector-guard.txt"
          echo "digest=$("$SHA" < "${RUNNER_TEMP}/selector-guard.txt" | "$CUT" -d" " -f1)" >> "$GITHUB_OUTPUT"
          # PATH cannot go in the manifest: the action installs bun and
          # prepends its directory through $GITHUB_PATH, so PATH legitimately
          # differs after the agent step. Carry it in the output instead and
          # compare entry by entry below.
          echo "path=$PATH" >> "$GITHUB_OUTPUT"
          # Every agent in this job writes $RUNNER_TEMP/claude-execution-output.json,
          # and the check that decides whether THIS one ran reads that one path.
          # Clearing it here -- the step immediately before the agent -- is what
          # lets an absent file mean "this attempt reported nothing" rather than
          # "the previous agent's answer". It is outside the manifest by
          # construction: nothing above hashes $RUNNER_TEMP, so the digest this
          # step just published is unaffected.
          "$RM" -f "$RUNNER_TEMP/claude-execution-output.json"

      - name: Author agent selects pages to capture
        id: selector-agent
