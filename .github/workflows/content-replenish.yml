          # this script: a check written inside the script has already lost.
          # $GITHUB_ENV carries them from the agent's step into every step that
          # follows, and a step-level env: is what outranks that. On every
          # shell step of these jobs, not only the ones around an agent -- the
          # boundary check, the capture holding the R2 keys and the pushes
          # carrying the App token all start a bash too. Setting them here also
          # means the environment comparison sees the same names on both sides,
          # which is the point: they are neutral there because they are neutral
          # everywhere.
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_DEBUG: ""
          # Not "": the loader splits this like PATH, where an empty entry
          # means the current directory, and Actions offers no way to unset a
          # variable the agent may have set.
          LD_LIBRARY_PATH: /nonexistent
        run: |
          set -euo pipefail
          # Every utility below is resolved from /usr/bin, which is root-owned,
          # rather than from PATH. A file named sha256sum or env dropped into a
          # directory that is ALREADY on PATH -- ~/.bun/bin is on it and the
          # runner user owns it -- would be resolved by this very script, and a
          # sha256sum that prints the expected digest, or an env that filters a
          # variable out of its own output, defeats the check from inside. The
          # fallback keeps the block runnable off a runner, where these live
          # elsewhere.
