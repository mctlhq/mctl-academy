name: Agy PR review

# Calls the shared reusable agy reviewer workflow from mctlhq/.github
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  agy-review:
    uses: mctlhq/.github/.github/workflows/agy-review.yml@main
    permissions:
      contents: read
      pull-requests: write
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    with:
      conventions: |
        Focus on: correctness bugs, security issues, weakening of the content evidence gate (scripts/validate-content.mjs, content/schemas/), attempt-immutability violations, trust in client-supplied timing, new columns/fields holding personal learner data beyond GitHub numeric id and login, missing error handling, and missing tests for changed behavior.
