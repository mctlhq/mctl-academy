name: Claude PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    # pull_request: skip drafts and fork PRs (CLAUDE_CODE_OAUTH_TOKEN unavailable to forks)
    # issue_comment: only fire on PR comments containing '@claude review' from a
    # maintainer (association pre-filter here; hard write-permission + same-repo
    # check in the first step below) — this repository is public, so an ungated
    # comment trigger lets any passerby burn review quota or prompt-inject the
    # reviewer.
    if: >
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      # author_association alone is too coarse (MEMBER = any org member,
      # COLLABORATOR includes read-only). Require actual write access, and
      # refuse comment-triggered runs on fork PRs — the job would check out
      # refs/pull/N/head, making fork-controlled files the workspace while the
      # OAuth secret is available.
      - name: Gate comment-triggered runs (write permission + same-repo)
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PERM=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission" --jq .permission)
          case "$PERM" in
            admin|maintain|write) ;;
            *) echo "::error::@claude review requires write access (commenter has: $PERM)"; exit 1 ;;
          esac
          CROSS=$(gh pr view "${{ env.PR_NUMBER }}" --repo "${{ github.repository }}" --json isCrossRepository --jq .isCrossRepository)
          if [ "$CROSS" != "false" ]; then
            echo "::error::comment-triggered review is not supported on fork PRs"
            exit 1
          fi

      - name: Resolve PR branch for issue_comment trigger
        if: github.event_name == 'issue_comment'
        id: pr-ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=$(gh pr view ${{ env.PR_NUMBER }} --repo ${{ github.repository }} --json headRefName -q .headRefName)
          echo "ref=$ref" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          ref: ${{ steps.pr-ref.outputs.ref }}

      - name: Classify PR and pick model
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=${{ env.PR_NUMBER }}
          files=$(gh pr view "$PR" --repo ${{ github.repository }} \
            --json files --jq '[.files[].path] | join("\n")')
          lines=$(gh pr diff "$PR" --repo ${{ github.repository }} 2>/dev/null \
            | grep -c '^[+-][^+-]' || true)

          # Content-only PRs are deliberately NOT reviewed by an LLM. They are
          # gated by the deterministic evidence CI plus human CODEOWNER
          # approval, and a model asked to judge question quality would be
          # re-checking another model's output — precisely the LLM-checking-LLM
          # loop the content pipeline is built to avoid. Schemas are excluded
          # from "content" here: they are code, and a bad schema silently
          # weakens the gate for every future question.
          skip=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              content/schemas/*) skip=false; break ;;
              content/questions/*|content/lessons/*|content/sources/*) ;;
              *) skip=false; break ;;
            esac
          done <<< "$files"
          echo "skip=$skip" >> $GITHUB_OUTPUT

          score=1
          while IFS= read -r f; do
            # The evidence gate and anything that can leak learner data or
            # break attempt immutability → top tier.
            if echo "$f" | grep -qE '^(scripts/|content/schemas/|src/(db|routes|services|auth)/|\.github/workflows/)'; then
              score=3; break
            elif echo "$f" | grep -qE '\.(ts|mjs|js)$' && ! echo "$f" | grep -qE '\.(test|spec)\.(ts|mjs|js)$'; then
              [ $score -lt 2 ] && score=2
            fi
          done <<< "$files"
          if [ "$lines" -gt 400 ] && [ $score -lt 3 ]; then
            score=$((score + 1))
          fi
          case $score in
            3) model="claude-opus-4-7" ;;
            2) model="claude-sonnet-4-6" ;;
            *) model="claude-haiku-4-5-20251001" ;;
          esac
          echo "model=$model" >> $GITHUB_OUTPUT
          echo "PR #$PR: model=$model score=$score lines=$lines skip=$skip"

      - name: Check fallback token availability
        id: token-check
        env:
          TOKEN2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
        run: |
          if [ -n "$TOKEN2" ]; then
            echo "has_fallback=true" >> $GITHUB_OUTPUT
          else
            echo "has_fallback=false" >> $GITHUB_OUTPUT
          fi

      - name: Claude review
        id: review
        if: steps.classify.outputs.skip != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@51ea8ea73a139f2a74ff649e3092c25a904aed7e # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            You are the automated code reviewer for this pull request. Review
            the PR diff thoroughly.

            mctl Academy is a free study tool for an agentic AI certification.
            It is NOT a secure assessment: the repository is public and the
            answer key is public with it. Do not raise findings premised on
            hiding answers from a determined reader.

            What matters most here, in order:

            - The evidence gate. scripts/validate-content.mjs and
              content/schemas/ are the only thing standing between a
              hallucinated question and a published one. Any change that
              weakens a check, makes a failure non-fatal, or lets an item reach
              `published` without `reviewed` and a verified citation is a P1.
            - Attempt immutability. A submitted attempt must never change when
              a question is edited or retired. Watch for attempt rows that
              reference live content instead of a snapshot.
            - Server-authoritative timing. Mock expiry is decided by
              server-side UTC started_at/expires_at and server receipt time.
              Any trust in a client-supplied clock or duration is a P1.
            - Learner data. GitHub numeric id and login only. No email, no
              analytics. Account deletion must cascade. A new column holding
              personal data contradicts PRIVACY.md and is a P1.
            - Clean-room policy. CONTENT-POLICY.md separates who authors items
              (agents) from who approves them (a human). Code that lets a human
              land item text, or that removes the authored.by agent check, is a
              P1 regardless of how it is framed.
            - Ordinary correctness: edge cases, error handling, unhandled
              promise rejections, missing await, swallowed errors, auth and
              session handling, CSRF, rate limits.
            - Test coverage: behaviour changed without a corresponding test.

            Follow this repository's conventions: conventional commits,
            English only, no emoji, no direct commits to main.

            If the diff is trivial — config/values YAML, a dependency bump with
            no logic change, docs or comments only, or a one-line typo —
            approve with a one-line reason and nothing else:
            `gh pr review ${{ env.PR_NUMBER }} --repo ${{ github.repository }} --approve --body "<reason>"`.

            Otherwise post each finding as an inline comment using the
            mcp__github_inline_comment__create_inline_comment tool, prefixed
            with a severity tag:
            - P1 — must fix before merge (bug, security hole, data loss, a
              weakened content gate).
            - P2 — should fix before merge (likely bug, missing test, unsafe
              pattern).
            - P3 — nice to have (style, minor nit); does not block merge.

            Finish by submitting a single PR review verdict. Include the
            P1/P2/P3 counts in the body; be concise and do not restate the diff:
            - No P1/P2 findings (P3 nits are fine): approve —
              `gh pr review ${{ env.PR_NUMBER }} --repo ${{ github.repository }} --approve --body "No P1/P2 findings (<n> P3). Good to merge."`
            - One or more P1/P2 findings: request changes —
              `gh pr review ${{ env.PR_NUMBER }} --repo ${{ github.repository }} --request-changes --body "Has P1/P2 findings, changes requested: <summary>"`
          claude_args: '--model ${{ steps.classify.outputs.model }} --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'

      - name: Check primary review actually succeeded
        # The action can report outcome=success while the underlying SDK call
        # errored (e.g. instant quota exhaustion) — outcome alone silently
        # skips the fallback below. Read the raw execution output the action
        # always writes to confirm the run really finished cleanly.
        id: review-check
        if: always() && steps.classify.outputs.skip != 'true'
        run: |
          OUT="$RUNNER_TEMP/claude-execution-output.json"
          is_error="false"
          if [ -f "$OUT" ]; then
            is_error=$(jq -r '
              if type != "array" then "false"
              else ([.[] | select(.type == "result")] | if length > 0 then (.[-1].is_error // false | tostring) else "false" end)
              end' "$OUT" 2>/dev/null || echo "false")
          fi
          if [ "${{ steps.review.outcome }}" = "failure" ] || [ "$is_error" = "true" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reset git state before fallback
        if: steps.review-check.outputs.failed == 'true' && steps.token-check.outputs.has_fallback == 'true'
        run: git checkout . && git clean -fd

      - name: Claude review (fallback token)
        if: steps.review-check.outputs.failed == 'true' && steps.token-check.outputs.has_fallback == 'true'
        uses: anthropics/claude-code-action@51ea8ea73a139f2a74ff649e3092c25a904aed7e # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            You are the automated code reviewer for this pull request. Review
            the PR diff thoroughly.

            mctl Academy is a free study tool for an agentic AI certification.
            It is NOT a secure assessment: the repository is public and the
            answer key is public with it. Do not raise findings premised on
            hiding answers from a determined reader.

            What matters most here, in order:

            - The evidence gate. scripts/validate-content.mjs and
              content/schemas/ are the only thing standing between a
              hallucinated question and a published one. Any change that
              weakens a check, makes a failure non-fatal, or lets an item reach
              `published` without `reviewed` and a verified citation is a P1.
            - Attempt immutability. A submitted attempt must never change when
              a question is edited or retired. Watch for attempt rows that
              reference live content instead of a snapshot.
            - Server-authoritative timing. Mock expiry is decided by
              server-side UTC started_at/expires_at and server receipt time.
              Any trust in a client-supplied clock or duration is a P1.
            - Learner data. GitHub numeric id and login only. No email, no
              analytics. Account deletion must cascade. A new column holding
              personal data contradicts PRIVACY.md and is a P1.
            - Clean-room policy. CONTENT-POLICY.md separates who authors items
              (agents) from who approves them (a human). Code that lets a human
              land item text, or that removes the authored.by agent check, is a
              P1 regardless of how it is framed.
            - Ordinary correctness: edge cases, error handling, unhandled
              promise rejections, missing await, swallowed errors, auth and
              session handling, CSRF, rate limits.
            - Test coverage: behaviour changed without a corresponding test.

            Follow this repository's conventions: conventional commits,
            English only, no emoji, no direct commits to main.

            If the diff is trivial — config/values YAML, a dependency bump with
            no logic change, docs or comments only, or a one-line typo —
            approve with a one-line reason and nothing else:
            `gh pr review ${{ env.PR_NUMBER }} --repo ${{ github.repository }} --approve --body "<reason>"`.

            Otherwise post each finding as an inline comment using the
            mcp__github_inline_comment__create_inline_comment tool, prefixed
            with a severity tag:
            - P1 — must fix before merge (bug, security hole, data loss, a
              weakened content gate).
            - P2 — should fix before merge (likely bug, missing test, unsafe
              pattern).
            - P3 — nice to have (style, minor nit); does not block merge.

            Finish by submitting a single PR review verdict. Include the
            P1/P2/P3 counts in the body; be concise and do not restate the diff:
            - No P1/P2 findings (P3 nits are fine): approve —
              `gh pr review ${{ env.PR_NUMBER }} --repo ${{ github.repository }} --approve --body "No P1/P2 findings (<n> P3). Good to merge."`
            - One or more P1/P2 findings: request changes —
              `gh pr review ${{ env.PR_NUMBER }} --repo ${{ github.repository }} --request-changes --body "Has P1/P2 findings, changes requested: <summary>"`
          claude_args: '--model ${{ steps.classify.outputs.model }} --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
