name: Claude PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude-review:
    uses: mctlhq/.github/.github/workflows/claude-review.yml@15c334ee3efbcdd55b8207712e918653de100959
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      # dependabot is listed so its PRs get reviewed automatically.
      # Without it claude-code-action hard-fails with "Workflow initiated
      # by non-human actor", and since branch protection requires an
      # approving review, dependabot PRs then sit unmergeable until a
      # maintainer triggers a review by hand.
      allowed-bots: "mctl-claude-remote,github-actions,dependabot"
      # The evidence gate and anything that can leak learner data or break
      # attempt immutability warrant the top model tier.
      sensitive-paths: '^(scripts/|content/schemas/|src/(db|routes|services|auth)/|\.github/workflows/)'
      # Content-only PRs (questions/lessons/sources) are deliberately never
      # sent to an LLM reviewer: they're gated by the deterministic
      # validate-content.mjs evidence check plus human CODEOWNER approval,
      # and an LLM judging another LLM's authored content is the exact
      # LLM-checking-LLM loop that gate exists to avoid. content/schemas/
      # is excluded here (still reviewed) since a bad schema silently
      # weakens the gate for every future question.
      skip-paths: '^content/(questions|lessons|sources)/'
      conventions: |
        mctl Academy is a free study tool for an agentic AI certification.
        It is NOT a secure assessment: the repository is public and the
        answer key is public with it. Do not raise findings premised on
        hiding answers from a determined reader.

        What matters most here, in order:

        - The evidence gate. scripts/validate-content.mjs and
          content/schemas/ are the only thing standing between a
          hallucinated question and a published one. Any change that
          weakens a check, makes a failure non-fatal, or lets an item reach
          `published` without `reviewed` and a verified citation is a P1.
        - Attempt immutability. A submitted attempt must never change when
          a question is edited or retired. Watch for attempt rows that
          reference live content instead of a snapshot.
        - Server-authoritative timing. Mock expiry is decided by
          server-side UTC started_at/expires_at and server receipt time.
          Any trust in a client-supplied clock or duration is a P1.
        - Learner data. GitHub numeric id and login only. No email, no
          analytics. Account deletion must cascade. A new column holding
          personal data contradicts PRIVACY.md and is a P1.
        - Clean-room policy. CONTENT-POLICY.md separates who authors items
          (agents) from who approves them (a human). Code that lets a human
          land item text, or that removes the authored.by agent check, is a
          P1 regardless of how it is framed.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
