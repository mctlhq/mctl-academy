name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # release-please has to open the release PR as somebody. The default
      # GITHUB_TOKEN cannot: "Allow GitHub Actions to create and approve pull
      # requests" is off at the org level, and on mctl-telegram every push to
      # main after 0.59.0 failed with "GitHub Actions is not permitted to
      # create or approve pull requests" until mctl-telegram#498 -- seven
      # releases' worth of commits with no release PR and nothing deployed.
      # Nothing has broken here yet only because there have been no
      # user-facing commits since the last release; the first one would hit
      # the same wall. Minting a token from the mctl-agents App (contents +
      # pull-requests write on every mctlhq repo) sidesteps the setting
      # without turning it back on, and a PR opened with an App token also
      # raises pull_request events, so the release PR gets normal CI instead
      # of the default token's silent one.
      - name: Generate release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-academy
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # mctl-academy is onboarded (services/labs/mctl-academy) — dispatch
      # the centralized release-deploy the same way every other mctlhq
      # service repo does (see mctl-docs/mctl-telegram for the pattern).
      # No values_path override: this repo's gitops values.yaml already
      # lives at the default platform-gitops/services/labs/mctl-academy/
      # values.yaml the dispatch assumes.
      # Uses mctl-agents, the backend-only automation App — deliberately
      # NOT MCTL App (secrets.APP_ID). MCTL App is the App customers install
      # themselves from mctl.ai/#request-access, and it is being narrowed to
      # contents:read + metadata:read so its published least-privilege
      # description is actually true (mctlhq/mctl-gitops#761). A GitHub App's
      # permissions apply to every installation alike, so anything needing
      # write — like actions:write on mctl-gitops to dispatch below — has to
      # live on the internal App instead.
      - name: Generate Platform App token
        if: ${{ steps.release.outputs.release_created == 'true' }}
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops

      - name: Dispatch centralized release-deploy
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh workflow run release-deploy.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f repo=mctlhq/mctl-academy \
            -f git_ref="$TAG" \
            -f image_name=ghcr.io/mctlhq/mctl-academy \
            -f image_tag="$TAG" \
            -f team_name=labs \
            -f component_name=mctl-academy
