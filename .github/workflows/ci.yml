name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  content:
    name: Content lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Structural validation only: no secrets, no network. This is the job
      # that runs identically on a fork PR, which is why citation verification
      # is not part of it — that needs the private snapshot store, and GitHub
      # does not expose secrets to fork-triggered runs.
      - name: Content lint
        run: npm run lint:content

      - name: Content lint tests
        run: npm run test:content

      # Building the preview on every PR keeps the Phase 0 artifact honest:
      # a renderer that only ever runs locally rots without anyone noticing.
      - name: Build course preview
        run: npm run build:preview

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: course-preview
          path: dist/preview/
          retention-days: 14

  client:
    name: Client build and tests
    runs-on: ubuntu-latest
    # Independent of and non-blocking to the content job: this is code CI
    # (client/), which the CONTRIBUTING.md review-gate table treats
    # separately from content lint. A broken client build fails this job
    # without touching content lint results.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Client tests
        working-directory: client
        run: npm run test

      - name: Client build
        working-directory: client
        run: npm run build
