name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  content:
    name: Content lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Structural validation only: no secrets, no network. This is the job
      # that runs identically on a fork PR, which is why citation verification
      # is not part of it — that needs the private snapshot store, and GitHub
      # does not expose secrets to fork-triggered runs.
      - name: Content lint
        run: bun run lint:content

      - name: Content lint tests
        run: bun run test:content

      # Building the preview on every PR keeps the Phase 0 artifact honest:
      # a renderer that only ever runs locally rots without anyone noticing.
      - name: Build course preview
        run: bun run build:preview

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: course-preview
          path: dist/preview/
          retention-days: 14

  client:
    name: Client build and tests
    runs-on: ubuntu-latest
    # Independent of and non-blocking to the content job: this is code CI
    # (client/), which the CONTRIBUTING.md review-gate table treats
    # separately from content lint. A broken client build fails this job
    # without touching content lint results.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install client dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      - name: Server tests
        run: npm run test:server

      - name: Client tests
        working-directory: client
        run: npm run test

      - name: Client build
        working-directory: client
        run: npm run build

  migrations:
    name: Migration up/down against an empty database
    runs-on: ubuntu-latest
    # Proves the migrations in migrations/ actually apply to a database that
    # has never seen this app before, and that down is a true inverse of up —
    # neither is exercised by the other jobs, which run entirely in-memory.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mctl_academy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mctl_academy_ci
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Migrate up against an empty database
        run: bun run migrate

      - name: Migrate up is idempotent (no pending migrations left)
        run: bun run migrate

      - name: Migrate down reverses cleanly
        run: bun run migrate:down
