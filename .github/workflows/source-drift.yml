name: Source drift

# Weekly: re-fetch every allowlisted source and compare hashes. When an
# upstream document changes, mark the source as `drifted` (fail-closed
# quarantine), move its published dependents to `needs_review`, rebuild the
# client content bundle, push all of that to the `chore/quarantine-drift`
# branch as one pull request, and open or update a `drift: <id>` issue per
# source.
#
# Why a PR and not a push to main: main requires an approving review, so the
# three direct-push attempts this job used to make never once succeeded (runs
# of 2026-08-24 and 2026-08-31 both fell through to a fallback PR). The branch
# name is fixed and force-pushed, so a source that stays drifted for a month
# keeps updating one PR instead of opening a new one every Monday.
#
# Why an App token: the org forbids GITHUB_TOKEN from creating pull requests
# (`can_approve_pull_request_reviews: false`, see mctl-telegram#498), and a PR
# opened by an App token raises `pull_request` events, so the quarantine PR
# gets the same CI and Evidence checks as any other branch.

on:
  schedule:
    # Mondays 06:00 UTC — a drifted doc waits at most a week, and the review it
    # triggers lands on a weekday rather than a Sunday.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

# Two overlapping runs would race on the same quarantine branch.
concurrency:
  group: source-drift
  cancel-in-progress: false

env:
  QUARANTINE_BRANCH: chore/quarantine-drift

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Generate mctl-agents App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-academy
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      # Bun, matching ci.yml and content-evidence.yml: the repository ships
      # only bun.lock, so setup-node with `cache: npm` aborted every run.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Check sources for drift and mark quarantine
        id: check
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set +e
          npm run --silent snapshot:capture -- --check --mark-drifted | tee drift.txt
          code=${PIPESTATUS[0]}
          set -e
          # 0 = clean, 2 = drift found, 1 = the check itself failed. Only 1 is
          # a build failure: drift is the expected finding this job exists for,
          # and an unreachable docs site is a real error worth a red run.
          case "$code" in
            0) echo "drifted=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "drifted=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::source drift check failed"; exit 1 ;;
          esac

      # Second half of the lifecycle SOURCES.md documents ("Dependent published
      # questions transition published -> needs_review"). checkBundleEligibility
      # already excludes anything citing a drifted source, so either order gives
      # a correct bundle; running this first keeps content/ lint-valid at every
      # intermediate step (#199).
      - name: Quarantine published questions whose source drifted
        if: steps.check.outputs.drifted == 'true'
        run: node scripts/quarantine-drifted-questions.mjs

      - name: Rebuild content bundle to enforce fail-closed quarantine
        if: steps.check.outputs.drifted == 'true'
        run: node scripts/build-content-bundle.mjs

      # Before the PR and the issues that reference them: a label that does
      # not exist yet is silently skipped by the tolerant `--add-label` calls
      # below, and the labels are how the quarantine PR is found (#198).
      - name: Ensure the workflow's labels exist
        if: steps.check.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/drift-intake.mjs --repo "${{ github.repository }}" --ensure-labels-only

      - name: Push the quarantine branch and open or update its pull request
        if: steps.check.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT_EMAIL: mctl-agents[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git config user.name "mctl-agents[bot]"
          git config user.email "$BOT_EMAIL"
          git add content/sources/ content/questions/ client/src/content-bundle.json client/src/course-catalog.json
          if git diff --staged --quiet; then
            echo "No new quarantine changes to commit."
            exit 0
          fi
          # The branch is rebuilt from main on every run and force-pushed, so
          # an older quarantine commit (possibly stale against main) is
          # replaced, not stacked on. The one thing a force-push must never
          # do is discard a human's fix-in-place on the OPEN pull request: if
          # that PR's tip was not written by this job, leave the branch alone
          # and fail loudly. With no open PR the branch is merged or
          # abandoned and rebuilding it is exactly right, so the guard clears
          # itself after a merge. ls-remote first: a branch that does not
          # exist yet and a fetch that failed are different cases, and only
          # the first one may fall through to the push.
          if git ls-remote --exit-code --heads origin "$QUARANTINE_BRANCH" >/dev/null; then
            git fetch origin "$QUARANTINE_BRANCH"
            remote_author=$(git log -1 --format=%ae FETCH_HEAD)
            open_pr=$(gh pr list --repo "$REPO" --state open --head "$QUARANTINE_BRANCH" --json number --jq '.[0].number // empty')
            if [ -n "$open_pr" ] && [ "$remote_author" != "$BOT_EMAIL" ]; then
              echo "::error::PR #${open_pr} on $QUARANTINE_BRANCH has a commit by $remote_author; not overwriting it. Merge or close that PR to let the next run rebuild the branch."
              exit 1
            fi
          fi
          git checkout -B "$QUARANTINE_BRANCH"
          git commit -m "chore(quarantine): auto-quarantine drifted sources and rebuild bundle"
          git push --force origin "HEAD:${QUARANTINE_BRANCH}"

          existing=$(gh pr list --repo "$REPO" --state open --head "$QUARANTINE_BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "quarantine PR #${existing} updated"
            gh pr comment "$existing" --repo "$REPO" --body "Rebuilt from main by run ${RUN_URL}."
            exit 0
          fi
          # PR creation is the load-bearing step: it is what turns a quarantine
          # commit on a side branch into something a human sees. Labels are
          # not: apply each with its own failure tolerance (#198, #199).
          pr_url=$(gh pr create --repo "$REPO" --base main --head "$QUARANTINE_BRANCH" \
            --title "chore(quarantine): auto-quarantine drifted sources" \
            --body "Upstream documentation drift detected by ${RUN_URL}.

          Sources marked \`drifted\` and their published questions moved to \`needs_review\`; the client bundle is rebuilt without them. Merge to deploy the fail-closed bundle. This branch is rebuilt from main on every drift run.")
          echo "opened $pr_url"
          for label in "agents:quarantine" "content:drift"; do
            gh pr edit "$pr_url" --repo "$REPO" --add-label "$label" \
              || echo "::warning::could not add label '$label' to $pr_url"
          done

      # Runs even when the push step failed: the issues are the signal a human
      # acts on, and losing them because a push raced is the wrong trade.
      - name: Open or update intake issues
        if: ${{ !cancelled() && steps.check.outputs.drifted == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/drift-intake.mjs --report drift.txt --repo "${{ github.repository }}" --label content:drift
