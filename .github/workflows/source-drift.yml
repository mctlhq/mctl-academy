name: Source drift

# Weekly: re-fetch every allowlisted source and compare hashes. When an
# upstream document changes, automatically mark the source as `drifted`
# (fail-closed quarantine), rebuild the client content bundle to immediately
# exclude unverified questions, commit the quarantine state to main, and
# open/update an agents:intake issue.

on:
  schedule:
    # Mondays 06:00 UTC — a drifted doc waits at most a week, and the review it
    # triggers lands on a weekday rather than a Sunday.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check sources for drift and mark quarantine
        id: check
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set +e
          npm run --silent snapshot:capture -- --check --mark-drifted | tee drift.txt
          code=${PIPESTATUS[0]}
          set -e
          # 0 = clean, 2 = drift found, 1 = the check itself failed. Only 1 is
          # a build failure: drift is the expected finding this job exists for,
          # and an unreachable docs site is a real error worth a red run.
          case "$code" in
            0) echo "drifted=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "drifted=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::source drift check failed"; exit 1 ;;
          esac

      - name: Rebuild content bundle to enforce fail-closed quarantine
        if: steps.check.outputs.drifted == 'true'
        run: |
          node scripts/build-content-bundle.mjs

      - name: Commit and push quarantine updates to main
        if: steps.check.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/sources/ client/src/content-bundle.json client/src/course-catalog.json
          git commit -m "chore(quarantine): auto-quarantine drifted sources and rebuild bundle"
          git push origin main

      - name: Open or update intake issues
        if: steps.check.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep '^DRIFTED' drift.txt | while read -r _ id old _ new url; do
            # Deterministic dedup key. Searching on the exact title is what
            # keeps a source that stays drifted for a month from accumulating
            # four identical issues.
            title="drift: ${id}"
            existing=$(gh issue list --repo "${{ github.repository }}" \
              --state open --search "\"${title}\" in:title" \
              --json number,title \
              --jq "[.[] | select(.title == \"${title}\")] | .[0].number // empty")

            body="Upstream source changed. Automatically marked \`status: drifted\` (fail-closed quarantine committed to main).

          - source: \`${id}\`
          - url: ${url}
          - recorded hash: \`${old}\`
          - current hash: \`${new}\`

          Questions citing this source have been excluded from learner selection until re-verified.
          Re-capture with:

          \`\`\`
          npm run snapshot:capture -- ${url} --id ${id} --objective <objective>
          \`\`\`

          See SOURCES.md and CONTENT-POLICY.md."

            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
              echo "updated existing issue #${existing} for ${id}"
            else
              gh issue create --repo "${{ github.repository }}" \
                --title "$title" --body "$body" --label "agents:intake"
              echo "opened new issue for ${id}"
            fi
          done
