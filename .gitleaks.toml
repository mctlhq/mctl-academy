title = "mctl-academy gitleaks config"

# Extend the default ruleset rather than replacing it.
[extend]
useDefault = true

# `content/sources/*.yaml`'s `sha256:` and `snapshot.key:` fields are the
# SHA-256 content hash of a fetched public documentation page (see
# `SOURCES.md`), used as the R2 object key for the evidence snapshot. High
# entropy hex triggers gitleaks' generic `generic-api-key` rule, but these
# are content-addressed hashes, not credentials — confirmed 2026-08-09 by
# reading every flagged file: each `key:` value matches that same file's own
# `sha256:` field exactly, and there is no other secret-shaped value in the
# repo (`gitleaks detect --log-opts="--all"` over full history, 19/19
# findings were this one pattern).
#
# `condition = "AND"` + `regexTarget = "line"` + `targetRules` is
# deliberate: a bare top-level `[allowlist]` with both `regexes` and `paths`
# set is OR'd by gitleaks, so a path match alone would silently allowlist
# *any* secret in content/sources/*.yaml, not just this one known-safe
# field shape. This form requires both the rule and the exact line shape to
# match, scoped only to generic-api-key, so an actual credential pasted
# into one of these files still gets flagged.
[[allowlists]]
condition = "AND"
regexTarget = "line"
targetRules = ["generic-api-key"]
regexes = ['''(?i)^\s*(sha256|key):\s*[0-9a-f]{32,64}\s*$''']
paths = ['''content/sources/.*\.yaml''']
