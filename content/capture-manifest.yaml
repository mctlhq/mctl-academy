schema_version: 1

# Pages captured by .github/workflows/capture-sources.yml.
#
# Each entry becomes exactly one content/sources/<id>.yaml, written by
# scripts/capture-source.mjs after it fetches the URL, hashes the response
# bytes, and PUTs the snapshot into the private R2 store. Nothing here is read
# at build time: the content loaders only ever walk content/{courses,sources,
# questions,lessons}, so this file is inert to the lint and to the bundler.
#
# Why a committed manifest rather than workflow_dispatch inputs:
#
#   - `objectives` is content. validate-content.mjs cross-checks every entry
#     against the course maps, and it decides which objective a citation can
#     support. It belongs under a CODEOWNERS-reviewed path, not in a run form.
#   - Re-runs must be reproducible. When one page drifts mid-authoring you
#     re-dispatch with `only: <id>` against this same reviewed list, and the
#     diff proves nothing else moved.
#   - SOURCES.md's "Adding a source" requires a stated scope recorded in a PR.
#     This file is that record, diffable beside the allowlist row it justifies.
#
# capture-source.mjs rewrites the whole record from these fields alone — it is
# not a merge. Any objective omitted here disappears on the next capture, and
# hand-added `coverage:`/`notes:` must be re-applied after a re-dispatch. Keep
# each entry's objective list complete.
#
# Sources already captured and verifying are deliberately absent: re-capturing
# them would churn snapshots for no reason. Where an existing record needed an
# extra objective for a second course, that objective was appended to the
# record by hand instead, which changes no bytes and no sha256.

