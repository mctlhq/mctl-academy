stem: 'A team sets `response_format` to `{"type": "json_object"}` and is
  surprised the field names vary between calls. Why?'
options:
  - id: a
    text: The setting only applies to the first message in a conversation
    correct: false
    explanation: Nothing limits the parameter to the opening message.
  - id: b
    text: Field names always vary unless the temperature is set to zero
    correct: false
    explanation: Sampling settings do not determine whether a schema is enforced.
  - id: c
    text: That setting forces arbitrary JSON and lets the model decide the schema
    correct: true
    explanation: Correct. `json_object` guarantees JSON but not any particular
      shape; the model chooses it.
  - id: d
    text: The setting was ignored because a schema was not also supplied
    correct: false
    explanation: It is not ignored; it produces valid JSON of the model's own design.
