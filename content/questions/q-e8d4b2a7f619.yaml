stem: "An agent already has a specific URL, picked from an earlier Search
  result, and wants that page's content. Per Tavily's agent setup guide, which
  capability fits?"
options:
  - id: a
    text: "Extract, since it fits when you already have the URL or picked one from
      Search"
    correct: true
    explanation: "Correct. The guide places Extract here: you already have the URL,
      or picked one from Search."
  - id: b
    text: "Map, since it fits when you need a site's structure before crawling it"
    correct: false
    explanation: "The guide reserves Map for discovering a site's structure, not for
      extracting a URL you already have."
  - id: c
    text: "Crawl, since it fits when many pages on a site must be read"
    correct: false
    explanation: "The guide reserves Crawl for reading many pages across a site, not
      a single known URL."
  - id: d
    text: "Research, since it fits when the output should be a cited, multi-source
      answer"
    correct: false
    explanation: "The guide reserves Research for synthesized, multi-source answers,
      not extracting one known URL's content."
