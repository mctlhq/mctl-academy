stem: "Together with an MLflow cluster, Managed Service for MLflow creates an
  Object Storage bucket to store experiment logs and metrics. What happens to
  that bucket after the MLflow cluster is deleted?"
options:
  - id: a
    text: "It is deleted automatically along with the cluster, so no further action
      is needed"
    correct: false
    explanation: "The quickstart explicitly says the bucket is not deleted
      automatically when the cluster is deleted."
  - id: b
    text: "It becomes read-only but remains free of charge until manually deleted"
    correct: false
    explanation: "The quickstart does not describe a free, read-only state for the
      bucket; it only states that it is not deleted automatically."
  - id: c
    text: "It is automatically migrated to a new cluster if one is created later"
    correct: false
    explanation: "No such automatic migration is documented; the quickstart only
      states that the bucket persists and is not deleted automatically."
  - id: d
    text: "It is not deleted automatically when the cluster is deleted"
    correct: true
    explanation: "Correct. The quickstart states the bucket created for the
      cluster's logs and metrics is not deleted automatically when the cluster
      is deleted."
evidence:
