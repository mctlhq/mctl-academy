stem: "When an automated health check detects a silent GPU memory hardware fault on a node, what is the recovery procedure?"
options:
  - id: a
    text: "Cordoning the node, draining existing workloads, and triggering automated instance replacement"
    correct: true
    explanation: "Cordoning and draining prevents scheduling new jobs on broken GPUs while automated replacement restores capacity."
  - id: b
    text: "Increasing thermal thresholds to bypass hardware alarms"
    correct: false
    explanation: "Bypassing hardware alarms causes permanent physical GPU failure."
  - id: c
    text: "Deleting all node monitoring metrics from the observability database"
    correct: false
    explanation: "Deleting metrics hides physical failure evidence without repairing hardware."
  - id: d
    text: "Re-assigning the degraded GPU node to high-priority production jobs"
    correct: false
    explanation: "Assigning degraded nodes to production jobs causes severe customer outage."
