stem: What does the `dimensions` parameter control in a Create Embeddings
  request?
options:
  - id: a
    text: The dimensionality (size) of each returned embedding vector
    correct: true
    explanation: The `dimensions` field's description states it is the dimensions
      to use for the request, i.e. the length of each embedding vector.
  - id: b
    text: The number of documents included in a single rerank request
    correct: false
    explanation: "`dimensions` belongs to the Embeddings request schema, not the
      Rerank endpoint's documents list."
  - id: c
    text: The maximum number of tokens the model may generate in its reply
    correct: false
    explanation: Embeddings requests do not generate text completions, so there is
      no generated-reply length to cap.
  - id: d
    text: The number of parallel requests processed in one batch
    correct: false
    explanation: "`dimensions` configures the shape of the embedding request body
      itself, not request batching or concurrency."
