stem: "During a LeRobot Human-in-the-Loop (HIL) data collection session, what is
  recorded while the robot is paused (holding its position, before the human
  takes control), versus after the human triggers takeover?"
options:
  - id: a
    text: "Frames are recorded continuously through both the pause and the takeover,
      at the same rate"
    correct: false
    explanation: "The guide specifically says no frames are recorded during pause;
      recording only begins once takeover starts."
  - id: b
    text: "Frames are recorded during the pause but discarded once takeover begins"
    correct: false
    explanation: "The guide does not describe recording during pause at all, let
      alone discarding it later; no frames are recorded during pause in the
      first place."
  - id: c
    text: "No frames are recorded during the pause; once takeover begins, all
      movements are recorded"
    correct: true
    explanation: "Correct. The guide states no frames are recorded during the pause
      step, while after takeover all movements (recovery and correction) are
      recorded as training data."
  - id: d
    text: "Recording stops entirely for the rest of the episode once a pause occurs"
    correct: false
    explanation: "Recording resumes once takeover begins — all movements during
      takeover are recorded — so a pause does not end recording for the rest of
      the episode."
