stem: An engineer with the `editor` role is asked to set up a federation so
  staff can sign in through the company IdP. What blocks them?
options:
  - id: a
    text: Federations can only be created by the account that first signed up for
      the tenant
    correct: false
    explanation: Access is governed by group membership rather than by who
      originally created the tenant.
  - id: b
    text: Managing federations requires the `admin` role, which `editor` does not
      confer
    correct: true
    explanation: Correct. The task requires being in a group holding the admin role
      at tenant or project scope.
  - id: c
    text: Nothing blocks them; `editor` covers all identity configuration
    correct: false
    explanation: The editor role manages most resource types, but identity
      federation is reserved for admins.
  - id: d
    text: They must first be removed from every other group in the tenant
    correct: false
    explanation: Group membership is additive; nothing requires stripping other memberships.
evidence:
  - source_id: src-co-iam-federations
    excerpt: that has the `admin` role within your tenant or project; for example,
      the default `admins` group.
