stem: "Which principle should govern service account access permissions across
  GPU training jobs?"
options:
  - id: a
    text: "Granting full global administrative privileges to every service account"
    correct: false
    explanation: "Excessive permissions break the least-privilege principle."
  - id: b
    text: "Assigning least-privilege IAM roles scoped specifically to required
      storage and compute resources"
    correct: true
    explanation: "Least-privilege IAM roles restrict access to minimum required operations."
  - id: c
    text: "Embedding root password credentials directly inside job scripts"
    correct: false
    explanation: "Hardcoding credentials violates security governance standards."
  - id: d
    text: "Disabling authentication checks on administrative API endpoints"
    correct: false
    explanation: "Disabling authentication exposes infrastructure to unauthorized control."
