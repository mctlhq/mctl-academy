stem: In a `/v1/rerank` response, which field tells a retrieval pipeline how
  well each candidate document matches the query?
options:
  - id: a
    text: "`relevance_score`"
    correct: true
    explanation: The RerankResult schema documents `relevance_score` as the
      relevance score of the document, which is what a pipeline uses to rank
      candidates.
  - id: b
    text: "`total_tokens`"
    correct: false
    explanation: "`total_tokens` is part of RerankUsage and reports token usage for
      the request, not how relevant a document is."
  - id: c
    text: "`embedding`"
    correct: false
    explanation: "`embedding` is a field of the Embedding object returned by the
      `/v1/embeddings` endpoint, not part of a rerank result."
  - id: d
    text: "`owned_by`"
    correct: false
    explanation: "`owned_by` is a field of the Model object returned by the List
      models endpoint, unrelated to reranking documents."
