stem: Which Sandboxes behaviours does the documentation cite as helping to
  prevent abuse when students or agents execute code?
options:
  - id: a
    text: Automatic git commits after every execution
    correct: false
    explanation: Sandboxes offer Git-like branching of execution state, not
      automatic commits, and that feature is not what the docs tie to abuse
      prevention.
  - id: b
    text: Automatic cleanup and resource limits
    correct: true
    explanation: The educational-platforms use case states that automatic cleanup
      and resource limits help prevent abuse; the beta also caps simultaneous
      operations at 50.
  - id: c
    text: DNS pre-fetching for faster downloads
    correct: false
    explanation: DNS behaviour is not mentioned anywhere in the Sandboxes overview.
  - id: d
    text: An unlimited number of simultaneously running operations
    correct: false
    explanation: "The opposite is documented: during the beta, simultaneously
      running operations are limited to 50."
