stem: Which resource control mechanism is typically configured on an agent
  sandbox to prevent runaway code loops?
options:
  - id: a
    text: Automatic git commit triggers
    correct: false
    explanation: Git commits record version control history, not execution resource limits.
  - id: b
    text: Execution timeouts and CPU/memory quotas
    correct: true
    explanation: Timeouts terminate infinite loops and resource quotas prevent
      memory exhaustion.
  - id: c
    text: Domain name DNS pre-fetching
    correct: false
    explanation: DNS pre-fetching speeds up web browser network lookups, not sandbox
      loop limits.
  - id: d
    text: Database table indexing
    correct: false
    explanation: Database indexes speed up SQL queries, not process execution limits.
