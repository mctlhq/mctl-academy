stem: "A platform team finds the preconfigured per-resource dashboards in the Nebius AI Cloud web console show enough metrics for day-to-day checks, but not enough for the custom, advanced visualizations they want to build. What should they do?"
options:
  - id: a
    text: "Integrate Observability Metrics with Prometheus or Grafana to view more metrics and build advanced visualizations"
    correct: true
    explanation: "Correct. The documentation says that to view more metrics and create advanced visualizations, you integrate Observability Metrics with Prometheus or Grafana."
  - id: b
    text: "Switch from the resource's Metrics tab to the Observability → Metrics page in the console, since it shows additional metrics"
    correct: false
    explanation: "Both paths reach the same preconfigured web console dashboards; neither adds the deeper metrics or custom visualizations a Prometheus or Grafana integration provides."
  - id: c
    text: "Shorten the dashboard's time filter so it refreshes more often, surfacing more data points on the same charts"
    correct: false
    explanation: "The refresh interval only changes how often the same preconfigured charts update; it does not add new metrics or visualization options."
  - id: d
    text: "Import a pre-built Grafana dashboard from the Grafana Marketplace without first connecting a Prometheus data source"
    correct: false
    explanation: "The documented steps connect the Prometheus data source first and only then import the dashboard; skipping that step is not the documented path to advanced visualizations."
