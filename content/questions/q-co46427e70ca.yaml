stem: While adding a notification email to an alert, an engineer without admin
  rights sees a much shorter list of contacts than a colleague does. Why?
options:
  - id: a
    text: The list only shows emails that have never been used for notifications
    correct: false
    explanation: The list is drawn from emails already used for notifications, not
      from unused ones.
  - id: b
    text: The list is limited to contacts in the same project as the alert
    correct: false
    explanation: Visibility follows admin rights rather than the project the alert
      belongs to.
  - id: c
    text: Without admin rights, only their own contacts are visible
    correct: true
    explanation: Correct. Admins see all tenant contacts; everyone else sees only their own.
  - id: d
    text: The list hides anyone already subscribed to that same alert
    correct: false
    explanation: Existing subscribers are not filtered out of the list.
