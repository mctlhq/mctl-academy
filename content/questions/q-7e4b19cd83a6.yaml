stem: "In Tavily's Hybrid Research pattern, when should an agent use
  Multi-Agent mode instead of Fast mode to blend its internal knowledge base
  with web results?"
options:
  - id: a
    text: "When accuracy matters more than speed, for comprehensive research
      on complex topics"
    correct: true
    explanation: "Correct. The documentation describes Multi-Agent mode as
      best for comprehensive research, complex topics, and when accuracy
      matters more than speed."
  - id: b
    text: "When it needs quick answers at lower latency in a cost-sensitive
      application"
    correct: false
    explanation: "That is the documentation's description of Fast mode, the
      opposite of what this scenario calls for."
  - id: c
    text: "When it wants structured output instead of a plain-text report"
    correct: false
    explanation: "Structured output is controlled by the `output_schema`
      parameter, which is independent of the `mode` choice."
  - id: d
    text: "When it wants to customize how the report is structured"
    correct: false
    explanation: "Custom report structure is controlled by the
      `research_synthesis_prompt` parameter, which is independent of the
      `mode` choice."
