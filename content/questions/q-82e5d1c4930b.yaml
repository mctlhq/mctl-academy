stem: "You deploy an open-source LLM through a Nebius Serverless AI endpoint
  using the `vllm/vllm-openai` image. What API does the resulting container
  expose?"
options:
  - id: a
    text: "An OpenAI-compatible `/v1/chat/completions` API"
    correct: true
    explanation: "Correct. The tutorial states the container exposes an
      OpenAI-compatible /v1/chat/completions API."
  - id: b
    text: "Managed MLflow's experiment tracking API"
    correct: false
    explanation: "That is a separate Nebius service, Managed Service for MLflow,
      used for logging experiments, not for serving model inference."
  - id: c
    text: "The Container Registry's Docker Registry API for pushing and pulling
      images"
    correct: false
    explanation: "That API belongs to Container Registry, used to manage Docker
      images, not to serving chat completions from a deployed model."
  - id: d
    text: "A Slurm `srun`/`sbatch` job submission interface"
    correct: false
    explanation: "That interface belongs to Soperator Slurm clusters for batch job
      scheduling, not to a Serverless AI endpoint."
