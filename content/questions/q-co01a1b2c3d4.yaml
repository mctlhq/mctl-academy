stem: "When provisioning a high-performance GPU cluster environment, which
  networking configuration ensures low-latency inter-node communication?"
options:
  - id: a
    text: "Pipelining all inter-node compute traffic through public HTTP gateways"
    correct: false
    explanation: "Public HTTP gateways introduce latency overhead and public
      internet exposure."
  - id: b
    text: "Configuring dedicated private VPC subnets with high-bandwidth
      interconnects"
    correct: true
    explanation: "Dedicated private VPC subnets with high-speed interconnects
      optimize GPU cluster throughput."
  - id: c
    text: "Disabling security groups and network interfaces across compute nodes"
    correct: false
    explanation: "Disabling interfaces renders nodes unreachable."
  - id: d
    text: "Enforcing single-threaded HTTP polling on storage endpoints"
    correct: false
    explanation: "Polling causes high CPU idle time and severe bottlenecking."
