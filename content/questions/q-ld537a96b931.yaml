stem: A team stops a dedicated endpoint overnight to save money and expects the same GPUs
  back in the morning. What actually happens?
options:
  - id: a
    text: The GPUs are held for the endpoint and reattached on start
    correct: false
    explanation: Nothing holds the previous GPUs; there is no such mechanism.
  - id: b
    text: The GPUs are held only if the endpoint was stopped manually
    correct: false
    explanation: The release happens regardless of why the endpoint stopped.
  - id: c
    text: Capacity returns to a shared pool and is requested anew on start
    correct: true
    explanation: Correct. Capacity is allocated only while the endpoint runs, and a restart
      re-requests it subject to availability.
  - id: d
    text: The endpoint keeps its minimum replicas reserved while stopped
    correct: false
    explanation: The minimum replicas guarantee applies only while the endpoint is running.
evidence:
  - source_id: src-ld-capacity-and-scaling
    excerpt: When an endpoint stops, its GPU capacity is released back to the shared pool.
