stem: "Which VPC firewall policy prevents unauthorized lateral movement between isolated compute subnets?"
options:
  - id: a
    text: "Restricting ingress and egress security group rules to explicit port ranges and internal subnet CIDRs"
    correct: true
    explanation: "Restricting security group rules to explicit CIDRs and ports prevents unauthorized inter-subnet access."
  - id: b
    text: "Opening all TCP and UDP ports across all subnets to 0.0.0.0/0"
    correct: false
    explanation: "Opening all ports globally exposes subnets to external cyber attacks."
  - id: c
    text: "Disabling stateful packet inspection on internal routers"
    correct: false
    explanation: "Disabling stateful inspection compromises firewall traffic tracking."
  - id: d
    text: "Routing internal traffic over un-encrypted public wireless protocols"
    correct: false
    explanation: "Public wireless routing introduces extreme security risks and high packet loss."
