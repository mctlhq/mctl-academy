stem: "A team wants the highest relevance for a niche query, and latency is not
  a concern. Which `search_depth` value does Tavily's best-practices guide
  recommend?"
options:
  - id: a
    text: "`ultra-fast`, since it prioritizes speed over relevance"
    correct: false
    explanation: "ultra-fast trades relevance for the lowest latency, the opposite
      of what this scenario needs."
  - id: b
    text: "`fast`, since it returns results in reranked chunk format"
    correct: false
    explanation: "fast favors lower latency over relevance, not the deeper coverage
      this scenario needs."
  - id: c
    text: "`basic`, since it is tuned for short, focused lookups"
    correct: false
    explanation: "basic is the lower-latency default for general lookups, not for a
      niche query needing the highest relevance."
  - id: d
    text: "`advanced`, since it searches more broadly and reaches more sources per
      query"
    correct: true
    explanation: "Correct. The guide states advanced searches more broadly and
      reaches more sources per query, delivering the highest relevance at higher
      latency."
