stem: "A team needs to train or fine-tune a model and run batch inference as a one-time task that should terminate automatically once it completes. Which Serverless AI deployment type fits this workload?"
options:
  - id: a
    text: "Devlab"
    correct: false
    explanation: "Wrong. A Devlab is an interactive, long-lived session that you start and stop yourself, intended for coding and prototyping, not a task that terminates on its own."
  - id: b
    text: "Job"
    correct: true
    explanation: "Correct. A Job is for training or fine-tuning models, preprocessing data, or running batch inference, and it is non-interactive: it terminates upon task completion or timeout."
  - id: c
    text: "Endpoint"
    correct: false
    explanation: "Wrong. An Endpoint is interactive and responds to requests until you terminate it; it is meant for serving models, not for a one-time task that finishes on its own."
  - id: d
    text: "A GPU cluster created directly in Compute, outside Serverless AI"
    correct: false
    explanation: "Wrong. Serverless AI runs containerized workloads like this without the user creating or managing virtual machines or clusters directly."
