stem: How can a developer retrieve the extended list of model parameters, such
  as `context_length`, programmatically?
options:
  - id: a
    text: Call the List models endpoint (`GET /v1/models`) with the query parameter
      `verbose=true`
    correct: true
    explanation: The UI page says to send a request to the List models endpoint with
      `verbose=true` for extended parameters; the API reference for `GET
      /v1/models` includes `context_length` in the model object.
  - id: b
    text: Query DNS TXT records for the endpoint host
    correct: false
    explanation: DNS carries no model metadata.
  - id: c
    text: Inspect the git history of the SDK
    correct: false
    explanation: The catalog is served by the API, not stored in SDK source.
  - id: d
    text: Email support before each request
    correct: false
    explanation: Model listings are available programmatically.
