    excerpt: This fingerprint represents the backend configuration that the model
      runs with.
    source_sha256: ef241250d52ecc47a75e54b7a7437f6301d6743dc1beae00ea163484cf182707
    locator: ChatCompletionChunk > system_fingerprint
  - source_id: src-recovery-chat
    excerpt: Can be used in conjunction with the `seed` request parameter to
      understand when backend changes have been made that might impact
      determinism.
    source_sha256: ef241250d52ecc47a75e54b7a7437f6301d6743dc1beae00ea163484cf182707
    locator: ChatCompletionChunk > system_fingerprint
  - source_id: src-recovery-chat
