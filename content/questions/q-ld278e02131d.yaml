stem: A finance stakeholder asks how per-token pricing is presented when
  comparing models in the UI. What should you tell them?
options:
  - id: a
    text: As a monthly subscription per model
    correct: false
    explanation: Pricing shown on the card is per token, not a recurring subscription.
  - id: b
    text: In USD per million tokens, separately for input and output
    correct: true
    explanation: Correct. Input and output tokens are each priced in USD per million tokens.
  - id: c
    text: As a single blended rate covering both input and output
    correct: false
    explanation: The two directions are listed separately, precisely because they differ.
  - id: d
    text: In USD per request, regardless of length
    correct: false
    explanation: Charging is per token, so request length matters.
