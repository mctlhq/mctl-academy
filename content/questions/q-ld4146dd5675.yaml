stem: After settling on a prompt and parameters in the Playground, a team wants
  the same setup available to colleagues later. What does the tool provide?
options:
  - id: a
    text: Saving the setup as a prompt preset for later use or sharing
    correct: true
    explanation: Correct. A preset stores the configuration so it can be reused or shared.
  - id: b
    text: Publishing the setup as a dedicated endpoint
    correct: false
    explanation: Deploying an endpoint is an infrastructure action, not how a
      Playground setup is retained.
  - id: c
    text: Committing the setup to the model card
    correct: false
    explanation: Model cards report the model's own parameters and pricing; they are
      not per-team storage.
  - id: d
    text: Nothing; the setup must be rebuilt each session
    correct: false
    explanation: Setups can be both exported as code and saved as presets.
evidence:
