stem: "In the fine-tuning walkthrough, how is a training dataset made available to a fine-tuning job?"
options:
  - id: a
    text: "Upload the dataset through the Files API with `purpose=\"fine-tune\"` and use the returned file ID as `training_file`"
    correct: true
    explanation: "The job's `training_file` field takes the ID of a file uploaded through the Files API with `purpose = \"fine-tune\"`."
  - id: b
    text: "Stream the dataset's JSONL rows directly inside the fine-tuning job's request body"
    correct: false
    explanation: "The job references a file ID; the dataset's rows are not embedded in the job request body."
  - id: c
    text: "Upload the file through the Files API with `purpose=\"assistants\"` and reference it by name"
    correct: false
    explanation: "The documented purpose value for a training dataset is `fine-tune`, and the job takes a file ID, not a name."
  - id: d
    text: "Reference the dataset through a public HTTPS URL included in the job request"
    correct: false
    explanation: "Datasets are uploaded through the Files API; an external URL field is not part of the job request."
