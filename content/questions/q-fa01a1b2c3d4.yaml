objective: domain-3/files-api
stem: In the fine-tuning walkthrough, how is a training dataset made available
  to a fine-tuning job?
options:
  - id: a
    text: Upload the JSONL file with the Files API using `purpose="fine-tune"` and
      pass the returned file ID as `training_file`
    correct: true
    explanation: The walkthrough calls `client.files.create` with the JSONL file and
      `purpose="fine-tune"`; the required `training_file` parameter is the ID of
      that file.
  - id: b
    text: Stream the JSONL rows inline in the fine-tuning job request body
    correct: false
    explanation: The job references a file ID; the dataset is not embedded in the
      job request.
  - id: c
    text: Upload the file with `purpose="assistants"` and reference its name
    correct: false
    explanation: The documented purpose value for fine-tuning datasets is
      `fine-tune`, and the job takes an ID, not a name.
  - id: d
    text: Point the job at a public HTTPS URL of the dataset
    correct: false
    explanation: The walkthrough uploads the file through the Files API; URLs are
      not a documented input.
evidence:
