objective: domain-4/budget-and-forecasting
stem: "A team is forecasting the credit cost of a Map request that specifies
  natural-language `instructions`. Per Tavily's Credits & Pricing documentation,
  how does that compare to a Map request without instructions?"
options:
  - id: a
    text: "Instructions double the per-page rate: every 10 successful pages costs 2
      credits with instructions instead of 1"
    correct: true
    explanation: "Correct. The documentation states regular mapping costs 1 credit
      per 10 successful pages, while Map with instructions costs 2 credits per
      10 successful pages."
  - id: b
    text: "Instructions have no effect on cost; Map is always priced per request
      regardless of pages returned"
    correct: false
    explanation: "The documentation prices Map by successful pages returned, and
      instructions change that per-page rate; it is not a flat per-request
      cost."
  - id: c
    text: "Instructions make Map use Crawl's combined mapping-plus-extraction
      formula instead"
    correct: false
    explanation: "Crawl's combined formula is a separate pricing model for a
      different endpoint; Map with instructions still prices per successful page
      mapped, just at double the rate."
  - id: d
    text: "Instructions are only available when extract_depth is set to advanced,
      which is what raises the cost"
    correct: false
    explanation: "The documentation ties Map's cost increase to specifying
      instructions directly; it does not condition instructions on
      extract_depth."
