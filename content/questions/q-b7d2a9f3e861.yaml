stem: "A sandbox operation can either save its filesystem changes as a new image
  or discard them. According to the Sandboxes overview, what happens to the
  compute each new operation runs on, regardless of that choice?"
options:
  - id: a
    text: "Every new operation starts fresh compute from its input image."
    correct: true
    explanation: "Correct. The documentation states that every new operation
      starts fresh compute from its input image, independent of the
      save-or-discard choice."
  - id: b
    text: "A saved operation resumes the live process from the run that produced
      the image."
    correct: false
    explanation: "Wrong. The documentation's survival table says running
      processes and services end with the operation; a saved image carries
      filesystem state forward, not a resumed process."
  - id: c
    text: "Discarding the changes skips allocating new compute and reuses the
      prior operation's VM."
    correct: false
    explanation: "Wrong. The documentation describes every new operation as
      starting fresh compute from its input image, with no exception for the
      discard case."
  - id: d
    text: "The save-or-discard choice can be deferred until after the operation's
      compute has already started."
    correct: false
    explanation: "Wrong. The documented workflow places choosing save or discard
      before the fresh operation runs the command, not after compute starts."
