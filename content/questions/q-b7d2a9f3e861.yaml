stem: "Sandboxes lets you choose to save or discard filesystem changes before an
  operation runs. What does the documentation say about compute startup
  regardless of that choice?"
options:
  - id: a
    text: "Every operation starts fresh compute from the selected image, no matter
      whether the result will be saved or discarded."
    correct: true
    explanation: "Correct. The documentation states that every operation starts
      fresh compute, regardless of the save-or-discard choice."
  - id: b
    text: "Only discarded operations start fresh compute; a saved operation resumes
      the previous run's live process."
    correct: false
    explanation: "Wrong. The documentation says every operation starts fresh compute
      regardless of the choice; a saved image carries filesystem state forward,
      not a resumed process."
  - id: c
    text: "Fresh compute is started only for the first operation in a session; later
      operations reuse the same running environment."
    correct: false
    explanation: "Wrong. Each operation independently starts fresh compute; the
      documentation does not describe environment reuse across operations."
  - id: d
    text: "The choice to save or discard can be made after reviewing the operation's
      output."
    correct: false
    explanation: "Wrong. The documentation states the persistence choice must be
      made before the operation is submitted, not after reviewing its output."
evidence:
