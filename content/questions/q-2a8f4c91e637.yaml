objective: domain-2/sa-failure-support-model
stem: "An architect is deciding whether a Serverless AI job's built-in
  on-failure restart policy is sufficient on its own, or whether the
  workload also needs checkpoint-and-resubmit logic to recover from a
  different kind of interruption. Which situation still needs that separate
  checkpoint-and-resubmit design?"
options:
  - id: a
    text: "The underlying VM being preempted while the job runs on
      preemptible compute, since the restart policy does not recover from
      preempted jobs."
    correct: true
    explanation: "Correct. The documentation lists preemption of the
      underlying VM as one of the failures the restart policy doesn't
      recover from, so checkpoint-and-resubmit logic is still needed for
      it."
  - id: b
    text: "The job's container exiting with a non-zero exit code after an
      application error, since the restart policy also does not recover
      from this failure."
    correct: false
    explanation: "The documentation says the on-failure restart policy
      automatically restarts the container specifically when it exits with
      a non-zero exit code, so this failure is already recovered without
      separate logic."
  - id: c
    text: "The restart policy left at its default configuration, which the
      documentation ties to the same recovery behavior as explicitly
      setting on-failure."
    correct: false
    explanation: "The documentation says the default configuration marks a
      failed job as failed without restarting it, which is not the same
      recovery behavior as the on-failure setting."
  - id: d
    text: "A Serverless AI endpoint's container exiting with an error, since
      restart policies recover endpoint containers the same way they
      recover job containers."
    correct: false
    explanation: "The documentation says automatic restarts aren't available
      for Serverless AI endpoints at all, so this scenario isn't a
      restart-policy case to begin with."
