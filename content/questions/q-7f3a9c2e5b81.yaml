stem: You are building a retrieval pipeline and need the vectors returned by
  `/v1/embeddings` to match the dimensionality your vector index expects.
  Which request parameter do you set?
options:
  - id: a
    text: "`encoding_format`"
    correct: false
    explanation: encoding_format chooses whether values are returned as floats or
      base64; it does not change how many values the vector has.
  - id: b
    text: "`dimensions`"
    correct: true
    explanation: "Correct. The `dimensions` field is described as \"the dimensions
      to use for the request,\" with example values such as 4096 and 8192."
  - id: c
    text: "`service_tier`"
    correct: false
    explanation: service_tier selects a request priority/rate-limit tier, not the
      size of the returned vector.
  - id: d
    text: "`user`"
    correct: false
    explanation: user is an opaque end-user identifier passed through for tracking,
      unrelated to vector size.
