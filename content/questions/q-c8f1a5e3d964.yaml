stem: "By default, with no special configuration, what happens to the underlying VM when a Serverless AI job, endpoint, or Devlab created from a custom image fails or returns an error, and how can a team keep it available for debugging?"
options:
  - id: a
    text: "By default, Serverless AI deletes the VM and boot disk to avoid costs; to keep the VM alive for debugging, run the deployment with a \"sleep-on-fail\" wrapper"
    correct: true
    explanation: "Correct. Serverless AI deletes the underlying VM and boot disk to avoid costs on failure, and the documented way to keep the VM alive for debugging is to run the deployment with a \"sleep-on-fail\" wrapper."
  - id: b
    text: "By default, the VM keeps running for 24 hours before deletion, giving time to debug without any special configuration"
    correct: false
    explanation: "Wrong. The 24-hour window only happens if you add the documented \"sleep-on-fail\" wrapper; by default, with no special configuration, Serverless AI deletes the VM and boot disk."
  - id: c
    text: "By default, Serverless AI pauses the VM in a stopped state so you can restart it later and inspect the failure"
    correct: false
    explanation: "Wrong. The documentation states the VM and boot disk are deleted on failure, not paused or stopped."
  - id: d
    text: "By default, Serverless AI automatically restarts the failed command up to three times before giving up"
    correct: false
    explanation: "Wrong. No automatic retry of the failed command is documented; the default behavior is deletion of the VM and boot disk."
