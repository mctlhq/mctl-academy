stem: How are projects positioned in the Token Factory resource hierarchy?
options:
  - id: a
    text: Projects are global namespaces visible to every user by default
    correct: false
    explanation: A project is an isolated environment inside an organization, not a
      public namespace.
  - id: b
    text: Projects sit outside organizations and cannot hold API keys
    correct: false
    explanation: Projects belong to an organization, and API keys are one of the
      resources created inside a project.
  - id: c
    text: Projects can only be created by an external identity provider
    correct: false
    explanation: A default project is created automatically on sign-up; no identity
      provider is involved.
  - id: d
    text: Projects live inside an organization as isolated environments whose
      resources inherit the project's access settings
    correct: true
    explanation: "The hierarchy is Organization, then Projects, then Resources: each
      project is an isolated environment, and resources such as API keys,
      endpoints, files, and datasets inherit its access settings."
