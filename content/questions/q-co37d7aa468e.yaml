stem: A project was created in the wrong region. What can be changed on it
  afterwards?
options:
  - id: a
    text: Its region, by editing the project and selecting another one
    correct: false
    explanation: Region is fixed once the project exists.
  - id: b
    text: Its tenant, by transferring the project to another tenant
    correct: false
    explanation: A project cannot be moved to another tenant.
  - id: c
    text: Both its region and tenant, provided the project holds no resources
    correct: false
    explanation: Being empty does not unlock either change.
  - id: d
    text: Only its name; the project must be recreated in the correct region
    correct: true
    explanation: Correct. Name is the only editable field, so a wrong region means
      creating a new project.
evidence:
  - source_id: src-co-manage-projects
    excerpt: For an existing project, you can only edit the name. You cannot move a
