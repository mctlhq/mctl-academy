stem: After uploading files through the Files API, which endpoint returns the
  raw file contents rather than just its metadata?
options:
  - id: a
    text: "`GET /v1/files/<file_ID>/content`"
    correct: true
    explanation: The "Download file contents" step calls `GET
      /v1/files/<file_ID>/content` to retrieve the raw bytes of a file.
  - id: b
    text: "`GET /v1/files/<file_ID>`"
    correct: false
    explanation: That endpoint is used in the "Inspect file metadata" step and
      returns metadata such as `filename`, `bytes`, and `purpose`, not the
      file's contents.
  - id: c
    text: "`GET /v1/fine_tuning/jobs/<job_ID>/checkpoints`"
    correct: false
    explanation: That endpoint lists a job's checkpoints and their `result_files`
      IDs; it does not return a file's contents.
  - id: d
    text: "`GET /v1/fine_tuning/jobs/<job_ID>/events`"
    correct: false
    explanation: That endpoint lists a fine-tuning job's lifecycle events; it has
      nothing to do with file contents.
