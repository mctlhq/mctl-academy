stem: "A sim-to-real pipeline run sets `NPA_ENV_COUNT=10000` for its synthetic
  environment generation stage. What does this configuration actually produce at
  envgen time?"
options:
  - id: a
    text: "10,000 simultaneously running Isaac Sim instances, one per configured
      environment"
    correct: false
    explanation: "The documentation explicitly states these are not 10K Isaac Sim
      instances at envgen time; they are JSON records describing scenarios, not
      running simulator instances."
  - id: b
    text: "A single Isaac Sim instance that sequentially simulates all 10,000
      environments before any records are written"
    correct: false
    explanation: "The documented behavior is JSON record generation at envgen time,
      not a described sequential Isaac Sim simulation pass producing the
      records."
  - id: c
    text: "10K JSON environment records (about 8K train, 2K held-out) — not 10K
      running Isaac Sim instances"
    correct: true
    explanation: "Correct. The documentation explicitly calls this out as a common
      mistake: `NPA_ENV_COUNT=10000` creates 10K JSON env records split roughly
      8K train / 2K held-out, and these are not 10K Isaac Sim instances at
      envgen time."
  - id: d
    text: "10,000 held-out evaluation environments with no training split"
    correct: false
    explanation: "The documented split is roughly 8K train and 2K held-out, not
      10,000 held-out environments with no training data."
