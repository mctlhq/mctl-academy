stem: What vector distance metric is standard for computing similarity between
  normalized embedding vectors?
options:
  - id: a
    text: Manhattan L1 distance metric
    correct: false
    explanation: L1 distance sums absolute component differences and is not
      normalized for direction.
  - id: b
    text: Levenshtein edit distance metric
    correct: false
    explanation: Levenshtein distance operates on string characters, not dense
      floating-point vector spaces.
  - id: c
    text: Hamming bitwise distance metric
    correct: false
    explanation: Hamming distance measures bit differences in binary vectors, not
      floating-point embeddings.
  - id: d
    text: Cosine similarity or inner dot product
    correct: true
    explanation: Cosine similarity (dot product for normalized vectors) measures
      angular alignment between text embeddings.
evidence:
  - source_id: src-inference-overview
    excerpt: Both deliver identical model outputs. Differences lie in token pricing,
      latency, and the level of applied optimizations.
