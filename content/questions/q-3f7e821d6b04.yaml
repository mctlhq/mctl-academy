objective: domain-3/data-lab
stem: A team wants to build a training dataset from the chat completions their
  application has already generated through the API. According to the Data Lab
  overview, how does that data become available for dataset preparation?
options:
  - id: a
    text: Each completion must be re-sent to a dedicated dataset-building
      endpoint right after it is generated
    correct: false
    explanation: The collection of inference logs is automatic; the overview
      describes no per-completion dataset-building call the application must
      make.
  - id: b
    text: Inference logs of chat completions are automatically collected into
      Data Lab, and filtered datasets can be created from them using SQL
      queries
    correct: true
    explanation: Data Lab stores automatically collected inference logs
      generated via API or Playground, and filtered datasets are created from
      inference logs using SQL queries.
  - id: c
    text: The completions are exported nightly to an S3-compatible bucket that
      the team then queries externally
    correct: false
    explanation: S3-compatible storage is mentioned as a way to connect data
      into Data Lab datasets, not as the automatic destination of inference
      logs.
  - id: d
    text: The team must pre-upload a structured dataset manually for any
      dataset to exist in Data Lab
    correct: false
    explanation: Manually uploaded datasets are one type of data Data Lab
      manages; they are not required, because filtered datasets can be created
      from collected inference logs.
