objective: domain-4/operational-troubleshooting
stem: An intermittent VM fault has just cleared. Support asks for diagnostic
  logs. What is the best practice?
options:
  - id: a
    text: Collect them now that the system is stable, so the output is not distorted
    correct: false
    explanation: A recovered system no longer holds the evidence that explains the fault.
  - id: b
    text: Collect only the logs that postdate the recovery, to avoid noise
    correct: false
    explanation: Excluding the broken period discards precisely what the
      investigation needs.
  - id: c
    text: Collect logs while the issue is still occurring, because they capture more
      about the broken state
    correct: true
    explanation: Correct. Logs taken during the fault carry more information than
      logs taken after it clears.
  - id: d
    text: Collect no logs and reproduce the fault in a fresh VM instead
    correct: false
    explanation: Reproduction may be impossible for an intermittent fault, and log
      collection is the documented first step.
evidence:
