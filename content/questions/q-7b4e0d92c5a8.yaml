stem: When creating an embedding, which request parameters must be supplied?
options:
  - id: a
    text: Only the model
    correct: false
    explanation: The model is required, but it is not sufficient on its own; the
      text to embed must also be supplied.
  - id: b
    text: Only the input text
    correct: false
    explanation: The input is required, but the request must also name the model
      that produces the embedding.
  - id: c
    text: The model and the input text
    correct: true
    explanation: The EmbeddingRequest schema marks exactly `model` and `input` as
      the required fields.
  - id: d
    text: The model, the input text, and an encoding_format
    correct: false
    explanation: encoding_format is optional with a default of float, not a required field.
