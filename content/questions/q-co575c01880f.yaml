stem: An engineer new to Logs asks how any LogQL query must begin. What is the
  answer?
options:
  - id: a
    text: With an aggregation function that defines the range
    correct: false
    explanation: Aggregations may appear later in a query, but they are not how one begins.
  - id: b
    text: With the time range, given before any label matching
    correct: false
    explanation: The time range is supplied alongside the query rather than opening it.
  - id: c
    text: With the name of the service whose logs are wanted
    correct: false
    explanation: Selection is done through labels in the stream selector, not by a
      bare service name.
  - id: d
    text: With a stream selector inside curly braces
    correct: true
    explanation: Correct. Every LogQL query opens with a stream selector written in
      curly braces.
