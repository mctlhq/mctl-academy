objective: domain-3/ie-inference-pipelines
stem: "A team wants to cut costs for a Serverless AI endpoint serving a
  lower-priority inference pipeline by running its underlying VM as preemptible.
  What should they accept about that choice?"
options:
  - id: a
    text: "Nebius AI Cloud can revoke the underlying VM at any time, stopping the
      endpoint until it is started again"
    correct: true
    explanation: "Correct. The documentation states that if the endpoint runs on a
      preemptible VM, Nebius AI Cloud can revoke the VM at any time, and the
      endpoint stops as a result."
  - id: b
    text: "Choosing the preemptible VM type provisions capacity for the endpoint
      faster than a regular VM, cutting its startup time"
    correct: false
    explanation: "The documentation states that the VM type does not affect how long
      capacity for an endpoint takes to be provisioned, so preemptible does not
      provision faster."
  - id: c
    text: "A GPU-backed inference endpoint cannot use the preemptible VM type, since
      that VM type is reserved for workloads without GPUs"
    correct: false
    explanation: "This reverses the documented constraint: VMs without GPUs support
      only the regular type, while GPU-backed VMs are the ones that can use the
      preemptible type."
  - id: d
    text: "The endpoint automatically switches back to a regular VM once traffic
      volume justifies the extra cost"
    correct: false
    explanation: "The documentation does not describe an automatic switch between VM
      types based on traffic; the VM type is a setting the team chooses, not one
      the platform changes for them."
