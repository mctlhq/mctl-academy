objective: domain-3/endpoint-selection
stem: "A team needs full page content from an entire documentation site to feed
  a RAG pipeline. Per Tavily's Crawl best practices, which endpoint is best for
  this?"
options:
  - id: a
    text: "Map, since it is best for sitemap generation"
    correct: false
    explanation: "The best practices list sitemap generation as Map's best-for use
      case, not RAG content analysis."
  - id: b
    text: "Extract, since it is best for discovering a site's URL structure"
    correct: false
    explanation: "Extract pulls content from URLs you already have; it does not
      discover a site's structure."
  - id: c
    text: "Search, since it is best for ingesting an entire documentation site"
    correct: false
    explanation: "Search returns relevant web results for a query; it is not
      documented as the way to ingest a whole site."
  - id: d
    text: "Crawl, since it is best for RAG, analysis, and documentation"
    correct: true
    explanation: "Correct. The best practices list RAG, analysis, and documentation
      as Crawl's best-for use case."
evidence:
  - source_id: src-tv-bp-crawl
