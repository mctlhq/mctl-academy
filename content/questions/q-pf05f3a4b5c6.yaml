stem: How are API requests authenticated when interacting with Nebius Token
  Factory endpoints using OpenAI client SDKs?
options:
  - id: a
    text: By passing a Project API key in the Authorization header as a Bearer token
    correct: true
    explanation: OpenAI SDK compatibility relies on standard HTTP Bearer token
      authorization using Project API keys.
  - id: b
    text: By uploading an mTLS client certificate for every connection
    correct: false
    explanation: mTLS is not required; standard HTTP Bearer tokens are used.
  - id: c
    text: By sending plain-text user passwords in custom headers
    correct: false
    explanation: Passwords are never used for API authorization.
  - id: d
    text: By IP address allowlisting without cryptographic keys
    correct: false
    explanation: Authorization requires valid API keys regardless of source IP.
