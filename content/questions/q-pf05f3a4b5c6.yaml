objective: domain-1/api-authentication
stem: How is an API request to Token Factory authenticated?
options:
  - id: a
    text: By passing the API key as a Bearer token in the `Authorization` header
    correct: true
    explanation: "The Quickstart cURL example sends `Authorization: Bearer
      $NEBIUS_API_KEY`; the SDK examples pass the same key as `api_key`."
  - id: b
    text: By presenting an mTLS client certificate on every connection
    correct: false
    explanation: No client certificate is involved; a bearer API key is used.
  - id: c
    text: By sending the account password in a custom header
    correct: false
    explanation: Passwords are never used for API calls; you create an API key.
  - id: d
    text: By allowlisting the caller's IP address instead of using keys
    correct: false
    explanation: Authentication is by API key, not by source address.
