stem: A training job on a GPU cluster is bottlenecked moving tensors between
  GPUs on different nodes. Which property of the cluster's networking is
  intended to address this?
options:
  - id: a
    text: Each node's traffic is serialized through a single shared host NIC
    correct: false
    explanation: Serializing through one shared NIC would create a bottleneck rather
      than relieve one; each GPU has its own NIC.
  - id: b
    text: Transfers are staged through object storage to decouple the endpoints
    correct: false
    explanation: Staging through object storage adds a slower hop; it is not the
      mechanism that accelerates GPU-to-GPU exchange.
  - id: c
    text: Data moves directly between each GPU and its NIC without passing through
      the CPU
    correct: true
    explanation: Correct. GPUDirect RDMA takes the CPU out of the transfer path,
      which is what raises data exchange speed for this pattern.
  - id: d
    text: The CPU copies each buffer into host memory before the NIC transmits it
    correct: false
    explanation: That host-memory bounce is precisely the step the technology removes.
