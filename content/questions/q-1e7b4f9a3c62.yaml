stem: "After running `npa studio search` to find robot run artifacts across
  object-storage buckets, why should the resulting search JSON and download
  receipts be kept out of Git and public documentation?"
options:
  - id: a
    text: "They contain the downloaded media files themselves, which are too
      large for Git"
    correct: false
    explanation: "The search result is a JSON inventory, not downloaded media; it
      does not embed the media files."
  - id: b
    text: "Running `npa studio search` provisions cloud resources that must be
      torn down, and the receipt proves that provisioning occurred"
    correct: false
    explanation: "The guide states search does not provision resources, download
      media, or modify storage, so there is no provisioning to prove or
      conceal."
  - id: c
    text: "They contain project identities, regional endpoints, bucket names, and
      object keys"
    correct: true
    explanation: "Correct. The guide states these files contain project
      identities, regional endpoints, bucket names, and object keys, and
      should be stored outside Git and public documentation."
  - id: d
    text: "The download receipt proves the downloaded object stayed byte-for-byte
      unchanged, and that proof must stay private"
    correct: false
    explanation: "The guide explicitly says the receipt alone does not prove the
      object stayed unchanged between search and download, so it is not that
      kind of proof."
