objective: domain-3/lora-adapters
stem: What does the documented merge script do so that inference no longer has
  to load the LoRA adapter separately from the base model?
options:
  - id: a
    text: Quantised gradient accumulation
    correct: false
    explanation: A training technique, not a way to combine weights for inference.
  - id: b
    text: Dataset token deduplication
    correct: false
    explanation: A data preparation step unrelated to adapters.
  - id: c
    text: Zero-shot prompt prefixing
    correct: false
    explanation: Prompting does not change model weights.
  - id: d
    text: "It merges the adapters into the base weights: for each merged layer's
      weight tensor it adds the scaled product `B @ A`"
    correct: true
    explanation: The script bakes the LoRA adapters into the base weights, computing
      `deltaW = B @ A` and `merged_weight = tensor + scale * deltaW` for the
      weight tensors of the merged layers (by default only
      `model.layers.*.self_attn`; other tensors are copied unchanged), and
      produces a standard checkpoint directory.
