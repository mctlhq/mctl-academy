stem: What operation combines trained LoRA adapter weights directly back into
  the base model weights for zero-overhead inference deployment?
options:
  - id: a
    text: Quantized gradient accumulation
    correct: false
    explanation: Gradient accumulation splits micro-batches during training, not
      weight merging for deployment.
  - id: b
    text: Dataset token deduplication
    correct: false
    explanation: Token deduplication cleans text datasets prior to training.
  - id: c
    text: Zero-shot prompt prefixing
    correct: false
    explanation: Prompt prefixing appends system text at query time, not model
      weight matrix addition.
  - id: d
    text: Weight merging (computing $W_{final} = W_{base} + \Delta W$)
    correct: true
    explanation: Merging computes matrix addition ($W_{base} + B \cdot A$),
      integrating adapter weights into base weights for fast serving.
