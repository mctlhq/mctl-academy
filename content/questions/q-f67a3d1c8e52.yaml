objective: domain-3/crawl-parameters
stem: "An agent sets `chunks_per_source=3` on a Crawl request without setting
  `instructions`. Per Tavily's Crawl best practices, what is wrong with this
  request?"
options:
  - id: a
    text: "`chunks_per_source` requires `extract_depth=advanced` to be set first"
    correct: false
    explanation: "The best practices gate chunks_per_source on instructions being
      provided, not on extract_depth."
  - id: b
    text: "`chunks_per_source` requires `limit` to be raised above 50 first"
    correct: false
    explanation: "chunks_per_source's availability depends on instructions, not on
      the limit parameter's value."
  - id: c
    text: "`chunks_per_source` is only available when `instructions` are provided"
    correct: true
    explanation: "Correct. The best practices state chunks_per_source is only
      available when instructions are provided."
  - id: d
    text: "`chunks_per_source` requires `max_depth` to be at least 2"
    correct: false
    explanation: "chunks_per_source's availability depends on instructions being
      provided, not on max_depth."
