objective: domain-4/key-rotation-secrets
stem: "Per Tavily's API key management guidance, where should an
  application's API key live?"
options:
  - id: a
    text: "Hardcoded directly in the application's source code for simplicity"
    correct: false
    explanation: "The guidance explicitly says never to hardcode API keys in
      source code."
  - id: b
    text: "In an environment variable or a secure secrets manager"
    correct: true
    explanation: "Correct. The guidance states to always use environment
      variables or a secure secrets manager to store credentials."
  - id: c
    text: "Embedded in client-side JavaScript so the browser can call Tavily
      directly"
    correct: false
    explanation: "The guidance treats client-side exposure as a leak scenario
      requiring revocation, not a recommended storage location."
  - id: d
    text: "In a public repository's README so teammates can find it easily"
    correct: false
    explanation: "Committing a key to a public repository is the leak scenario
      the guidance treats as an emergency, not a storage recommendation."
evidence:
  - source_id: src-tv-bp-api-keys
    excerpt: "Never hardcode API keys in your source code. Always use
      environment variables or a secure secrets manager to store your
      credentials."
