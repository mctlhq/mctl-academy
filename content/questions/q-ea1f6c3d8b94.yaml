stem: "In Tavily's Hybrid Research pattern, what does the Data Enrichment
  Pattern do with web results used to fill a knowledge gap?"
options:
  - id: a
    text: "Discard them immediately once the report is generated"
    correct: false
    explanation: "The pattern describes storing web results internally, not
      discarding them after the report."
  - id: b
    text: "Send them to Tavily's servers for retraining its ranking model"
    correct: false
    explanation: "The documentation describes storing results in your own knowledge
      base, not sending them to Tavily for retraining."
  - id: c
    text: "Keep them only in the model's context window for the current request"
    correct: false
    explanation: "The pattern describes persisting results in your knowledge base,
      not just holding them in-context for one request."
  - id: d
    text: "Store those web results internally for future queries"
    correct: true
    explanation: "Correct. The Data Enrichment Pattern states exactly this."
