stem: Under which conditions is a bank card charged automatically?
options:
  - id: a
    text: Only when the customer manually tops up the balance
    correct: false
    explanation: A manual top-up is an alternative to automatic charging, not a
      trigger for it.
  - id: b
    text: Only at the end of a billing period, in arrears
    correct: false
    explanation: The balance is debited in real time, with charges triggered by the
      conditions below.
  - id: c
    text: At the start of the month if the balance is negative, or when the billing
      threshold is reached
    correct: true
    explanation: Correct. Those are the two documented triggers, each charging
      enough to bring the balance back to zero.
  - id: d
    text: Whenever any request is made against a paid model
    correct: false
    explanation: Charging is not per request; the balance is debited and settled on
      those triggers.
