stem: "A team currently submits distributed training jobs with sbatch to an on-premises Slurm cluster and wants to move the workload to Nebius AI Cloud while adding Kubernetes-style autoscaling and self-healing, without rewriting those job scripts. Which deployment should the architect recommend?"
options:
  - id: a
    text: "Deploy a Soperator cluster, a Kubernetes operator that runs Slurm nodes as Pods so sbatch scripts keep working while Kubernetes handles scaling and recovery."
    correct: true
    explanation: "Correct. A Soperator cluster runs Slurm nodes as Kubernetes Pods and lets you run jobs with sbatch the same way as an on-premises Slurm installation, while the underlying Kubernetes layer scales the cluster automatically and restores its configuration when it drifts."
  - id: b
    text: "Replace the sbatch workflow with dstack, a container orchestrator built as a streamlined alternative to Slurm and Kubernetes for AI workloads."
    correct: false
    explanation: "Incorrect. dstack is a separate orchestrator rather than an extension of Slurm, so adopting it means converting the sbatch job scripts into dstack tasks instead of keeping them as they are."
  - id: c
    text: "Deploy Run:ai on a Managed Kubernetes cluster to dynamically allocate and share GPU resources across the team's training jobs."
    correct: false
    explanation: "Incorrect. Run:ai manages GPU scheduling on a Managed Kubernetes cluster, but adopting it means submitting jobs through the Run:ai platform rather than continuing to submit them with sbatch."
  - id: d
    text: "Install the Kubeflow Training Operator and MPI Operator on a Managed Kubernetes cluster to run the training jobs as native Kubernetes custom resources."
    correct: false
    explanation: "Incorrect. These operators run distributed training as PyTorchJob or MPIJob custom resources on Kubernetes, which still requires rewriting the sbatch scripts into Kubernetes resource definitions."
