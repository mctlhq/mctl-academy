stem: "A team exposes an internal robot-control service running on a VM to the internet using Nebius Tunnels. According to the documentation, what do they still need to configure themselves?"
options:
  - id: a
    text: "Authentication and authorization within the application itself, since tunnels only secure the transport between the agent and the Nebius edge"
    correct: true
    explanation: "Correct. Nebius Tunnels secures the transport between the tunnel agent and Nebius edge, but it doesn't add user authentication or authorization to your application."
  - id: b
    text: "A public IP address for the service, since tunnels do not provide public connectivity"
    correct: false
    explanation: "Wrong. The documentation describes avoiding the need to assign a public IP address as a benefit of tunnels, not a remaining task for the user."
  - id: c
    text: "Inbound firewall rules to accept the tunnel's connection request"
    correct: false
    explanation: "Wrong. The tunnel agent opens an outbound connection to the Nebius edge, so no inbound firewall rule is needed; avoiding open inbound ports is a documented benefit."
  - id: d
    text: "DNS records and a TLS certificate before the tunnel can be created"
    correct: false
    explanation: "Wrong. The documentation lists not needing to configure DNS and TLS certificates as a benefit of tunnels, not something left for the user to do."
evidence:
