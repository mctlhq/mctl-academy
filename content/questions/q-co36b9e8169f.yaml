domain: domain-2
objective: domain-2/iam-roles
stem: A data-collection agent must drop files into a bucket but must not be able
  to read back or enumerate what is already there. Which role matches?
options:
  - id: a
    text: '`storage.object-viewer`'
    correct: false
    explanation: That grants reading objects, which is what this agent must not be
      able to do.
  - id: b
    text: '`storage.object-lister`'
    correct: false
    explanation: Listing objects and viewing version metadata is exactly the
      enumeration being withheld.
  - id: c
    text: '`storage.uploader`'
    correct: true
    explanation: Correct. It allows viewing buckets and uploading objects while
      withholding listing and downloading.
  - id: d
    text: '`storage.editor`'
    correct: false
    explanation: That is a broad Object Storage role and grants far more than
      write-only submission.
evidence:
