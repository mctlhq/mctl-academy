objective: domain-2/workflow-design
stem: A workload's traffic varies sharply between business hours and overnight. Which dedicated
  endpoint control is designed for that?
options:
  - id: a
    text: Region, by placing the deployment near the daytime user base
    correct: false
    explanation: Region placement addresses latency and residency, not fluctuating demand.
  - id: b
    text: Lifecycle management, by deleting and recreating the deployment daily
    correct: false
    explanation: Lifecycle operations exist, but they are not the mechanism for tracking traffic
      automatically.
  - id: c
    text: GPU configuration, by choosing a GPU type that idles cheaply
    correct: false
    explanation: GPU selection sets performance per replica rather than adjusting capacity
      over time.
  - id: d
    text: Autoscaling, by setting minimum and maximum replicas
    correct: true
    explanation: Correct. Minimum and maximum replicas let capacity scale with traffic automatically.
