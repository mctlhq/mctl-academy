stem: "In a Soperator cluster, a worker node fails its extensive checks after an
  initial critical-check failure already drained it. How does Soperator's next
  action differ from that initial drain, and what does the difference trigger?"
options:
  - id: a
    text: "Soperator drains the node again with a `[hardware_problem]` prefix,
      marking it unhealthy and triggering automatic re-creation"
    correct: true
    explanation: "Correct. If the extensive checks fail, Soperator drains the node
      again, this time with the `[hardware_problem]` prefix, and marks it as an
      unhealthy Kubernetes node, which triggers automatic re-creation."
  - id: b
    text: "Soperator drains the node again with the same `[node_problem]` prefix,
      which re-queues it for another round of extensive checks"
    correct: false
    explanation: "The `[node_problem]` prefix is used for the first drain, before
      extensive checks run; a second failure escalates to the
      `[hardware_problem]` prefix instead."
  - id: c
    text: "Soperator removes the node from the suspicious reservation and returns it
      to normal scheduling without any further action"
    correct: false
    explanation: "Removing the node from the suspicious reservation is what happens
      when a node passes the extensive checks, not when it fails them."
  - id: d
    text: "Soperator stops all checks immediately and waits for Compute to issue a
      maintenance event before it takes any further action on the node"
    correct: false
    explanation: "Stopping checks to wait for a Compute maintenance event is a
      separate upstream health-check path used in Managed Soperator and Pro
      Solution for Soperator, not the outcome of a failed extensive check."
