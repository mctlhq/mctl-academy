stem: "After a fine-tuning job succeeds, which field on a checkpoint object lists the IDs of the files you can retrieve through the Files API?"
options:
  - id: a
    text: "`result_files`"
    correct: true
    explanation: "Correct. The checkpoints walkthrough states the `result_files` array contains the IDs of all files belonging to that checkpoint, which you then fetch with the Files API."
  - id: b
    text: "`trained_tokens`"
    correct: false
    explanation: "`trained_tokens` reports how many tokens have been processed during training; it is not a list of file IDs."
  - id: c
    text: "`hyperparameters`"
    correct: false
    explanation: "`hyperparameters` holds the training configuration for the job, such as `batch_size` and `learning_rate`, not file references."
  - id: d
    text: "`estimated_finish`"
    correct: false
    explanation: "`estimated_finish` is a timing field on the job object; it does not reference any files."
