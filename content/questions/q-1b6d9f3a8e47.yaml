stem: "A team wants one place to compare model artifacts, training results and
  the hyperparameters used across several post-training runs, instead of
  checking separate logs and output directories. What does Managed Service for
  MLflow provide for this purpose?"
options:
  - id: a
    text: "A separate dashboard for artifacts and a separate one for hyperparameters
      that must be cross-referenced manually"
    correct: false
    explanation: "The documentation describes one single interface for artifacts,
      results and hyperparameters together, not separate dashboards that need
      manual cross-referencing."
  - id: b
    text: "A single interface for accessing model artifacts, training results and
      tuned hyperparameters together"
    correct: true
    explanation: "Correct. The Managed MLflow overview states it enables access to
      model artifacts, training results and tuned hyperparameters in a single
      interface, which is exactly this comparison use case."
