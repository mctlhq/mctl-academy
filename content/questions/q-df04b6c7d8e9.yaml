stem: When fine-tuning for tool calling, how are the tool definitions supplied
  for a conversation example?
options:
  - id: a
    text: As a binary blob appended to the JSONL file
    correct: false
    explanation: Dataset files are plain JSON Lines; tool definitions are JSON
      inside the example.
  - id: b
    text: In an optional `tools` field on the training example, matching the schema
      you plan to use at inference
    correct: true
    explanation: Each training example can optionally include a `tools` field
      defining the tools available in that conversation, and its schema should
      match inference time.
  - id: c
    text: As comments inside the system prompt
    correct: false
    explanation: The documented mechanism is a structured `tools` field, not prose
      in the prompt.
  - id: d
    text: Through HTTP webhooks called during training
    correct: false
    explanation: Training reads static dataset files; no webhooks are documented.
