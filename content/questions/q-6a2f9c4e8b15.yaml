stem: "In LeRobot's asynchronous inference design, the `RobotClient` streams
  observations to a separate `PolicyServer` rather than running the policy on
  the robot's own controller. Why?"
options:
  - id: a
    text: "The policy server can only be reached over the network, never from
      the same physical machine as the client"
    correct: false
    explanation: "The guide explicitly shows spinning up a PolicyServer and
      connecting a RobotClient from the same machine, so a remote server is not
      required."
  - id: b
    text: "The server is assumed to have better computational resources than the
      robot controller"
    correct: true
    explanation: "Correct. The RobotClient receives action chunks from running
      inference on the server, which the documentation says is assumed to have
      better computational resources than the robot controller."
  - id: c
    text: "SmolVLA cannot run inference on any device other than a remote GPU
      server"
    correct: false
    explanation: "The guide lists `policy_device` options including cpu, mps and
      xpu alongside cuda, so inference is not restricted to a remote GPU
      server."
  - id: d
    text: "Async inference eliminates idle frames by computing the next action
      chunk before the current chunk is exhausted"
    correct: false
    explanation: "That describes a real benefit of the async design generally,
      but it is not the documented reason for placing inference on a separate
      server rather than the robot controller."
