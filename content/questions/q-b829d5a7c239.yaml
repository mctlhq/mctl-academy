stem: "In a Tavily Search response, which field is only present when
  `include_raw_content` is set to true?"
options:
  - id: a
    text: "`content`, since it always appears, being required in every response"
    correct: false
    explanation: "content is always present (it's in the required list), so it isn't
      the field gated by include_raw_content."
  - id: b
    text: "`score`, since it always appears, being required in every response"
    correct: false
    explanation: "score is always present on each result; it isn't tied to
      include_raw_content."
  - id: c
    text: "`raw_content`, which appears only if include_raw_content is true"
    correct: true
    explanation: "Correct. The API reference states raw_content is the cleaned and
      parsed HTML content, only present if include_raw_content is true."
  - id: d
    text: "`favicon`, which appears only if include_raw_content is true"
    correct: false
    explanation: "favicon is controlled by its own flag, include_favicon, not by
      include_raw_content."
