stem: "A platform team needs a Compute disk for scratch training data where
  infrastructure-level encryption is active by default and can't be turned off
  by a later configuration change. Which disk type meets this requirement?"
options:
  - id: a
    text: "Network SSD disks, whose infrastructure-level encryption is enabled by
      default and can't be disabled"
    correct: true
    explanation: "Correct. The documentation states that Network SSD is encrypted by
      default at the infrastructure level and that this can't be disabled."
  - id: b
    text: "Network SSD Non-replicated disks, since enabling encryption when the disk
      is created turns it on at the infrastructure level by default"
    correct: false
    explanation: "Network SSD Non-replicated encryption is optional at creation, not
      active by default -- the opposite of what this requirement needs, even
      though enabling it does turn on service- and infrastructure-level
      encryption for that disk."
  - id: c
    text: "Local SSD disks, since the same infrastructure-level encryption used for
      Network SSD disks also covers local storage"
    correct: false
    explanation: "The documentation states that Local SSD disks are not encrypted
      and that no other data protection method is applied to them; protecting
      their data is the customer's responsibility."
  - id: d
    text: "WEKA filesystems, since WEKA encryption remains optional after creation
      and can be enabled at any time"
    correct: false
    explanation: "WEKA filesystem encryption must be explicitly enabled at creation
      time, and a WEKA filesystem can't be converted to an encrypted one later
      -- the opposite of staying optional indefinitely."
