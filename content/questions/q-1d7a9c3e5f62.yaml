stem: "Nebius's field-failure-to-navigation-policy-improvement workflow writes
  each held-out evaluation episode's simulator output to an
  `evaluation-<index>.tar` archive. According to the workflow's documentation,
  what happens to that native rendered video and trajectory data after the
  worker's temporary directory is removed?"
options:
  - id: a
    text: "It remains available, since it was already retained in the tar
      archive under the adapter attempt"
    correct: true
    explanation: "Correct. The documentation states native rendered frames/video
      and full trajectories remain available after the worker's temporary
      directory is removed, because they were retained in the archive."
  - id: b
    text: "It is deleted along with the temporary directory, since the tar
      archive is also temporary"
    correct: false
    explanation: "The documentation says the opposite: the archived data
      specifically survives removal of the worker's temporary directory."
  - id: c
    text: "It is only viewable while the originating worker process is still
      running"
    correct: false
    explanation: "The archive's availability is documented as surviving after
      the worker's temporary directory is removed, not tied to the worker
      process staying alive."
  - id: d
    text: "It is overwritten by the next adapter attempt's evaluation output"
    correct: false
    explanation: "Each attempt receives its own unique output generation; the
      documentation does not describe later attempts overwriting an earlier
      attempt's archive."
