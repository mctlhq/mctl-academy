objective: domain-3/supervised-fine-tuning
stem: Which fine-tuning hyperparameter sets how many passes the job makes over
  the entire training dataset?
options:
  - id: a
    text: "`batch_size`"
    correct: false
    explanation: Batch size controls how many examples are processed per step, not
      how many times the dataset is traversed.
  - id: b
    text: "`learning_rate`"
    correct: false
    explanation: The learning rate is the step size for gradient descent, not a
      count of dataset passes.
  - id: c
    text: "`n_epochs`"
    correct: true
    explanation: "`n_epochs` is documented as the number of passes over the entire
      dataset, with a default of 3."
  - id: d
    text: "`temperature`"
    correct: false
    explanation: Temperature is an inference sampling parameter and is not a
      fine-tuning hyperparameter.
