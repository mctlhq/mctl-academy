stem: What primary parameter determines how many times the model iterates over
  the entire training dataset during supervised fine-tuning?
options:
  - id: a
    text: batch_size
    correct: false
    explanation: Batch size specifies how many training examples are processed per
      gradient update step.
  - id: b
    text: learning_rate_multiplier
    correct: false
    explanation: Learning rate multiplier scales the step size taken during
      optimizer weight updates.
  - id: c
    text: n_epochs
    correct: true
    explanation: The n_epochs parameter specifies the total number of full passes
      over the dataset.
  - id: d
    text: temperature
    correct: false
    explanation: Temperature is an inference sampling parameter, not a fine-tuning
      training hyperparameter.
