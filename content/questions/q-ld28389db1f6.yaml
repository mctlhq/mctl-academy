objective: domain-1/model-selection
stem: A team starts a fine-tuning job and does not set `context_length`. What
  length applies?
options:
  - id: a
    text: The maximum the base model supports
    correct: false
    explanation: The default is not the model's maximum; it must be raised deliberately.
  - id: b
    text: 131072 tokens, the largest supported value
    correct: false
    explanation: That is the top of the supported range, not the default.
  - id: c
    text: No default; the job fails until the value is supplied
    correct: false
    explanation: The job does not require the hyperparameter, because a default applies.
  - id: d
    text: 8192 tokens
    correct: true
    explanation: Correct. Unless overridden by the hyperparameter, fine-tuning
      defaults to 8192 tokens.
evidence:
  - source_id: src-ld-models
    excerpt: Unless you override it via the `context_length` hyperparameter, the
      default context length for fine-tuning is **8192 tokens**.
