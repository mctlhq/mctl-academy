stem: Two teams run separate GPU clusters that were placed in the same
  InfiniBand fabric. A security review asks whether one cluster's nodes could
  reach the other's over InfiniBand. What is the answer?
options:
  - id: a
    text: Yes, because sharing a fabric means sharing one InfiniBand address space
    correct: false
    explanation: Sharing a fabric is exactly the case the partition key mechanism
      exists to handle, so a shared fabric does not imply reachability.
  - id: b
    text: No, because each cluster gets a unique partition key that isolates its
      traffic
    correct: true
    explanation: Correct. Per-cluster P-Keys isolate traffic inside a shared
      physical fabric, so this isolation holds without giving each cluster its
      own hardware.
  - id: c
    text: Yes, unless a security group is attached to each node's network interface
    correct: false
    explanation: Security groups filter VPC traffic on network interfaces; the
      InfiniBand fabric is a separate network whose isolation is not configured
      that way.
  - id: d
    text: No, because two clusters can never be created in the same fabric
    correct: false
    explanation: Multiple clusters do share a fabric — that is the normal
      arrangement, and why an isolation mechanism is needed at all.
