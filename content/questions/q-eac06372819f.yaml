objective: domain-4/edge-cloud-placement
stem: "A team is choosing whether to run policy inference on an edge device or
  in the cloud, and notes that PI0 occupies 14GB of memory at inference time
  while SmolVLA needs only ~2GB. What does this imply for placement?"
options:
  - id: a
    text: "SmolVLA's much smaller footprint makes it far more suitable for
      memory-constrained edge hardware than PI0"
    correct: true
    explanation: "Correct. The async inference guide reports PI0 needs 14GB at
      inference time versus SmolVLA's ~2GB, so SmolVLA fits constrained hardware
      far more easily."
  - id: b
    text: "Both policies need identical hardware, since LeRobot's async pipeline
      abstracts away memory differences"
    correct: false
    explanation: "The guide reports a large, concrete memory difference between the
      two policies; the async pipeline does not equalize it."
  - id: c
    text: "The 14GB figure for PI0 is training memory and is irrelevant to where
      inference runs"
    correct: false
    explanation: "The guide states this figure explicitly as memory occupied 'at
      inference time', not training memory."
  - id: d
    text: "Memory footprint depends only on `chunk_size_threshold`, not on which
      policy is deployed"
    correct: false
    explanation: "`chunk_size_threshold` tunes how often the client sends
      observations; it does not change which policy's weights must fit in
      memory."
