stem: "When planning how to place a multi-node training job's worker processes within a GPU cluster's InfiniBand topology, which placement minimizes the cost of network communication between workers?"
options:
  - id: a
    text: "Keeping the workers within the same scalable unit (SU) or point of delivery (POD), rather than spreading them across PODs"
    correct: true
    explanation: "Correct. The guide states that if a connection takes place within one POD or SU, the cost of network communication does not change, so keeping workers in one such entity minimizes cost."
  - id: b
    text: "Spreading the workers evenly across every POD in the fabric, so no single POD becomes a bottleneck"
    correct: false
    explanation: "Spreading workers across PODs means more communication crosses a POD boundary, which the guide says increases the cost of network communication."
  - id: c
    text: "Routing every pair of workers' traffic through the fabric's root switch rather than through nearby POD or SU switches, regardless of distance"
    correct: false
    explanation: "The root switch sits at the highest, most expensive layer of the hierarchy; routing every exchange through it is the costliest placement, not the cheapest."
  - id: d
    text: "Keeping all workers on one scalable unit (SU) but disabling InfiniBand on their virtual machines"
    correct: false
    explanation: "InfiniBand is the high-speed interconnect the topology describes; disabling it removes the benefit of careful placement rather than reducing communication cost."
