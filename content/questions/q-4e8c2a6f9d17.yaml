objective: domain-3/deployment-evaluation
stem: "In Nebius's SmolVLA robot-policy train-and-serve workflow, an earlier
  10-epoch pilot checkpoint passed both promotion evaluation gates. When that
  same checkpoint was evaluated on the reserved deployment states, what
  happened?"
options:
  - id: a
    text: "It automatically passed deployment evaluation, since promotion gates
      already cover the same held-out states"
    correct: false
    explanation: "Promotion evaluations use states 0–9 and 10–19, while deployment
      states 20–29 are a separate reserved set; passing promotion did not
      guarantee passing deployment evaluation."
  - id: b
    text: "It was excluded from deployment evaluation because it had already passed
      promotion"
    correct: false
    explanation: "The documentation describes the pilot checkpoint actually being
      evaluated on deployment states and failing that threshold, not being
      excluded from deployment evaluation."
  - id: c
    text: "The 70% deployment threshold was lowered afterward so the pilot
      checkpoint would pass"
    correct: false
    explanation: "The documentation describes the 70% requirement as unchanged and
      correctly rejecting the pilot; no threshold adjustment is documented."
  - id: d
    text: "It scored 5 out of 10 on the deployment states, below the 70%
      requirement, so it was correctly rejected despite passing promotion"
    correct: true
    explanation: "Correct. The documentation reports that the 10-epoch pilot passed
      both promotion gates but scored 5/10 on deployment states 20–29, and the
      unchanged 70% requirement correctly rejected it — promotion success did
      not guarantee deployment-evaluation success."
