objective: domain-2/embeddings-and-rerank
stem: What does the `/v1/rerank` endpoint return for each document you supply
  together with a query?
options:
  - id: a
    text: A dense embedding vector for the document
    correct: false
    explanation: Embeddings come from the embeddings endpoint; rerank results carry
      a score, not a vector.
  - id: b
    text: A rewritten version of the document optimised for the query
    correct: false
    explanation: Rerank does not generate or rewrite text; it scores the documents
      you pass in.
  - id: c
    text: The document's `index` and a `relevance_score` with respect to the query
    correct: true
    explanation: Rerank reorders documents by relevance to a query; each
      `RerankResult` carries the document index, the document, and a
      `relevance_score`.
  - id: d
    text: A chat completion that answers the query using the document
    correct: false
    explanation: Answer generation is the job of chat completions; rerank returns
      relevance scores only.
