stem: "An agent authenticates with its Tavily API key and also wants to tag the request so usage can be filtered by project in the dashboard. Per Tavily's Headers & Authentication documentation, which header should it add?"
options:
  - id: a
    text: "`X-Session-Id`, since it groups related requests into one session"
    correct: false
    explanation: "X-Session-Id groups related calls into a session; it does not tag a request's project for dashboard filtering."
  - id: b
    text: "`X-Human-Id`, since it identifies the end user behind the request"
    correct: false
    explanation: "X-Human-Id identifies the end user; it is not the header for tagging a request's project."
  - id: c
    text: "`X-Project-ID`, added to attach a project to the request"
    correct: true
    explanation: "Correct. The documentation states to add the X-Project-ID header to attach a project to the request."
  - id: d
    text: "`Authorization`, since that is the header that carries the API key"
    correct: false
    explanation: "Authorization carries the API key for authentication; project tagging uses the separate X-Project-ID header."
evidence:
  - source_id: src-tv-api-headers
    excerpt: "To attach a project to your request, add the `X-Project-ID` header"
