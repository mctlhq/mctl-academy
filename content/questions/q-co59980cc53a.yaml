stem: You need the serial logs of a Compute virtual machine to escalate a boot
  failure. Which bucket should the stream selector name?
options:
  - id: a
    text: '`sp_serial`'
    correct: true
    explanation: Correct. That bucket holds serial logs for Compute virtual machines.
  - id: b
    text: '`sp_mk8s_control_plane`'
    correct: false
    explanation: That bucket carries Managed Kubernetes control plane logs.
  - id: c
    text: '`sp_cloudapps`'
    correct: false
    explanation: That bucket is for Standalone Applications.
  - id: d
    text: '`default`'
    correct: false
    explanation: The default bucket holds user-ingested logs rather than platform
      serial logs.
