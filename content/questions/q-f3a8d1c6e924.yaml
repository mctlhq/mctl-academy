stem: Which dataset format should you choose for fine-tuning when you need full
  control over tokenization, packing, loss masking, and attention masking
  yourself?
options:
  - id: a
    text: Pretokenized
    correct: true
    explanation: The guide says to use the Pretokenized dataset format when you want
      full control over tokenization, packing, loss masking, and attention
      masking.
  - id: b
    text: Conversational
    correct: false
    explanation: Conversational datasets are chat-style `messages` arrays;
      tokenization is handled for you, not controlled directly.
  - id: c
    text: Instruction
    correct: false
    explanation: Instruction datasets are prompt/completion pairs; tokenization is
      handled for you, not controlled directly.
  - id: d
    text: Text
    correct: false
    explanation: Text datasets are a single `text` field per line; tokenization is
      handled for you, not controlled directly.
