stem: What structural format is required for dataset lines in a fine-tuning file?
options:
  - id: a
    text: XML document tree nodes with nested tag attributes
    correct: false
    explanation: Fine-tuning dataset files use JSON Lines (JSONL), not XML.
  - id: b
    text: CSV spreadsheet lines separated by tab characters
    correct: false
    explanation: Fine-tuning requires JSONL objects per line, not CSV tables.
  - id: c
    text: Binary Protocol Buffer payloads
    correct: false
    explanation: Protobuf is a binary wire protocol; fine-tuning datasets use plain
      text JSONL.
  - id: d
    text: JSON Lines (JSONL) where each line is a valid JSON object
    correct: true
    explanation: Dataset files must contain exactly one JSON object per line (JSONL format).
