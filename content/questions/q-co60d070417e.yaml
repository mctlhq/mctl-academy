objective: domain-4/escalation-workflows
stem: An aggregated LogQL query is rejected because its `step` and `range`
  values are inconsistent. What is the rule?
options:
  - id: a
    text: '`step` and `range` must be equal for aggregation to work'
    correct: false
    explanation: Equality is not the requirement; one must be strictly smaller.
  - id: b
    text: '`range` must be smaller than `step`'
    correct: false
    explanation: That inverts the relationship.
  - id: c
    text: Both must divide evenly into the query's total time window
    correct: false
    explanation: No divisibility requirement is imposed.
  - id: d
    text: '`step` must be smaller than `range`'
    correct: true
    explanation: Correct. The interval between points must be smaller than the
      interval aggregation covers.
evidence:
  - source_id: src-co-logs-query-language
    excerpt: The `step` value (interval between points) must be smaller than the
      `range` value (the interval over which aggregation is performed).
