stem: "How should enterprise resource boundaries be structured to manage billing and isolation across multiple AI teams?"
options:
  - id: a
    text: "Grouping teams under distinct Projects within an Organization hierarchy"
    correct: true
    explanation: "Organizing teams into dedicated Projects within an Organization enforces clean resource isolation and quota tracking."
  - id: b
    text: "Sharing a single admin credential file across all corporate departments"
    correct: false
    explanation: "Shared admin credentials destroy auditability and resource boundaries."
  - id: c
    text: "Disabling project quota tracking and organization policies"
    correct: false
    explanation: "Disabling quotas leads to unmonitored infrastructure spending."
  - id: d
    text: "Creating separate cloud accounts for every individual GPU job execution"
    correct: false
    explanation: "Creating accounts per job causes unmanageable administrative overhead."
