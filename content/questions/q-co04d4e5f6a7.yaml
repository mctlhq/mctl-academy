stem: "When diagnosing an unexpected throughput drop in a distributed training
  job, what is the initial recommended diagnostic step?"
options:
  - id: a
    text: "Re-format the primary boot volume of all cluster nodes"
    correct: false
    explanation: "Re-formatting erases system configuration unnecessarily."
  - id: b
    text: "Inspect cluster interconnect utilization, GPU memory logs, and network
      drop counters"
    correct: true
    explanation: "Interconnect metrics and GPU logs isolate network bottlenecks and
      memory stalls."
  - id: c
    text: "Downgrade the cloud API version across all user accounts"
    correct: false
    explanation: "API version changes do not address cluster throughput bottlenecks."
  - id: d
    text: "Disable all network logging and monitoring agents"
    correct: false
    explanation: "Disabling logging hides diagnostics needed for resolution."
