stem: "When diagnosing intermittent silent job failures across a multi-node GPU
  cluster, which initial step establishes root-cause visibility?"
options:
  - id: a
    text: "Restarting all physical compute nodes simultaneously without collecting logs"
    correct: false
    explanation: "Immediate rebooting destroys diagnostic state and logs."
  - id: b
    text: "Aggregating kernel event logs, NCCL communication traces, and GPU health telemetry"
    correct: true
    explanation: "Aggregating hardware telemetry and NCCL traces isolates failure conditions."
  - id: c
    text: "Doubling the batch size across all running training jobs"
    correct: false
    explanation: "Increasing load exacerbates memory and hardware instability."
  - id: d
    text: "Re-installing OS images across all master control plane nodes"
    correct: false
    explanation: "Control plane reinstall does not address node-level interconnect failures."
