stem: "A platform team running a multi-day training job on a Soperator cluster
  gets a maintenance notice for the underlying VMs, with a due date that falls
  before the job is expected to finish. They cannot stop the job early. What
  should they do to keep it running as long as possible without risking the
  instability an overdue maintenance causes?"
options:
  - id: a
    text: "Contact support to request that the maintenance be rescheduled, since
      Compute lets owners postpone a VM's maintenance date through a support
      request"
    correct: true
    explanation: "Correct. The guide says that if you need to keep your VMs
      running, you can contact the support team to request rescheduling the
      maintenance."
  - id: b
    text: "Ignore the maintenance notice and keep the Soperator cluster's VMs
      running past the due date, since Compute's maintenance process excludes
      Soperator cluster nodes"
    correct: false
    explanation: "The guide states that Compute performs maintenance for all
      virtual machines, including nodes of Soperator clusters, so this notice
      does apply to them."
  - id: c
    text: "Request one reschedule of the maintenance that postpones it
      indefinitely, since Compute lets owners push back a VM's maintenance
      date for as long as a workload needs"
    correct: false
    explanation: "The guide caps a reschedule request at up to two times, each
      postponing the date by up to seven days, so a single request cannot
      postpone maintenance indefinitely."
  - id: d
    text: "Wait for Compute to automatically stop the VMs on the due date, since
      an automatic stop performs the maintenance without affecting the
      workload's stability"
    correct: false
    explanation: "The guide warns that delayed maintenance performed by an
      automatic stop may cause VM instability, the opposite of an outcome with
      no effect on stability."
