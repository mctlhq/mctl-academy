objective: domain-4/capacity-and-scaling
stem: How does a dedicated endpoint scale its capacity as traffic changes?
options:
  - id: a
    text: You set minimum and maximum replicas; scaling above the minimum depends on
      available burst capacity and is not guaranteed indefinitely
    correct: true
    explanation: The overview lists autoscaling between the minimum and maximum
      replicas you set; the capacity page adds that scaling above the minimum
      depends on burst capacity and is not guaranteed.
  - id: b
    text: The platform adds replicas without any upper bound whenever traffic grows
    correct: false
    explanation: You set a maximum replica count, and extra replicas depend on
      available burst capacity.
  - id: c
    text: Excess requests are transparently routed to public serverless endpoints
    correct: false
    explanation: No such fallback is documented; dedicated capacity is isolated to
      your deployment.
  - id: d
    text: Capacity is fixed at creation and cannot change while the endpoint runs
    correct: false
    explanation: Autoscaling between minimum and maximum replicas is one of the
      controls dedicated endpoints give you.
