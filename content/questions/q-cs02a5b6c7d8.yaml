objective: domain-4/capacity-and-scaling
stem: How does automatic scaling function when dedicated endpoints experience
  high request concurrency spikes?
options:
  - id: a
    text: Additional replica instances are auto-provisioned to handle load according
      to configured scaling policies
    correct: true
    explanation: Autoscaling policies dynamically add replica instances as
      concurrency metrics exceed thresholds.
  - id: b
    text: System memory is wiped to free up GPU cache
    correct: false
    explanation: Wiping memory would drop active request contexts, causing failures
      rather than scaling compute.
  - id: c
    text: Requests are converted to offline fine-tuning datasets automatically
    correct: false
    explanation: Inference traffic remains real-time inference and is not converted
      into fine-tuning datasets.
  - id: d
    text: All incoming requests are dropped with HTTP 500 server error codes
      permanently
    correct: false
    explanation: Autoscaling prevents drop errors by expanding instance capacity under load.
evidence:
  - source_id: src-rate-limits
    excerpt: This occurs when the system has spare capacity available, and your
      request can be handled with a lower priority without affecting other
      users.
