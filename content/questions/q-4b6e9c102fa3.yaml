objective: domain-1/api-authentication
stem: Deploying a dedicated endpoint through the control-plane API requires an
  API key. How is that key supplied on the `POST /v0/dedicated_endpoints`
  request?
options:
  - id: a
    text: As a Bearer token in the `Authorization` header
    correct: true
    explanation: 'Correct. The example request sends `-H "Authorization: Bearer
      $API_TOKEN"` with the create-endpoint call.'
  - id: b
    text: As a signed value in a request body field named `api_key`
    correct: false
    explanation: The key travels in the `Authorization` header, not as a body
      field.
  - id: c
    text: As a client TLS certificate presented when the connection opens
    correct: false
    explanation: No client certificate is used; authentication is a bearer token
      in the header.
  - id: d
    text: As a cookie set by a prior login request to the console
    correct: false
    explanation: The control-plane API authenticates each request via the Bearer
      header, not a session cookie.
