stem: "What is the primary benefit of streaming model completions via Server-Sent Events (SSE) in user interfaces?"
options:
  - id: a
    text: "Reducing perceived user latency (Time-To-First-Token) by displaying tokens as they are generated"
    correct: true
    explanation: "Streaming via SSE renders tokens incrementally, improving perceived latency compared to waiting for complete responses."
  - id: b
    text: "Increasing total API token consumption fees"
    correct: false
    explanation: "Streaming does not increase token count or API fees."
  - id: c
    text: "Disabling browser security sandboxing rules"
    correct: false
    explanation: "SSE streaming obeys standard HTTP/browser security protocols."
  - id: d
    text: "Converting model outputs into static PDF downloads automatically"
    correct: false
    explanation: "SSE streams text/event streams; it does not convert outputs to PDF files."
