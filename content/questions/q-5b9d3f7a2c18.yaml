stem: "After exporting subtask labels for a LeRobot dataset through FiftyOne,
  what must be true of the export report before the derived dataset is used for
  training?"
options:
  - id: a
    text: "The report must show `unlabeled_frame_count: 0`"
    correct: true
    explanation: "Correct. The guide states to train against the derived prefix only
      after the report shows unlabeled_frame_count: 0."
  - id: b
    text: "The report must show at least one overlapping labeled interval,
      confirming two reviewers agreed"
    correct: false
    explanation: "Labeled intervals are required to not overlap and to fully cover
      every frame; an overlapping interval is a problem the export coverage
      check is meant to catch, not a sign of agreement."
  - id: c
    text: "The report's `episode_index_mapping` must equal the source dataset's
      original episode indexes"
    correct: false
    explanation: "episode_index_mapping is a field from the separate native
      validation report showing that source and derived indexes differ; it is
      not the training-readiness check for a newly exported dataset."
  - id: d
    text: "The derived dataset's output prefix must be identical to the source
      dataset's prefix"
    correct: false
    explanation: "The export requires a new, empty output prefix distinct from the
      source; the original dataset is never rewritten in place."
