stem: "A team creates a Managed Service for MLflow cluster in Nebius AI Cloud
  with the 'Public and private' access option. How can the private tracking
  endpoint be reached?"
options:
  - id: a
    text: "From the network where the cluster is located, for example via a VM in
      that network"
    correct: true
    explanation: "Correct. The quickstart states the private endpoint is reached
      from the network where the cluster is located, for example via a VM in
      that network."
  - id: b
    text: "From the internet, the same way as the public endpoint"
    correct: false
    explanation: "The quickstart distinguishes the two: the public endpoint is
      reachable from the internet, while the private endpoint is reached from
      the cluster's own network."
  - id: c
    text: "From anywhere, since selecting both options makes both endpoints
      internet-reachable"
    correct: false
    explanation: "Selecting 'Public and private' creates two distinct endpoints with
      different reachability, not two endpoints that are both reachable from the
      internet."
  - id: d
    text: "Only from inside the same Nebius AI Cloud project as the cluster,
      regardless of network"
    correct: false
    explanation: "Reachability is scoped to the cluster's network, not to project
      membership."
