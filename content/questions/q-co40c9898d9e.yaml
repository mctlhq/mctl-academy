stem: Your organization's IdP has rotated the signing certificate used for single sign-on.
  What does the federation configuration in Nebius AI Cloud let you do about it?
options:
  - id: a
    text: Nothing; the federation must be deleted and created again
    correct: false
    explanation: Certificates are managed on an existing federation, so a rebuild is not required.
  - id: b
    text: Only deactivate the federation until the IdP is rolled back
    correct: false
    explanation: Deactivation is available, but it is not the mechanism for handling a rotated
      certificate.
  - id: c
    text: Rotate it automatically, since certificates are synced from the IdP
    correct: false
    explanation: Certificates are uploaded and managed deliberately rather than synchronized
      on their own.
  - id: d
    text: Upload the new certificate and delete the old one on the existing federation
    correct: true
    explanation: Correct. Attached certificates can be uploaded or deleted as part of managing
      a federation.
