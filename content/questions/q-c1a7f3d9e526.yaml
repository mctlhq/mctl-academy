stem: "A platform team already deployed a marketplace application in a project and now wants to deploy it again in the same project with different settings. What must they do first?"
options:
  - id: a
    text: "Delete the application's existing deployment in that project, then deploy it again with the new settings"
    correct: true
    explanation: "Correct. The documentation states you can deploy each application in a project once, and to deploy it again you must delete its previous deployment first."
  - id: b
    text: "Create a second Managed Kubernetes cluster in the same project and deploy the application there instead"
    correct: false
    explanation: "The documentation's per-project, per-deployment limit is about the application deployment itself, not about how many clusters exist; adding a cluster doesn't let the same application deploy a second time in the project without first removing the existing deployment."
  - id: c
    text: "Mark the application's stage as in preview before redeploying, since in-preview applications can be deployed more than once per project"
    correct: false
    explanation: "The documentation ties the preview and generally-available stages to testing and feedback versus production use and charges, not to how many times an application can be deployed in a project."
  - id: d
    text: "Open the existing deployment's configuration and edit its settings directly, since Applications supports in-place reconfiguration without a new deployment"
    correct: false
    explanation: "The documentation describes finding, configuring and deploying an application through Deploy on cluster and Deploy application; it does not describe an in-place reconfiguration path for an existing deployment."
