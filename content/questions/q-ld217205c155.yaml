stem: A product lead asks whether choosing the Fast flavor of a model will
  change the answers users receive. What is the accurate response?
options:
  - id: a
    text: Yes, Fast trades some answer quality for lower latency
    correct: false
    explanation: The flavors differ in pricing, latency and optimization level, not
      in the answers produced.
  - id: b
    text: No, both flavors deliver identical model outputs
    correct: true
    explanation: Correct. The difference is in token pricing, latency and applied
      optimizations, not in what the model returns.
  - id: c
    text: Yes, Fast truncates long responses to keep latency down
    correct: false
    explanation: Nothing about the flavor shortens responses.
  - id: d
    text: No, because Fast is only a billing label with no runtime difference
    correct: false
    explanation: 'There is a real runtime difference: smaller batch sizes, more
      compute and techniques such as speculative decoding.'
