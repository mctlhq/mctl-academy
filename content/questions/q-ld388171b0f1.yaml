objective: domain-2/workflow-design
stem: An application must keep inference inside a particular jurisdiction. Which
  dedicated endpoint control addresses that?
options:
  - id: a
    text: Autoscaling, by keeping replicas within one pool
    correct: false
    explanation: Autoscaling governs how capacity follows traffic, not where it runs.
  - id: b
    text: Region, which is chosen to meet data residency requirements
    correct: true
    explanation: Correct. Region selection is what optimizes latency and satisfies
      data residency.
  - id: c
    text: GPU configuration, by selecting hardware sold in that market
    correct: false
    explanation: GPU type and count are matched to performance needs rather than
      jurisdiction.
  - id: d
    text: Lifecycle management, by stopping the endpoint outside business hours
    correct: false
    explanation: Stopping and starting a deployment does not constrain where it runs.
