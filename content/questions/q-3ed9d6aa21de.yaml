stem: What does the `learning_rate` fine-tuning hyperparameter control, and what
  range does the guide call typical?
options:
  - id: a
    text: The number of passes over the dataset; typically 1 to 20
    correct: false
    explanation: That describes `n_epochs`.
  - id: b
    text: The rank of the LoRA matrices; typically 8 to 128
    correct: false
    explanation: That describes `lora_r`.
  - id: c
    text: The fraction of steps used for warmup; typically 0 to 1
    correct: false
    explanation: That describes `warmup_ratio`.
  - id: d
    text: The step size for gradient descent; typically `1e-6` to `5e-5`
    correct: true
    explanation: "`learning_rate` is documented as the step size for gradient
      descent, must be at least 0, with typical values between `1e-6` and `5e-5`
      and a default of `0.00001`."
