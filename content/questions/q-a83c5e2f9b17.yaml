stem: 'Per the "Quickstart: Deploy via API" guide, how do requests to the
  dedicated endpoints control plane authenticate?'
options:
  - id: a
    text: With a bearer token in the Authorization header
    correct: true
    explanation: 'Correct. The control-plane examples set the header: -H
      "Authorization: Bearer $API_TOKEN".'
  - id: b
    text: By supplying the endpoint's routing_key as a credential
    correct: false
    explanation: routing_key is the model identifier used when sending inference
      requests to the data plane, not a credential.
  - id: c
    text: By placing the endpoint_id in the Authorization header
    correct: false
    explanation: endpoint_id is used to manage the endpoint through the control
      plane; it is an identifier, not an authentication credential.
  - id: d
    text: By selecting a deployment region
    correct: false
    explanation: region chooses where the deployment runs; it has no role in
      authenticating a request.
