stem: "LeRobot reproduces Pi0.5 on the LIBERO benchmark and reports a 97.5
  average success rate across the four suites. When picking this
  reproduction for evaluation, how should its average compare to Physical
  Intelligence's original OpenPI results?"
options:
  - id: a
    text: "It should be consistent with OpenPI's reported results, not
      wildly different"
    correct: true
    explanation: "Correct. LeRobot's documentation states these reproduced
      results are consistent with the original results reported by
      Physical Intelligence."
  - id: b
    text: "It should be substantially lower, since LeRobot only
      fine-tunes for 6k additional steps"
    correct: false
    explanation: "The documentation reports the reproduction as consistent
      with, not substantially lower than, the original OpenPI results."
  - id: c
    text: "It should match only on the LIBERO-Object suite, not the other
      three"
    correct: false
    explanation: "The documentation describes overall consistency with the
      original results, not agreement limited to a single suite."
  - id: d
    text: "It should match OpenPI's numbers exactly, digit for digit"
    correct: false
    explanation: "The reported averages (97.5 vs 96.85) are close but not
      identical; the documentation calls them consistent, not exact
      matches."
