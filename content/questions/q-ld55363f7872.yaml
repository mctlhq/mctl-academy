stem: An operations dashboard shows a dedicated endpoint as Updating. What does
  that indicate?
options:
  - id: a
    text: The endpoint is being created for the first time
    correct: false
    explanation: That is the Starting stage.
  - id: b
    text: The endpoint has failed and is retrying deployment
    correct: false
    explanation: Updating describes configuration being applied, not a failure state.
  - id: c
    text: The endpoint is applying configuration changes and capacity may degrade
    correct: true
    explanation: Correct. Traffic may continue during an update while capacity
      temporarily degrades.
  - id: d
    text: The endpoint's model is being replaced with a newer published version
    correct: false
    explanation: Nothing swaps the model automatically under this status.
