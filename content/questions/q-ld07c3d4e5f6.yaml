stem: "Why is OpenAPI/REST compatibility beneficial when adopting third-party AI model providers?"
options:
  - id: a
    text: "It enables standardized client SDK integration and simplifies provider migration"
    correct: true
    explanation: "Standard OpenAPI compatibility allows existing OpenAI/HTTP clients to integrate without custom rewrites."
  - id: b
    text: "It guarantees zero network latency across all global regions"
    correct: false
    explanation: "API standards define interface specs, not physical network speed."
  - id: c
    text: "It eliminates the need for API key authentication"
    correct: false
    explanation: "OpenAPI standards support standard Bearer token authentication."
  - id: d
    text: "It automatically fine-tunes base models on incoming request payloads"
    correct: false
    explanation: "Standard API inference does not trigger automatic fine-tuning."
