stem: Your application needs the model's JSON to follow a specific structure.
  Which `response_format` type does the documentation tell you to use?
options:
  - id: a
    text: "`json_schema`, because `json_object` lets the model decide the schema by
      itself"
    correct: true
    explanation: The docs say to use JSON schema instead of JSON objects whenever
      you need strict JSON structure; `json_object` forces arbitrary JSON whose
      schema the model chooses.
  - id: b
    text: "`json_object`, because it guarantees the output matches your schema"
    correct: false
    explanation: "`json_object` carries no schema at all; the model decides the
      structure by itself."
  - id: c
    text: Plain text with the schema described in the system prompt only
    correct: false
    explanation: The docs recommend adding the schema to the prompt in addition to,
      not instead of, the `json_schema` response format.
  - id: d
    text: Either type, because both enforce the same structure
    correct: false
    explanation: "The two types differ: `json_schema` follows the schema you
      provide, `json_object` produces arbitrary JSON."
