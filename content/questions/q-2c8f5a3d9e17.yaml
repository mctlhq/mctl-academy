stem: What capability do Nebius Sandboxes document as distinguishing them from
  traditional containers, letting an AI agent try multiple execution paths?
options:
  - id: a
    text: Git-like branching — fork from any checkpoint, run parallel explorations,
      and roll back instantly
    correct: true
    explanation: The overview states that, unlike traditional containers, Sandboxes
      supports Git-like branching, letting you fork from any checkpoint and roll
      back instantly.
  - id: b
    text: OCI image support for importing images from any OCI-compliant registry
    correct: false
    explanation: OCI image support is a separate documented feature, about sandbox
      base images, not branching execution state.
  - id: c
    text: Built-in resource metrics tracking CPU time, memory usage, and I/O
      operations
    correct: false
    explanation: Resource metrics are a separate documented feature, about measuring
      an execution, not forking or rolling back state.
  - id: d
    text: Async operations with polling and cancellation support
    correct: false
    explanation: Async operations describe how long-running work is managed, not the
      branching capability itself.
