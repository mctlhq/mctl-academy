stem: "A robotics team is transferring recorded sensor-log objects between
  Nebius Object Storage buckets. For an object smaller than 100 MB, what does
  the data transfer do?"
options:
  - id: a
    text: "It makes a single `GetObject` request to the source bucket and a single
      `PutObject` request to the destination bucket"
    correct: true
    explanation: "Correct. For objects under 100 MB, the documentation describes
      exactly one GetObject and one PutObject request."
  - id: b
    text: "It performs `CreateMultipartUpload` followed by multiple `UploadPart`
      requests"
    correct: false
    explanation: "That multipart sequence is documented for larger objects, not for
      objects under 100 MB."
  - id: c
    text: "It only updates the destination object's metadata with `CopyObject`,
      without transferring the data"
    correct: false
    explanation: "That path applies when source and destination data are already
      identical but metadata differs, not to every small object being
      transferred."
  - id: d
    text: "It is skipped, because objects under 100 MB are assumed already
      synchronized"
    correct: false
    explanation: "Skipping applies to objects last modified before the prior
      successful iteration, not to every object simply because it is small."
