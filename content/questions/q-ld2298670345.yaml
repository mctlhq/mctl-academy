stem: An engineering team wants to understand what actually makes the Fast
  flavor faster. Which description matches?
options:
  - id: a
    text: It routes requests to a geographically closer region
    correct: false
    explanation: Region choice is a dedicated endpoint concern, not what defines
      this flavor.
  - id: b
    text: It reduces the model's parameter count to shorten computation
    correct: false
    explanation: The model is unchanged; a smaller model would not deliver identical
      outputs.
  - id: c
    text: It uses smaller batch sizes, more compute, and techniques such as
      speculative decoding
    correct: true
    explanation: Correct. Those are the levers the Fast flavor pulls to reduce
      latency and improve responsiveness.
  - id: d
    text: It caps the number of output tokens the model may generate
    correct: false
    explanation: No output cap is part of the flavor.
