stem: When shortlisting a base model to fine-tune, which two properties does the
  supported-models reference let you compare?
options:
  - id: a
    text: Supported context lengths and available fine-tuning types
    correct: true
    explanation: Correct. The page lists which context lengths a base model supports
      and whether LoRA, full fine-tuning, or both are available.
  - id: b
    text: Training data sources and benchmark leaderboards
    correct: false
    explanation: Neither is what this reference enumerates.
  - id: c
    text: Guaranteed throughput and regional availability
    correct: false
    explanation: Those concern serving capacity rather than fine-tuning support.
  - id: d
    text: Hourly GPU price and reserved capacity terms
    correct: false
    explanation: Pricing and reservations are billing topics, not properties of a
      base model.
