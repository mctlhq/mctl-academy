stem: "Which organizational policy configuration prevents accidental resource over-provisioning across child project accounts?"
options:
  - id: a
    text: "Removing project quota caps completely"
    correct: false
    explanation: "Removing caps allows un-monitored cost accumulation."
  - id: b
    text: "Disabling project billing dashboards"
    correct: false
    explanation: "Disabling dashboards hides cost tracking metrics from operators."
  - id: c
    text: "Granting all project members global billing admin roles"
    correct: false
    explanation: "Granting billing admin roles allows users to remove quota restrictions."
  - id: d
    text: "Setting explicit project-level resource quotas and budget alerts at the Organization level"
    correct: true
    explanation: "Resource quotas and budget alerts cap resource allocation per project preventing unexpected cloud spend."
