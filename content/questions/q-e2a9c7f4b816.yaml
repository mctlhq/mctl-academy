domain: domain-1
objective: domain-1/supervised-fine-tuning
stem: "By default, which layers of the LM expert does PEFT target when
  parameter-efficiently fine-tuning a pre-trained SmolVLA policy in LeRobot with
  LoRA?"
options:
  - id: a
    text: "`q_proj` and `v_proj`"
    correct: true
    explanation: "Correct. By default, PEFT targets the `q_proj` and `v_proj` layers
      of the LM expert in SmolVLA."
  - id: b
    text: "`k_proj` and `o_proj`"
    correct: false
    explanation: "Wrong. The documentation names `q_proj` and `v_proj` as the
      default targets, not `k_proj` and `o_proj`."
  - id: c
    text: "Every projection layer in the LM expert, with no default restriction"
    correct: false
    explanation: "Wrong. PEFT has a specific default target (`q_proj` and `v_proj`);
      targeting different or additional layers requires explicitly setting
      `--peft.target_modules`."
  - id: d
    text: "Only the embedding and output head layers"
    correct: false
    explanation: "Wrong. The documentation describes targeting `q_proj`/`v_proj` and
      the state and action projection matrices, not the embedding or output head
      layers."
