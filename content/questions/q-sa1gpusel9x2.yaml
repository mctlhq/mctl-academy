objective: domain-1/sa-gpu-selection
stem: "A solutions architect is sizing capacity for a workload that only needs
  non-GPU compute, and wants to use Nebius AI Cloud's capacity advisor before
  onboarding to see how much capacity they can expect to launch. Can the
  capacity advisor answer this for a non-GPU workload?"
options:
  - id: a
    text: "No -- the capacity advisor only provides availability data for virtual
      machines with GPUs; data about non-GPU VMs isn't provided."
    correct: true
    explanation: "Correct. The documentation states that data about computing
      resource availability of VMs without GPUs isn't provided by the capacity
      advisor."
  - id: b
    text: "Yes -- the capacity advisor reports availability for every VM platform,
      with and without GPUs, based on the project's quotas and current physical
      capacity."
    correct: false
    explanation: "The capacity advisor's documented scope is limited to virtual
      machines with GPUs; it does not report availability data for non-GPU
      platforms."
  - id: c
    text: "No -- but only because the architect's group has the viewer role rather
      than the editor role; editor access unlocks non-GPU availability data
      too."
    correct: false
    explanation: "Viewer is the documented minimum role to read capacity advisor
      data at all, but the GPU-only scope is not a role restriction -- a higher
      role does not add non-GPU data."
  - id: d
    text: "Yes -- as long as the request goes through the Nebius AI Cloud provider
      for Terraform rather than the CLI or web console."
    correct: false
    explanation: "The documentation says the opposite: the Terraform provider does
      not support the capacity advisor at all, so this path would not work even
      for GPU platforms."
