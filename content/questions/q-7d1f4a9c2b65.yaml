stem: "A team scans a room with a depth camera and runs it through Nebius's
  RGB-D-to-Isaac reconstruction workflow to build a simulation asset. A corner
  of the room was never visible to the camera. What does the resulting scene
  contain for that corner?"
options:
  - id: a
    text: "Nothing — the workflow leaves unseen space unknown rather than inventing
      geometry to fill it in"
    correct: true
    explanation: "Correct. The guide states missing surfaces and unseen space stay
      unknown, and the workflow does not invent floors or close holes to cover
      gaps in the capture."
  - id: b
    text: "A smoothed, extrapolated floor and walls generated to close the visual
      gap"
    correct: false
    explanation: "The guide explicitly says the workflow does not invent floors or
      close holes for unseen space; gaps remain unfilled rather than
      extrapolated."
  - id: c
    text: "A low-resolution placeholder mesh automatically downloaded from a public
      asset library"
    correct: false
    explanation: "No such placeholder-mesh substitution is documented; unseen space
      simply stays unknown in the reconstructed scene."
  - id: d
    text: "An estimate derived by inferring metric scale from the capture's COLMAP
      units"
    correct: false
    explanation: "The guide says the workflow does not infer metric scale from
      arbitrary COLMAP units; that is listed as something it explicitly avoids,
      not a technique used to fill gaps."
