objective: domain-4/api-key-auth
stem: "Per Tavily's Headers & Authentication documentation, which HTTP header
  carries the Tavily API key on a request, and in what format?"
options:
  - id: a
    text: "`Authorization`, formatted as `Bearer tvly-YOUR_API_KEY`"
    correct: true
    explanation: "Correct. The documentation's example request sends the API key in
      the Authorization header as \"Authorization: Bearer tvly-YOUR_API_KEY\"."
  - id: b
    text: "`X-Project-ID`, formatted as `Bearer tvly-YOUR_API_KEY`"
    correct: false
    explanation: "X-Project-ID attaches a project to the request; it does not carry
      the API key."
  - id: c
    text: "`X-Session-Id`, formatted as `Bearer tvly-YOUR_API_KEY`"
    correct: false
    explanation: "X-Session-Id groups related requests into a session; it does not
      carry the API key."
  - id: d
    text: "`X-Human-Id`, formatted as `Bearer tvly-YOUR_API_KEY`"
    correct: false
    explanation: "X-Human-Id identifies the end user behind a request; it does not
      carry the API key."
