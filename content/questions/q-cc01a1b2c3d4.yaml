stem: When `stream` is enabled in a Chat Completions request, how does Token
  Factory deliver the partial message deltas?
options:
  - id: a
    text: "As data-only server-sent events, with the stream terminated by a `data:
      [DONE]` message"
    correct: true
    explanation: "The `stream` parameter is documented to send tokens as data-only
      server-sent events as they become available, and the stream ends with
      `data: [DONE]`."
  - id: b
    text: As binary WebSocket frames on a persistent socket
    correct: false
    explanation: The Chat Completions API streams over HTTP server-sent events; the
      documentation does not describe a WebSocket transport.
  - id: c
    text: As a multipart/form-data response with one part per token
    correct: false
    explanation: Multipart encoding is not used for streaming completions; the
      documented format is server-sent events.
  - id: d
    text: As a single JSON array returned only after generation finishes
    correct: false
    explanation: Waiting for the whole array would defeat streaming; deltas are sent
      as they become available.
evidence:
  - source_id: src-recovery-chat
    excerpt: Tokens will be sent as data-only [server-sent
