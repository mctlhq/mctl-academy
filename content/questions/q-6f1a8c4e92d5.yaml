stem: "Within Nebius Serverless AI, which deployment type is designed to host a
  model or application at a URL for real-time inference requests?"
options:
  - id: a
    text: "Endpoint"
    correct: true
    explanation: "Correct. The deployment-type comparison lists serving requests by
      hosting a model or application at a URL for real-time inference under
      Endpoint."
  - id: b
    text: "Job"
    correct: false
    explanation: "A Job is non-interactive and terminates on completion or timeout;
      it is meant for tasks like training or batch inference, not for serving
      requests at a URL."
  - id: c
    text: "Devlab"
    correct: false
    explanation: "A Devlab is an interactive, browser-based IDE or notebook for
      coding and prototyping, not a way to serve real-time inference requests."
  - id: d
    text: "Managed Service for MLflow"
    correct: false
    explanation: "Managed Service for MLflow is a separate Nebius service for
      logging experiments, not a Serverless AI deployment type for serving
      inference."
