stem: According to the Reranking API reference, which fields are required in a
  POST /v1/rerank request body?
options:
  - id: a
    text: model, query, and documents
    correct: true
    explanation: "Correct. The RerankRequest schema lists its required fields:
      \"required: - model - query - documents\"."
  - id: b
    text: model, documents, and user
    correct: false
    explanation: user is documented as an optional identifier for your end-user; it
      is not part of the required list.
  - id: c
    text: model, query, and service_tier
    correct: false
    explanation: service_tier is optional, defaulting to auto; it is not part of the
      required list.
  - id: d
    text: query, documents, and user
    correct: false
    explanation: model is required but omitted here, and user is an optional
      identifier rather than a required field.
