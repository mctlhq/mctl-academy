stem: Which readiness status means a dedicated endpoint is fully provisioned and
  ready for its expected traffic?
options:
  - id: a
    text: Ready
    correct: true
    explanation: Ready is the readiness status defined as fully provisioned and
      ready for expected traffic; the docs say to use readiness to decide
      whether to send traffic.
  - id: b
    text: Running
    correct: false
    explanation: Running is a lifecycle status (deployment state), not a readiness
      status; a Running endpoint can still be Partially ready or Not ready.
  - id: c
    text: Partially ready
    correct: false
    explanation: Partially ready means the endpoint serves traffic but below
      expected capacity.
  - id: d
    text: Starting
    correct: false
    explanation: Starting is a lifecycle status for an endpoint being created or
      started, when traffic may not be available yet.
