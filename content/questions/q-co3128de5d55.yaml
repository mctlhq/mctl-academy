objective: domain-1/storage-volumes
stem: An engineer tries to create a 100 GiB Network SSD Non-replicated disk and
  the request is rejected. What explains this?
options:
  - id: a
    text: Non-replicated disks have a fixed size that cannot be chosen
    correct: false
    explanation: The size is chosen; it is the permitted increment that is constrained.
  - id: b
    text: The size must be a multiple of 93 GiB, and 100 GiB is not
    correct: true
    explanation: Correct. Data blocks sit in 93 GiB NVMe namespaces, so the disk
      size has to be a multiple of that.
  - id: c
    text: Non-replicated disks cannot be used as additional disks
    correct: false
    explanation: Their suitability is about redundancy, not about the additional-disk role.
  - id: d
    text: Disks under 128 GiB must be local SSD disks
    correct: false
    explanation: No such threshold governs the choice between the two kinds of disk.
evidence:
  - source_id: src-co-storage-types
    excerpt: The size of each namespace is 93 GiB, so the disk size must be a
      multiple of 93 GiB.
