stem: When a model returns a `tool_calls` payload in a Chat Completions
  response, what must your application do next?
options:
  - id: a
    text: End the conversation, because the model has finished
    correct: false
    explanation: A tool call is a request for your code to act; the conversation
      continues once the result is passed back.
  - id: b
    text: Re-send the same prompt unchanged and wait for a text answer
    correct: false
    explanation: Re-sending the prompt gives the model nothing new; it asked for a
      function result it does not have.
  - id: c
    text: Remove the tool definition from the request so the model stops calling it
    correct: false
    explanation: Tool definitions stay in place; the documented flow is to execute
      the function and return its output.
  - id: d
    text: "Execute the function yourself and append a `role: tool` message with the
      result and `tool_call_id`"
    correct: true
    explanation: The model does not execute functions. Your backend or client runs
      them and appends a `tool` message carrying the result and the matching
      `tool_call_id`.
evidence:
  - source_id: src-function-calling
    excerpt: You are responsible for parsing these outputs and executing the
      corresponding functions on your backend or client side.
