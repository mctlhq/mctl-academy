stem: "A team runs LeRobot's PolicyServer over a limited-bandwidth network link
  from the RobotClient. According to the async inference guide, what happens as
  they tune `chunk_size_threshold` closer to 1.0?"
options:
  - id: a
    text: "The client sends a new observation to the server on nearly every step,
      using more bandwidth and relying on a good world model"
    correct: true
    explanation: "Correct. The guide states that values of `chunk_size_threshold`
      closer to 1.0 mean the client sends an observation every step, at the cost
      of more bandwidth and reliance on a good world model."
  - id: b
    text: "The connection collapses to almost sequential behavior, sending a new
      observation only once the current chunk is exhausted"
    correct: false
    explanation: "The guide describes that behavior for values closer to 0.0, the
      opposite end of the range from 1.0."
  - id: c
    text: "PI0's inference-time memory footprint automatically drops from 14GB to
      match SmolVLA's ~2GB"
    correct: false
    explanation: "Memory footprint depends on which policy you choose to run, not on
      the `chunk_size_threshold` setting."
  - id: d
    text: "Inference is moved from the PolicyServer onto the robot's own controller"
    correct: false
    explanation: "The guide assumes the PolicyServer, not the robot controller, has
      the better computational resources; tuning `chunk_size_threshold` does not
      relocate inference."
