stem: An application repeatedly sends requests that share a long common prefix.
  Which optimization is described as storing the output of previous layers for
  each input sequence?
options:
  - id: a
    text: Continuous Batching
    correct: false
    explanation: That batches multiple sequences together to reduce per-request overhead.
  - id: b
    text: Speculative decoding
    correct: false
    explanation: That predicts likely next tokens with an auxiliary model and verifies them.
  - id: c
    text: Flash Attention
    correct: false
    explanation: That reduces the computations needed for attention calculations.
  - id: d
    text: Context Caching
    correct: true
    explanation: Correct. It caches the context — the output of previous layers —
      for each input sequence, cutting recomputation.
