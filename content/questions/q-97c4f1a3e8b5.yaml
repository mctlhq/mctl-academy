objective: domain-1/ie-rbac-key-rotation
stem: "A platform team wants a KMS symmetric key's cryptographic material
  refreshed on a recurring schedule, without having to re-grant the IAM roles
  that were already assigned to that key resource each time. What should they
  configure?"
options:
  - id: a
    text: "A rotation period set when creating the symmetric key, so Nebius KMS
      rotates the key material periodically while the key resource stays the
      same"
    correct: true
    explanation: "Correct. The documentation states that rotation creates a new key
      version while you continue using the same key resource, and that you can
      configure a rotation period when you create the key for this to happen
      periodically."
  - id: b
    text: "A new symmetric key resource created on the same schedule, then moving
      the retiring key's IAM role assignments to the new resource each time"
    correct: false
    explanation: "The documentation describes rotation as keeping the same key
      resource and only creating a new key version; replacing the resource
      itself and re-assigning roles is the manual workaround a rotation period
      is meant to avoid."
  - id: c
    text: "Manual rotation performed from the web console each time the material
      needs refreshing, since the documentation does not describe any scheduled
      option"
    correct: false
    explanation: "The documentation does describe a scheduled option: a rotation
      period configured when the key is created, in addition to rotating the key
      manually."
  - id: d
    text: "Deleting the symmetric key and recreating it under the same name, so the
      new resource inherits the original's role assignments automatically"
    correct: false
    explanation: "Deleting and recreating the key produces a new key resource; the
      documentation describes rotation as creating a new key version of the same
      resource, not deleting and remaking the resource."
evidence:
