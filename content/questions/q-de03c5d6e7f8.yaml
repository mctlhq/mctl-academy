objective: domain-4/dedicated-endpoints
stem: Why would a team deploy a fine-tuned model with custom weights on a
  dedicated endpoint rather than call a public serverless endpoint?
options:
  - id: a
    text: Every self-service dedicated endpoint includes a formal SLA
    correct: false
    explanation: The capacity page states that self-service dedicated endpoints do
      not include a formal SLA unless covered by contract.
  - id: b
    text: Dedicated endpoints support custom weights for eligible models, while
      public serverless endpoints serve base models only
    correct: true
    explanation: The comparison table lists custom weights support as supported for
      eligible models on dedicated endpoints and base models only on public
      serverless endpoints.
  - id: c
    text: Dedicated endpoints are billed per token, which is cheaper for custom
      weights
    correct: false
    explanation: Dedicated endpoints are billed per GPU/hour with per-minute
      granularity; per-token pricing is the public serverless model.
  - id: d
    text: Dedicated endpoints let the platform choose the region automatically
    correct: false
    explanation: For dedicated endpoints the deployment region is fixed and
      user-selected; it is public serverless where the region may change.
