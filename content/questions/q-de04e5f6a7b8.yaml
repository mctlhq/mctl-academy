domain: domain-4
objective: domain-4/rate-limits
stem: A request to a public serverless endpoint exceeds your nominal rate limit
  while the platform has spare capacity. What does the documentation say can
  happen?
options:
  - id: a
    text: "The request may still be processed at lower priority, and the response
      carries `x-ratelimit-over-limit: yes` as an early warning"
    correct: true
    explanation: "The rate limits page describes over-the-limit processing: with
      spare capacity the request is handled at lower priority and flagged with
      `x-ratelimit-over-limit: yes`; further calls may be throttled."
  - id: b
    text: The request is always rejected with HTTP 429 regardless of spare capacity
    correct: false
    explanation: Exceeding the active limit normally returns HTTP 429, but the page
      explicitly documents cases where over-limit requests are still processed.
  - id: c
    text: The request is queued until the next 15-minute adjustment window
    correct: false
    explanation: The 15-minute buckets adjust the limit itself; the page does not
      describe queuing requests.
  - id: d
    text: The request is rerouted to a dedicated endpoint
    correct: false
    explanation: No automatic rerouting between serverless and dedicated endpoints
      is documented.
evidence:
  - source_id: src-rate-limits
    excerpt: In some cases, requests that exceed your rate limit may still be
      processed. This occurs when the system has spare capacity available,
    source_sha256: 65943618e908ac9f005ad6afbdcaef2f5ee7cdcacdb5fe6aadda3d1a640412f2
  - source_id: src-rate-limits
