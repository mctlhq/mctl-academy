stem: How does automatic endpoint scaling behave when incoming request
  concurrency exceeds provisioned instance capacity?
options:
  - id: a
    text: Requests queue up to configured limits before returning HTTP 429 rate
      limit responses
    correct: true
    explanation: Over-capacity concurrency triggers request queuing followed by HTTP
      429 rate limit errors.
  - id: b
    text: The active model is permanently deleted from disk to prevent hardware
      overheating
    correct: false
    explanation: Capacity limits trigger throttling responses, not data deletion.
  - id: c
    text: All active user sessions are logged out across the organization
    correct: false
    explanation: Throttling impacts specific inference requests, not user auth sessions.
  - id: d
    text: HTTP responses silently return corrupted random byte strings
    correct: false
    explanation: Overload conditions return explicit HTTP 429 error codes, not corrupt data.
evidence:
