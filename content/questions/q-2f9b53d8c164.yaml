objective: domain-4/workflow-security
stem: "Why does Nebius recommend storing API keys and passwords for a robot
  workflow in SecretStash rather than placing them directly in Terraform
  manifests or cloud-init scripts?"
options:
  - id: a
    text: "To avoid hardcoding sensitive data, which helps eliminate vulnerabilities
      and maintain security compliance"
    correct: true
    explanation: "Correct. The overview states SecretStash lets you avoid hardcoding
      sensitive data in Terraform manifests or cloud-init scripts, eliminating
      vulnerabilities and maintaining compliance."
  - id: b
    text: "Because each secret version can be edited in place once it is rotated"
    correct: false
    explanation: "The overview states a version is a snapshot that cannot be
      modified once created, so versions are not edited in place."
  - id: c
    text: "Because SecretStash is the only supported way to authenticate a service
      account"
    correct: false
    explanation: "Service accounts can also authenticate using authorized key pairs
      or VM metadata authentication, documented elsewhere, so SecretStash is not
      the only method."
  - id: d
    text: "Because a secret's primary version updates automatically whenever the
      application runs"
    correct: false
    explanation: "The primary version only changes when explicitly set to a
      different version; it does not update automatically on application use."
evidence:
