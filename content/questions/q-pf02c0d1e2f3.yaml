stem: A colleague argues you should not use the Fast flavor because it will
  change what the model answers. Are they right?
options:
  - id: a
    text: Yes — speculative decoding trades some accuracy for speed
    correct: false
    explanation: Speculative decoding is a latency optimization that preserves the
      output; it does not degrade quality.
  - id: b
    text: Only for vision models, where the flavors use different weights
    correct: false
    explanation: Flavors do not swap weights for any modality. The model is the same.
  - id: c
    text: No — outputs are identical; only pricing, latency and optimizations differ
    correct: true
    explanation: Flavors are an infrastructure choice. Since outputs match, the
      decision is purely about cost and responsiveness.
  - id: d
    text: Yes — smaller batch sizes change the sampling distribution
    correct: false
    explanation: Batch size affects throughput and latency, not the content of the response.
evidence:
  - source_id: src-inference-overview
    excerpt: Both deliver identical model outputs. Differences lie in token pricing,
      latency, and the level of applied optimizations.
