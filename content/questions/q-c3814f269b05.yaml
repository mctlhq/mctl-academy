stem: "When evaluating a deployed robot policy with `lerobot-rollout`, which
  `--strategy.type` runs the policy continuously but only saves the last N
  seconds of telemetry when an operator presses a save key?"
options:
  - id: a
    text: "`highlight`"
    correct: true
    explanation: "Correct. The `highlight` strategy is described as autonomous
      rollout with on-demand recording via a memory-bounded ring buffer, flushed
      on a save key press."
  - id: b
    text: "`sentry`"
    correct: false
    explanation: "`sentry` is continuous autonomous recording with periodic upload
      to the Hub, not a ring buffer flushed on demand."
  - id: c
    text: "`dagger`"
    correct: false
    explanation: "`dagger` is human-in-the-loop data collection via a teleoperator
      takeover, not an on-demand ring-buffer recorder."
  - id: d
    text: "`episodic`"
    correct: false
    explanation: "`episodic` mirrors `lerobot-record`'s fixed episode/reset
      structure, not an on-demand ring buffer."
