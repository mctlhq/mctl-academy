stem: Which `/v1/embeddings` request parameter lets you request a specific
  embedding vector size from the model, for use in a retrieval pipeline's
  vector index?
options:
  - id: a
    text: "`dimensions`"
    correct: true
    explanation: The Embeddings API reference describes `dimensions` as the
      dimensions to use for the request, letting you choose the returned
      vector size.
  - id: b
    text: "`encoding_format`"
    correct: false
    explanation: "`encoding_format` controls whether the returned vector is
      encoded as float or base64; it does not change the vector's size."
  - id: c
    text: "`service_tier`"
    correct: false
    explanation: "`service_tier` selects the priority tier for the request
      (such as `auto` or `flex`); it has no effect on embedding dimensions."
  - id: d
    text: "`model`"
    correct: false
    explanation: "`model` selects which embedding model to call; requesting a
      vector size is a separate, dedicated parameter."
