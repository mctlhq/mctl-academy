stem: >-
  What happens if the `learning_rate` parameter set during fine-tuning is excessively high?
options:
  - id: a
    text: The training job automatically converts base weights into 4-bit GGUF format
    correct: false
    explanation: >-
      Format quantization is a model export conversion step, not a training dynamics consequence.
  - id: b
    text: Dataset JSONL lines are permanently deleted from the Files API storage
    correct: false
    explanation: >-
      Files API uploads are persistent resources and are never altered by training hyperparameters.
  - id: c
    text: Training loss drops to zero instantly on step 1 without processing tokens
    correct: false
    explanation: >-
      High learning rates cause loss divergence or instability, not instant zero-loss convergence.
  - id: d
    text: Training loss diverges or oscillates erratically, preventing model convergence
    correct: true
    explanation: >-
      An excessively large learning rate causes gradient step divergence, ruining model performance.
