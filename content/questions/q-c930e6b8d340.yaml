schema_version: 1
id: q-c930e6b8d340
status: published
domain: domain-2
objective: domain-2/extraction-recovery
stem: "A batch Extract call for 10 URLs returns HTTP 200, but 2 of the URLs
  could not be processed. Per the Extract API reference, how does an agent find
  out which ones failed?"
options:
  - id: a
    text: "It cannot find out; an HTTP 200 guarantees every URL in the batch
      succeeded"
    correct: false
    explanation: "The reference explicitly says per-URL failures can appear even on
      a 200 response."
  - id: b
    text: "It must retry the whole batch, since a partial failure forces a 400
      response"
    correct: false
    explanation: "A batch with some successes returns 200 with both arrays
      populated, not a 400."
  - id: c
    text: "It must check failed_results, since per-URL failures appear there even on
      a 200 response"
    correct: true
    explanation: "Correct. The reference states per-URL failures appear in
      failed_results, and to check both arrays even when the response is HTTP
      200."
  - id: d
    text: "It must inspect the `score` field for entries below 0.5"
    correct: false
    explanation: "score is a Search relevance field; Extract reports failures in
      failed_results, not via a score."
evidence:
  - source_id: src-tv-api-extract
    excerpt: "Successful URLs appear in results; per-URL failures appear in
      failed_results. Check both arrays even when the response is HTTP 200."
    source_sha256: 200fb5074a7131a24105c09eeb756c1e6deee7db35cc640244c9ecf36d4c06db
