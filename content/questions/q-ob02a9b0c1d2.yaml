objective: domain-4/observability
stem: Which token counts does the `usage` object of a Chat Completions response
  report?
options:
  - id: a
    text: "`prompt_tokens`, `completion_tokens`, and `total_tokens`"
    correct: true
    explanation: The Usage schema defines prompt tokens, completion tokens, and
      total tokens, where the total is prompt plus completion.
  - id: b
    text: "`gpu_temperature_celsius` and `fan_speed_rpm`"
    correct: false
    explanation: Hardware telemetry is not part of the chat completion response.
  - id: c
    text: "`disk_write_mbps` and `network_latency_ms`"
    correct: false
    explanation: Transport metrics are not reported in the usage object.
  - id: d
    text: "`database_connections_active`"
    correct: false
    explanation: Database counters have nothing to do with inference usage.
evidence:
  - source_id: src-recovery-chat
    excerpt: "completion_tokens: type: integer title: Completion Tokens description:
