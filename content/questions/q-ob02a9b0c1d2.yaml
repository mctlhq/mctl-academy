stem: >-
  Which metric token usage counts are returned in standard Chat Completion response payloads under the usage object?
options:
  - id: a
    text: "prompt_tokens, completion_tokens, and total_tokens"
    correct: true
    explanation: >-
      The usage object reports exact counts for prompt_tokens, completion_tokens, and total_tokens.
  - id: b
    text: "gpu_temperature_celsius and fan_speed_rpm"
    correct: false
    explanation: >-
      Hardware temperature and fan metrics belong to infrastructure monitoring, not model API usage payloads.
  - id: c
    text: "disk_write_mbps and network_latency_ms"
    correct: false
    explanation: >-
      Disk throughput and network ping latency are transport metrics, not LLM token usage counters.
  - id: d
    text: "database_connections_active"
    correct: false
    explanation: >-
      Database connections are SQL pool counters, not inference token usage object properties.
