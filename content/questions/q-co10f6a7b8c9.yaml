stem: "Which diagnostic documentation practice ensures rapid incident escalation during critical cluster outages?"
options:
  - id: a
    text: "Attaching structured system logs, timeline of metrics, and reproduction steps to incident tickets"
    correct: true
    explanation: "Including structured logs, metric timelines, and reproduction details allows engineering teams to diagnose root causes immediately."
  - id: b
    text: "Submitting blank support tickets titled urgent without system context"
    correct: false
    explanation: "Context-free tickets delay investigation while support requests missing details."
  - id: c
    text: "Deleting log files from worker nodes prior to escalation"
    correct: false
    explanation: "Erasing log files destroys diagnostic evidence."
  - id: d
    text: "Waiting 30 days before recording operational incident timelines"
    correct: false
    explanation: "Delayed reporting severely slows incident resolution and SLA compliance."
