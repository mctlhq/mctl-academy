objective: domain-2/sa-checkpoint-strategy
stem: "A training team takes disk snapshots of their checkpoint volumes in
  Project A as part of their recovery plan, and is now designing Project B, a
  separate project, where they want to restore training state directly from
  Project A's snapshots. Does this plan work as documented?"
options:
  - id: a
    text: "No -- a snapshot is only available in the project where it was created,
      so it can't be used to create a disk in another project."
    correct: true
    explanation: "Correct. The documentation says every snapshot is only available
      in the project where it was created, so you can only work with snapshots
      and disks within that project."
  - id: b
    text: "Yes -- snapshots are tenant-level resources, so any project within the
      same tenant can create a disk from them."
    correct: false
    explanation: "The documentation scopes a snapshot to the project where it was
      created, not to the tenant as a whole."
  - id: c
    text: "No -- but once the snapshot is attached to a shared filesystem, that
      makes it usable from Project B."
    correct: false
    explanation: "The documentation does not describe attaching a snapshot to a
      shared filesystem as a way to move it between projects; the project
      scoping applies regardless."
  - id: d
    text: "Yes -- as long as the disk type is SSD Non-replicated, which the
      documentation marks as portable across projects."
    correct: false
    explanation: "SSD Non-replicated is one of the disk types that snapshots
      support, but the documentation does not tie disk type to cross-project
      portability."
