stem: "Per Tavily's Map tutorial, how does Map's output differ from a Crawl's
  output as web-access operations?"
options:
  - id: a
    text: "Map returns a URL list only; Crawl returns URLs plus full page content"
    correct: true
    explanation: "Correct. The tutorial states that, unlike Crawl, Map does not
      extract page content and only discovers the structure."
  - id: b
    text: "Map returns full page content; Crawl returns a URL list only"
    correct: false
    explanation: "That reverses the tutorial's description; Map discovers structure
      without content, and Crawl is the one that extracts full page content."
  - id: c
    text: "Map and Crawl both return identical full-page content"
    correct: false
    explanation: "The tutorial draws a contrast between Map's URL-only output and
      Crawl's full-page content; they are not identical."
  - id: d
    text: "Map extracts page content faster than Crawl, but returns the same content"
    correct: false
    explanation: "The tutorial says Map does not extract page content at all, so it
      cannot return the same content as Crawl."
