stem: "When running `lerobot-rollout` to evaluate a trained robot policy, which
  `--strategy.type` provides continuous recording with automatic upload, useful
  for large-scale evaluation?"
options:
  - id: a
    text: "`base`"
    correct: false
    explanation: "Wrong. `base` is autonomous rollout with no data recording, useful
      for quick evaluation, not continuous recording."
  - id: b
    text: "`sentry`"
    correct: true
    explanation: "Correct. `sentry` performs continuous recording with auto-upload,
      useful for large-scale evaluation."
  - id: c
    text: "`highlight`"
    correct: false
    explanation: "Wrong. `highlight` is ring buffer recording with keystroke save,
      useful for capturing interesting events, not continuous auto-upload
      recording."
  - id: d
    text: "`dagger`"
    correct: false
    explanation: "Wrong. `dagger` is human-in-the-loop data collection, not
      continuous auto-upload recording."
