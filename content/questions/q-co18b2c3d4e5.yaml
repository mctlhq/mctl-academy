stem: "When NCCL all-reduce operations hang indefinitely across a distributed GPU cluster, which diagnostic tool isolates the communication freeze?"
options:
  - id: a
    text: "Enabling NCCL_DEBUG=INFO environment logging to capture inter-GPU collective communication state"
    correct: true
    explanation: "Setting NCCL_DEBUG=INFO outputs detailed ring/tree communications, pinpointing which node/GPU dropped communication."
  - id: b
    text: "Disabling all network interfaces across master control nodes"
    correct: false
    explanation: "Disabling interfaces renders the cluster inaccessible."
  - id: c
    text: "Increasing HTTP client timeout parameters in front-end microservices"
    correct: false
    explanation: "Front-end HTTP timeouts do not diagnose inter-GPU NCCL kernel freezes."
  - id: d
    text: "Deleting database schemas in production control planes"
    correct: false
    explanation: "Deleting schemas destroys administrative metadata without resolving GPU network hangs."
