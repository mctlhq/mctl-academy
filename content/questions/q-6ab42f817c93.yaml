stem: "The Nebius Physical AI digital-twin campus render reports counts of
  robots, warehouse units and solar arrays in its authored scene. What do these
  counts represent?"
options:
  - id: a
    text: "Figures derived from the native authored geometry, not live facility
      operations"
    correct: true
    explanation: "Correct. The guide states scene counts come from native geometry
      and do not represent live operations."
  - id: b
    text: "Live sensor telemetry streamed from the actual physical facility"
    correct: false
    explanation: "The guide explicitly says the counts do not represent live
      operations; this is an authored reference scene, not a live feed."
  - id: c
    text: "The number of rendered image frames produced by the HTML viewer"
    correct: false
    explanation: "Frame counts for the viewer are a separate, documented figure (for
      example, 32 distinct views); the scene counts concern modeled objects, not
      rendered frames."
  - id: d
    text: "The number of GPU workers allocated for the render job"
    correct: false
    explanation: "Worker allocation (for example, one RTX PRO 6000 worker) is
      infrastructure sizing, a separate figure from the scene's object counts."
