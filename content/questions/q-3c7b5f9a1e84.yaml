stem: "A team reads a single `lerobot-eval` run on the LIBERO suites to pick
  between two candidate policies, and the two success rates are close. Why
  does LeRobot's LIBERO documentation recommend not trusting that single run?"
options:
  - id: a
    text: "Hub dataset revisions must be pinned with `--dataset.revision` before
      any success rate is comparable"
    correct: false
    explanation: "Pinning the dataset revision is a separate reproducibility
      requirement for comparing against published results, not the reason to
      average over multiple seeds."
  - id: b
    text: "`--eval.batch_size` must be set to 3 for a statistically valid
      comparison"
    correct: false
    explanation: "`--eval.batch_size` controls how many environments run in
      parallel; it is not tied to the number of evaluation seeds recommended for
      averaging."
  - id: c
    text: "Success rates may vary by a few percent across evaluation seeds, so
      results should be averaged over 3 seeds"
    correct: true
    explanation: "Correct. The documentation states success rates may vary by a
      few percent across evaluation seeds, and recommends averaging over 3
      seeds."
  - id: d
    text: "Soft resets are not bit-identical to hard resets, so three repeats are
      needed to compensate for reset drift"
    correct: false
    explanation: "Soft versus hard reset fidelity is a separate documented
      concern; the 3-seed recommendation is about evaluation-seed variance, not
      reset behavior."
