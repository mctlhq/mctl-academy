stem: "Per Tavily's Search best practices, which response field is meant for a
  quick relevance check of a candidate source?"
options:
  - id: a
    text: "`score`"
    correct: false
    explanation: "The same table lists `score` for filtering or ranking by relevance
      score, not for a quick textual check."
  - id: b
    text: "`title`"
    correct: false
    explanation: "The table lists `title` for keyword filtering on headlines, not a
      quick relevance check."
  - id: c
    text: "`content`"
    correct: true
    explanation: "Correct. The metadata table lists `content` for a quick relevance check."
  - id: d
    text: "`raw_content`"
    correct: false
    explanation: "The table lists `raw_content` for deep analysis and regex
      extraction, a heavier task than a quick check."
