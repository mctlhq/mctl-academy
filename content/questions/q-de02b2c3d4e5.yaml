stem: How are dedicated endpoints targeted when making OpenAI-compatible chat
  completion requests?
options:
  - id: a
    text: By passing the dedicated endpoint URL or endpoint deployment ID in the
      request base URL or model identifier
    correct: true
    explanation: Requests route to dedicated instances by specifying the deployment
      endpoint host or deployment ID.
  - id: b
    text: By changing the TCP port to 21 on the client host machine
    correct: false
    explanation: Port 21 is FTP; API endpoints use standard HTTPS (port 443).
  - id: c
    text: By embedding base64 encoded SSH keys in system prompts
    correct: false
    explanation: SSH keys manage shell access, not API request model routing.
  - id: d
    text: "By specifying purpose: fine-tune in request headers"
    correct: false
    explanation: The purpose header belongs to Files API uploads, not Chat
      Completion inference calls.
