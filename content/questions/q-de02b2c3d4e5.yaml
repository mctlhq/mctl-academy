stem: After creating a dedicated endpoint, what do you pass as the model
  identifier in OpenAI-compatible inference calls to target it?
options:
  - id: a
    text: The `routing_key` returned when the endpoint was created
    correct: true
    explanation: The control and data plane page defines `routing_key` as the model
      identifier you pass to inference calls, returned on endpoint creation.
  - id: b
    text: The `endpoint_id`
    correct: false
    explanation: "`endpoint_id` is documented as the identifier used for update and
      delete operations, not for inference."
  - id: c
    text: The template's `flavor_name`
    correct: false
    explanation: A flavor is a template sub-option such as `base` or `fast`; it does
      not identify your deployment.
  - id: d
    text: The control-plane base URL
    correct: false
    explanation: The control plane manages configuration; inference goes to the
      regional data-plane base URL with the `routing_key` as model.
