stem: What happens to an account when an automatic card charge fails?
options:
  - id: a
    text: The account is suspended
    correct: true
    explanation: Correct. A failed charge suspends the account, which is why the payment method
      must stay valid.
  - id: b
    text: Requests continue but are throttled to the free tier
    correct: false
    explanation: No free-tier fallback is described.
  - id: c
    text: The balance is carried to the next month with a fee
    correct: false
    explanation: Nothing describes deferring the balance in this way.
  - id: d
    text: Dedicated endpoints keep running while shared inference stops
    correct: false
    explanation: The consequence applies to the account rather than to one product.
