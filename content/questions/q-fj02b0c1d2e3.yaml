stem: How can a developer inspect what happened during a fine-tuning job, such
  as file validation, dataset processing, and training progress?
options:
  - id: a
    text: By connecting to the GPU host's serial console
    correct: false
    explanation: No hardware console is exposed.
  - id: b
    text: By listing the job's events, for example with
      `client.fine_tuning.jobs.list_events(job.id)`
    correct: true
    explanation: "The guide recommends inspecting job events, which help you
      understand the lifecycle: file validation, dataset processing, and
      training progress."
  - id: c
    text: By inspecting DNS records for the API host
    correct: false
    explanation: DNS carries no job information.
  - id: d
    text: By polling the `GET /v1/models` endpoint
    correct: false
    explanation: The models endpoint lists models; it does not report job progress.
