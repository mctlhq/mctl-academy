stem: How can a developer monitor training progress, loss values, and validation
  metrics during an active fine-tuning job execution?
options:
  - id: a
    text: By connecting a browser directly to the GPU hardware motherboard serial
      console
    correct: false
    explanation: Direct hardware console access is not exposed in cloud platform APIs.
  - id: b
    text: By polling the Fine-Tuning Job Events API or viewing job event logs
    correct: true
    explanation: Job events stream progress logs, step counts, training loss, and
      validation metrics.
  - id: c
    text: By inspecting DNS CNAME lookup records
    correct: false
    explanation: DNS records map domain names to IP addresses, not fine-tuning job metrics.
  - id: d
    text: By sending HTTP POST requests to external payment gateways
    correct: false
    explanation: Payment webhooks handle billing transactions, not training loss
      metric logs.
