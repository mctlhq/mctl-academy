stem: "In the fine-tuning walkthrough's Python example, which call downloads the raw contents of a file given its file ID?"
options:
  - id: a
    text: "`client.files.content(file_id)`"
    correct: true
    explanation: "Correct. The walkthrough's \"Download file contents\" step calls `client.files.content(file_id)` to get the raw bytes, which are then written to disk."
  - id: b
    text: "`client.files.retrieve(file_id)`"
    correct: false
    explanation: "That call is used in the earlier \"Get file metadata\" step and returns the file object (including its `filename`), not the file's contents."
  - id: c
    text: "`client.files.create(file=..., purpose=\"fine-tune\")`"
    correct: false
    explanation: "That call uploads a new dataset file; it does not retrieve the contents of an existing one."
  - id: d
    text: "`client.fine_tuning.jobs.retrieve(job.id)`"
    correct: false
    explanation: "That call checks the status of a fine-tuning job; it has nothing to do with downloading a file's contents."
