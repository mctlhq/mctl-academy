objective: domain-4/observability-tracing
stem: "By default, what happens to the underlying VM when a Serverless AI job,
  endpoint, or Devlab created from a custom image fails or returns an error?"
options:
  - id: a
    text: "Serverless AI deletes the VM and its boot disk automatically, to avoid
      costs"
    correct: true
    explanation: "Correct. The debugging guide states Serverless AI deletes the
      underlying VM and boot disk to avoid costs when the resource fails."
  - id: b
    text: "It keeps running for 24 hours automatically so you can connect and debug
      it"
    correct: false
    explanation: "A 24-hour debug window only happens if you add the documented
      'sleep-on-fail' wrapper; it is not the default behavior."
  - id: c
    text: "It is stopped but retained, so it can be restarted later"
    correct: false
    explanation: "The documentation says the VM and boot disk are deleted, not
      merely stopped and retained."
  - id: d
    text: "It is left running indefinitely until someone manually deletes it"
    correct: false
    explanation: "The documentation says the VM is deleted automatically to avoid
      costs, not left running indefinitely."
