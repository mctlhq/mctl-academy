stem: Which fine-tuning hyperparameter sets the rank of the LoRA matrices?
options:
  - id: a
    text: "`lora_dropout`"
    correct: false
    explanation: "`lora_dropout` applies dropout to LoRA layers; it does not set the rank."
  - id: b
    text: "`weight_decay`"
    correct: false
    explanation: "`weight_decay` is an L2 regularisation factor applied to weights,
      unrelated to LoRA rank."
  - id: c
    text: "`context_length`"
    correct: false
    explanation: "`context_length` is the maximum sequence length in tokens, not a
      LoRA setting."
  - id: d
    text: "`lora_r`"
    correct: true
    explanation: "`lora_r` is documented as the rank of the LoRA matrices; higher
      values increase capacity but also overfitting and cost."
