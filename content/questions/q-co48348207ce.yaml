objective: domain-3/node-recovery
stem: After a Network SSD NRD boot disk reported persistent I/O errors, the node
  disappeared and a differently named node appeared. What happened?
options:
  - id: a
    text: The node was renamed as part of resetting its boot disk
    correct: false
    explanation: Nodes are not renamed in place; the new name belongs to a genuinely
      new node.
  - id: b
    text: Automatic recovery deleted the node and created a new one with a healthy
      boot disk
    correct: true
    explanation: Correct. That is the documented remedy for a boot disk with
      persistent I/O errors.
  - id: c
    text: The autoscaler removed the node because its disk reduced available capacity
    correct: false
    explanation: Scaling decisions are about capacity, not about a failing boot disk.
  - id: d
    text: An operator must have drained and deleted it manually
    correct: false
    explanation: No manual action is needed; the service performs this recovery itself.
evidence:
  - source_id: src-co-k8s-health-checks
