stem: "To use Nebius Token Factory's hosted inference from an `npa` workbench
  workflow, what credential must be configured, and what can't substitute for
  it?"
options:
  - id: a
    text: "A `NEBIUS_TOKEN_FACTORY_KEY`, saved with `npa configure`; a Nebius IAM
      token cannot replace it"
    correct: true
    explanation: "Correct. The quickstart says to save NEBIUS_TOKEN_FACTORY_KEY
      with npa configure, then run npa workbench token-factory verify, and
      states a Nebius IAM token cannot replace this key."
  - id: b
    text: "A Nebius IAM token alone, since it covers every hosted service"
    correct: false
    explanation: "The quickstart explicitly states a Nebius IAM token cannot
      replace the Token Factory key."
  - id: c
    text: "An SSH key uploaded to the service account's authorized keys"
    correct: false
    explanation: "Authorized SSH keys are documented for VM access elsewhere, not
      for authenticating hosted Token Factory inference."
  - id: d
    text: "A Kubernetes service account token from the SkyPilot cluster"
    correct: false
    explanation: "Workflow execution needing SkyPilot and storage setup is a
      separate prerequisite from the Token Factory credential itself."
