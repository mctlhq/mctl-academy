objective: domain-4/sa-identity-model
stem: "An architect is designing a service account that a CI/CD pipeline will
  use to manage GPU clusters across several projects in the same tenant, even
  though the service account itself is created in just one of those projects.
  Can it still be granted access to resources in the other projects?"
options:
  - id: a
    text: "Yes -- because access is defined by the groups a service account belongs
      to, not by the project where it was created."
    correct: true
    explanation: "Correct. The documentation says a service account's access to
      resources is defined by the groups it's added to, and this means it can be
      granted access to any resource in the tenant regardless of the project."
  - id: b
    text: "No -- a service account's access is scoped to the project where it was
      created, so a separate service account would be needed for each project."
    correct: false
    explanation: "The documentation says the opposite: a service account belongs to
      the project where it was created, but its access to resources is defined
      by group membership, not by that project."
  - id: c
    text: "Yes -- but first the service account must be promoted into a full user
      account through an identity federation sign-on."
    correct: false
    explanation: "The documentation does not describe promoting a service account
      into a federation user account; cross-project access comes from group
      membership, not a change of account type."
  - id: d
    text: "No -- cross-project access for service accounts is granted specifically
      through membership in the auditors group, not through other groups."
    correct: false
    explanation: "The auditors group is the lowest-access default group, limited to
      viewing certain resources without access to data; the documentation does
      not tie cross-project access to that specific group."
