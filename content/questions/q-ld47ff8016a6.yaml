objective: domain-3/structured-output
stem: Which `response_format` setting should be used when the response must
  conform to a schema the application supplies?
options:
  - id: a
    text: '`{"type": "json_object"}`, with the schema described in the system prompt'
    correct: false
    explanation: That yields arbitrary JSON; a prompt alone does not bind the
      response to the schema.
  - id: b
    text: '`{"type": "text"}`, with a post-processing validation step'
    correct: false
    explanation: That returns natural language and pushes all the work downstream.
  - id: c
    text: No setting is needed; schemas are inferred from the request body
    correct: false
    explanation: Nothing infers a schema automatically.
  - id: d
    text: '`{"type": "json_schema"}`, supplying the schema in the request'
    correct: true
    explanation: Correct. That is the setting that makes the response follow a
      schema you provide.
