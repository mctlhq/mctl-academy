stem: A workflow must always call `read_file` first, regardless of what the user
  asked. You set `tool_choice` to that function explicitly. What is the effect?
options:
  - id: a
    text: The model prefers it but may pick another tool if context suggests one
    correct: false
    explanation: That describes automatic selection. An explicit choice is not a hint.
  - id: b
    text: The model calls it only if the user request mentions a file
    correct: false
    explanation: Context ceases to matter once a specific function is named.
  - id: c
    text: The request fails if another tool would have scored higher
    correct: false
    explanation: There is no scoring conflict to fail on; the named function is
      simply the one that gets called.
  - id: d
    text: The model calls it regardless of context, overriding its own selection
    correct: true
    explanation: An explicit choice replaces the model's judgement entirely, which
      is what makes it suitable for a deterministic first step.
evidence:
  - source_id: src-function-calling
    excerpt: This forces the model to call the `read_file` function regardless of
      context, overriding its own tool selection logic.
