status: published
domain: domain-3
objective: domain-3/call-error-handling
stem: "An agent's error-handling code inspects the exact text of a 429
  response's `detail.error` message to decide how to react, instead of the HTTP
  status and headers. Per Tavily's Rate Limits documentation, what is wrong with
  that approach?"
options:
  - id: a
    text: "Nothing; the message text is the documented, stable way to detect a 429"
    correct: false
    explanation: "The documentation says error messages can vary by the limit
      reached, so matching on message text is not a stable way to detect a 429."
  - id: b
    text: "Error messages can vary by the limit reached, so retry handling should
      key off the HTTP status and header instead"
    correct: true
    explanation: "Correct. The documentation states exactly this: error messages can
      vary by the limit reached, so use the HTTP status and header for retry
      handling rather than matching the message text."
  - id: c
    text: "429 responses never include a Retry-After header, so message text is the
      only usable signal"
    correct: false
    explanation: "The documentation shows a 429 example that does include a
      Retry-After header; it is not true that the header is never present."
  - id: d
    text: "Keyless access returns the same error format as a keyed request, so
      message matching works identically either way"
    correct: false
    explanation: "The documentation states keyless access uses a different error
      format and separate limits, so message matching would not work identically
      either way."
