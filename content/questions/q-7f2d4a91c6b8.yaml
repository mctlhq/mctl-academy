stem: "An organization with no existing deployments anywhere in Nebius AI Cloud's
  `eu-north2` region wants to provision new GPU training capacity there to keep
  data in Iceland. What governs whether they can do this?"
options:
  - id: a
    text: "`eu-north2` is a private region, available only to users who already
      have deployments there, so an organization without existing deployments
      there cannot provision new capacity in it"
    correct: true
    explanation: "Correct. The guide states that the eu-north2 region is private
      and available only to users who already have deployments there, so a new
      organization cannot start using it for a new project."
  - id: b
    text: "`eu-north2` is one of Nebius AI Cloud's public regions, so any
      organization can choose it for a new project without restriction"
    correct: false
    explanation: "The guide lists eu-north2 separately under private regions, not
      among the nine public regions that are open to any organization."
  - id: c
    text: "The organization should contact support to request that Nebius add the
      missing service to eu-north2, the way a region missing a specific service
      can be requested"
    correct: false
    explanation: "That support-ticket path is for a service that is missing from
      an otherwise-available region; it does not change who may use a private
      region like eu-north2 in the first place."
  - id: d
    text: "Because Nebius AI Cloud provides a project per region at sign-up, the
      organization already has a usable project in eu-north2 and can deploy
      there"
    correct: false
    explanation: "A project per region is provided for the regions available to
      the organization; it does not override eu-north2's restriction to users
      who already have deployments there."
