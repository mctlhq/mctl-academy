stem: A developer has finished tuning a chat setup in the Playground and needs
  it inside their application. What is the intended path?
options:
  - id: a
    text: Re-enter the parameters by hand in the application code
    correct: false
    explanation: Manual transcription is what the export feature exists to avoid.
  - id: b
    text: Export it as code with View code, which includes the chat
    correct: true
    explanation: Correct. View code copies the model setup, chat included, for use
      in an application.
  - id: c
    text: Grant the application access to the saved preset at runtime
    correct: false
    explanation: Presets store a setup for people to reuse in the UI, not as a runtime API.
  - id: d
    text: Fine-tune a model so the behaviour is baked into the weights
    correct: false
    explanation: Fine-tuning is a far heavier step and is not how a prompt setup
      moves into code.
