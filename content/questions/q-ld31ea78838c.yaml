stem: A developer asks how to send traffic to the Fast flavor of a model from
  their application. What is required?
options:
  - id: a
    text: Set a flavor field in the request body
    correct: false
    explanation: The flavor is selected through the model name rather than a separate field.
  - id: b
    text: Call a different base URL reserved for Fast endpoints
    correct: false
    explanation: The endpoint stays the same; only the model name changes.
  - id: c
    text: Append `-fast` to the model name in the API
    correct: true
    explanation: Correct. The suffix on the model name is what selects the Fast flavor.
  - id: d
    text: Request access from support before the flavor becomes callable
    correct: false
    explanation: Both flavors are available without a request; one is chosen per call.
