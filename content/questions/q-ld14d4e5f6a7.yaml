stem: "When designing multi-step agentic workflows, why are deterministic schema validation checks critical between steps?"
options:
  - id: a
    text: "They catch malformed structured outputs early before passing invalid arguments to downstream tools"
    correct: true
    explanation: "Schema validation (e.g. JSON schema / Pydantic) ensures tool inputs are strictly valid, preventing cascading agent failures."
  - id: b
    text: "They bypass API key authentication headers"
    correct: false
    explanation: "Schema validation validates data structure, not API credentials."
  - id: c
    text: "They convert unstructured text into physical binary executable code"
    correct: false
    explanation: "Schema validation validates fields; it does not convert text into raw binary machine code."
  - id: d
    text: "They disable model context limits"
    correct: false
    explanation: "Schema validation has no impact on model context window limits."
