stem: A LogQL query is syntactically valid but returns nothing at all, and the
  stream selector omits `__bucket__`. What explains the empty result?
options:
  - id: a
    text: The query silently defaults to the `default` bucket, which is empty
    correct: false
    explanation: No implicit default is applied; the label is genuinely required.
  - id: b
    text: Without the bucket label, queries return no entries
    correct: true
    explanation: Correct. Omitting `__bucket__` (or `--bucket` in the CLI) yields no
      entries at all.
  - id: c
    text: The results were dropped because entries carried a non-empty `__error__`
      value
    correct: false
    explanation: Error entries are ignored, but that is a separate limitation from
      omitting the bucket.
  - id: d
    text: The `step` value exceeded the `range` value, so no points were produced
    correct: false
    explanation: That constraint governs aggregation intervals, not label selection.
evidence:
  - source_id: src-co-logs-query-language
    excerpt: Queries without it return no entries.
