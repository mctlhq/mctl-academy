objective: domain-3/crawl-parameters
stem: "An agent adds natural-language `instructions` to a Crawl request to focus
  it on specific content. Per the Crawl API reference, what happens to the
  cost?"
options:
  - id: a
    text: "The cost is unaffected; instructions are free to add to any Crawl request"
    correct: false
    explanation: "The reference states the cost increases when instructions are
      specified, so it is not free."
  - id: b
    text: "The cost moves from a per-page basis to a flat per-crawl fee"
    correct: false
    explanation: "The reference still prices by successful pages; it does not switch
      to a flat fee."
  - id: c
    text: "The cost is cut in half, since instructions reduce the number of pages
      crawled"
    correct: false
    explanation: "The reference describes a cost increase for using instructions,
      not a reduction."
  - id: d
    text: "The cost increases to 2 API credits per 10 successful pages instead of 1
      API credit per 10 pages"
    correct: true
    explanation: "Correct. The reference states the mapping cost increases to 2
      credits per 10 successful pages (instead of 1) when instructions are
      specified."
