stem: "How do resource quota limits prevent individual user projects from starving GPU cluster capacity?"
options:
  - id: a
    text: "Enforcing per-project ceilings on total allocated GPU instances and concurrent API requests"
    correct: true
    explanation: "Per-project quota ceilings restrict resource consumption, preserving capacity for other project teams."
  - id: b
    text: "Disabling project quota tracking and allowing unrestricted allocation"
    correct: false
    explanation: "Disabling tracking allows one project to consume all cluster resources."
  - id: c
    text: "Terminating random worker pods across unrelated cloud accounts"
    correct: false
    explanation: "Terminating random pods damages unrelated production workloads."
  - id: d
    text: "Requiring manual root password approval for every HTTP request"
    correct: false
    explanation: "Manual root password approval is an unworkable security anti-pattern."
