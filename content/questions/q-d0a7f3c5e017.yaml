objective: domain-4/api-key-auth
stem: "Per Tavily's Headers & Authentication documentation, what mechanism
  authenticates every request to the Tavily API?"
options:
  - id: a
    text: "API keys"
    correct: true
    explanation: "Correct. The documentation states all Tavily endpoints are
      authenticated using API keys."
  - id: b
    text: "OAuth tokens issued per end user"
    correct: false
    explanation: "OAuth is the authentication method for the remote MCP server, not
      the documented mechanism for direct REST calls."
  - id: c
    text: "A signed JWT minted by the calling agent itself"
    correct: false
    explanation: "The documentation does not describe self-minted JWTs; it names API
      keys as the authentication mechanism."
  - id: d
    text: "mTLS client certificates"
    correct: false
    explanation: "Client certificates are not part of Tavily's documented
      authentication scheme; API keys are."
