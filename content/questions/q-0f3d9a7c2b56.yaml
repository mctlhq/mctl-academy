stem: On `GET /v1/models`, what is the documented default value of the `verbose`
  query parameter?
options:
  - id: a
    text: "`false`"
    correct: true
    explanation: The `verbose` parameter's schema sets its type to boolean with a
      default of `false`.
  - id: b
    text: "`true`"
    correct: false
    explanation: "`true` is the opposite of the documented default; a caller must
      explicitly set it to get the extended fields."
  - id: c
    text: "`1`"
    correct: false
    explanation: "`1` is the documented default for the Chat Completions `n`
      parameter, not for `verbose` on the models endpoint."
  - id: d
    text: "`auto`"
    correct: false
    explanation: "`auto` is the documented default for `service_tier`, a different
      parameter entirely."
