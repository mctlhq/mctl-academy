objective: domain-1/storage-volumes
stem: A workload writes intermediate shards to a local SSD disk. The VM is
  stopped overnight to save cost. What happens to that data?
options:
  - id: a
    text: It is erased, because local SSD disks are ephemeral
    correct: true
    explanation: Correct. Local SSD data is erased when the VM is stopped or
      deleted, which is why it suits only recreatable data.
  - id: b
    text: It is preserved, because the disk is physically attached to the host
    correct: false
    explanation: Physical attachment is what makes the storage fast and host-local;
      it does not make it durable across a stop.
  - id: c
    text: It is preserved only if the disk was created from a disk snapshot
    correct: false
    explanation: Local SSD disks are not created as separate managed resources from
      images or snapshots.
  - id: d
    text: It is migrated automatically to a network SSD disk on shutdown
    correct: false
    explanation: No such migration happens; nothing moves the data off the host.
evidence:
  - source_id: src-co-storage-types
    excerpt: 'Local SSD disks are ephemeral, meaning temporary: their data is erased
      when the VM is stopped or deleted.'
