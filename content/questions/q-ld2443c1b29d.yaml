stem: A stakeholder asks which optimization reduces memory usage by lowering the
  numeric precision of the model itself. Which one is it?
options:
  - id: a
    text: Paged Attention
    correct: false
    explanation: That partitions a request's KV cache into fixed-size memory blocks,
      which is a memory layout change rather than a precision change.
  - id: b
    text: Continuous Batching
    correct: false
    explanation: That groups multiple input sequences to raise throughput; precision
      is untouched.
  - id: c
    text: KV Cache
    correct: false
    explanation: That stores frequently accessed key-value pairs to avoid recomputation.
  - id: d
    text: Quantization
    correct: true
    explanation: Correct. It reduces the precision of model weights and activations,
      lowering memory use and computation.
