objective: domain-3/node-recovery
stem: A team plans to scale a node group from six nodes to ten and worries the
  running workloads will be disrupted by node replacement. What should you tell
  them?
options:
  - id: a
    text: Scaling does not recreate nodes, so existing nodes are left in place
    correct: true
    explanation: Correct. Scaling a node group up or down does not recreate any
      nodes; replacement comes from template changes instead.
  - id: b
    text: Every node is replaced on any change to the node group's size
    correct: false
    explanation: Replacement is triggered by modifying the node group template, not
      by changing its size.
  - id: c
    text: Scaling always drains and recreates one node at a time
    correct: false
    explanation: That describes the rolling update that follows a template change.
  - id: d
    text: Scaling is only safe when the group is first cordoned entirely
    correct: false
    explanation: No such precaution is required for scaling.
