stem: "After creating a new Serverless AI endpoint or job, roughly how long does the documentation say it takes before usage data appears on the Metrics dashboard?"
options:
  - id: a
    text: "5-10 minutes"
    correct: true
    explanation: "Correct. Usage data for endpoints and jobs becomes available 5-10 minutes after a resource is created."
  - id: b
    text: "Immediately, within the first few seconds"
    correct: false
    explanation: "Wrong. The documentation states a 5-10 minute delay before usage data becomes available, not an immediate appearance."
  - id: c
    text: "Only once every 15 seconds, starting the moment the endpoint is created"
    correct: false
    explanation: "Wrong. The 15-second interval is how often already-available data is refreshed; it is not the initial delay before data first appears."
  - id: d
    text: "Only after the first stop-and-restart cycle"
    correct: false
    explanation: "Wrong. No restart requirement for usage data to appear is documented; the only documented delay is the 5-10 minutes after creation."
