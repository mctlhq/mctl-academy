objective: domain-4/platform-capabilities
stem: A business continuity plan assumes a dedicated endpoint will return to
  full capacity immediately after a maintenance window. What risk should you
  flag?
options:
  - id: a
    text: Restarting may take longer than the first deployment when capacity is
      scarce
    correct: true
    explanation: Correct. Under high demand or for scarce GPU types, capacity may be
      temporarily unavailable and the restart can take significantly longer.
  - id: b
    text: The endpoint's model weights must be uploaded again after maintenance
    correct: false
    explanation: Nothing indicates weights are lost across a maintenance event.
  - id: c
    text: The endpoint is deleted automatically if maintenance exceeds an hour
    correct: false
    explanation: Maintenance does not delete deployments.
  - id: d
    text: Billing continues at full rate while the endpoint waits for capacity
    correct: false
    explanation: Charges apply when replicas are running, so a stopped endpoint is
      not billed at full rate.
evidence:
