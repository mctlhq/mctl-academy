objective: domain-2/extraction-recovery
stem: "A batch Extract call for 25 URLs is rejected, and separately a batch
  where every URL fails validation also comes back as an error. Per the Extract
  API reference, how can an agent recover enough detail to act on the second
  case?"
options:
  - id: a
    text: "It cannot; a validation-failure response carries only a generic error
      with no per-URL detail"
    correct: false
    explanation: "The reference states that when all URLs fail validation,
      detail.failed_results describes the individual failures, not just a
      generic error."
  - id: b
    text: "detail.failed_results in the 400 response describes the individual URL
      failures"
    correct: true
    explanation: "Correct. The reference states that when all URLs fail validation,
      detail.failed_results describes the individual failures."
  - id: c
    text: "It must resend each URL one at a time until it finds the one that caused
      the error"
    correct: false
    explanation: "The reference documents failed_results inside the error detail for
      this exact case, so resending URLs one at a time is not needed."
  - id: d
    text: "The results array lists which URLs failed validation, since
      failed_results only covers successful batches"
    correct: false
    explanation: "failed_results appears in the error detail for an all-invalid
      batch; results is for successfully processed URLs, not validation
      failures."
evidence:
  - source_id: src-tv-api-extract
