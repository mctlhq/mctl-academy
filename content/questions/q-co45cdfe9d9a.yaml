stem: A brief utilization spike keeps paging the team. Which alert setting is
  intended to stop momentary spikes from firing?
options:
  - id: a
    text: Threshold, by raising the value the metric must reach
    correct: false
    explanation: Raising the threshold changes what counts as a spike, but a brief
      excursion above the new value would still fire.
  - id: b
    text: Duration, the time during which the condition must be met
    correct: true
    explanation: Correct. Requiring the condition to hold for a period is what
      filters out momentary spikes.
  - id: c
    text: Condition, by switching from exceeds to drops below
    correct: false
    explanation: That inverts which direction triggers the alert rather than
      requiring persistence.
  - id: d
    text: Metric, by selecting a different series to watch
    correct: false
    explanation: Changing the series avoids this particular signal instead of
      handling its brevity.
