stem: After reranking retrieved documents with `/v1/rerank`, you need to map
  each scored result back to the document you originally submitted in the
  `documents` array. Which field on each result do you use?
options:
  - id: a
    text: "`object`"
    correct: false
    explanation: object is a field on embeddings responses (always "list"); the
      rerank response schema has no such field.
  - id: b
    text: "`relevance_score`"
    correct: false
    explanation: relevance_score carries the ranking score, not the identity of the
      original document.
  - id: c
    text: The top-level `id` on the rerank response
    correct: false
    explanation: The top-level id identifies the whole response, not any single
      document within it.
  - id: d
    text: "`index`"
    correct: true
    explanation: "Correct. The schema documents this field as \"index of the
      document,\" i.e. its position in the request's `documents` array."
