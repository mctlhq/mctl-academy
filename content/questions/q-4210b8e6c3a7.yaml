objective: domain-4/application-integration
stem: "A robot application behind a firewall needs to expose its HTTP API to an
  external integration using Nebius Tunnels, without opening inbound firewall
  ports. What must the VM or private network accept from the internet?"
options:
  - id: a
    text: "Nothing; it never needs to accept inbound connections, since the agent
      connects outbound to the Nebius edge"
    correct: true
    explanation: "Correct. The overview states the VM or private network doesn't
      need to accept inbound connections from the internet for tunnel traffic."
  - id: b
    text: "Inbound connections from the regional Nebius edge's IP range"
    correct: false
    explanation: "The overview describes the agent making an outbound connection to
      the edge, not the network accepting inbound connections from it."
  - id: c
    text: "Inbound connections on whatever port is set in `services.name`"
    correct: false
    explanation: "`services.name` names the service in the agent configuration; it
      is not a network port the VM must accept inbound traffic on."
  - id: d
    text: "Inbound connections over HTTP/2 only, when `protocol: h2` is configured"
    correct: false
    explanation: "`protocol: h2` controls which traffic type the tunnel supports; it
      does not require the VM to accept any inbound connection."
evidence:
  - source_id: src-pa-tunnels-overview
    excerpt: "The VM or private network doesn't need to accept inbound connections
      from the internet for this traffic."
