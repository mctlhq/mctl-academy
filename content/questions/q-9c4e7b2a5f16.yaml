stem: "Before creating a Managed Service for MLflow cluster, what access level
  does the quickstart require within your tenant or project?"
options:
  - id: a
    text: "The `admin` role, for example via the default `admins` group"
    correct: true
    explanation: "Correct. The quickstart's prerequisites require being in a group
      with the `admin` role within the tenant or project before creating a
      cluster."
  - id: b
    text: "The `editor` role, the same level required for most other Nebius AI Cloud
      resources"
    correct: false
    explanation: "The MLflow quickstart specifically requires the `admin` role for
      cluster creation, not the `editor` role used elsewhere in the platform."
  - id: c
    text: "The `viewer` role, since cluster creation is a read-only operation"
    correct: false
    explanation: "Cluster creation is a write operation and the `viewer` role is
      insufficient; the quickstart requires the `admin` role."
  - id: d
    text: "No specific role is required as long as you have a valid CLI profile"
    correct: false
    explanation: "The quickstart explicitly lists the `admin` role as a
      prerequisite, independent of having a configured CLI profile."
