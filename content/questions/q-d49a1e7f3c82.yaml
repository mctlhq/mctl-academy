stem: If a Chat Completions request omits the `max_tokens` parameter, what does
  the API reference say the value defaults to?
options:
  - id: a
    text: 8192 tokens
    correct: true
    explanation: The reference states that `max_tokens`, if omitted or set to null,
      defaults to 8192 tokens.
  - id: b
    text: Unlimited — generation stops only when the model reaches a natural stop
      point
    correct: false
    explanation: The reference defines an explicit numeric default, so generation is
      not unbounded when the parameter is omitted.
  - id: c
    text: 100 tokens
    correct: false
    explanation: 100 appears only as an example value for `max_tokens` in the
      reference, not as its documented default.
  - id: d
    text: 1 completion
    correct: false
    explanation: 1 is the documented default for the `n` parameter (number of
      completions to generate), not for `max_tokens`.
