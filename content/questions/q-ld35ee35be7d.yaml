objective: domain-2/product-outcomes
stem: A non-technical product manager wants to try a model and shape its
  behaviour before any engineering work is scheduled. What should they use?
options:
  - id: a
    text: A dedicated endpoint deployed with minimum replicas set to one
    correct: false
    explanation: Deploying an endpoint is an infrastructure step and is not needed
      to try a model.
  - id: b
    text: The Playground, which requires no coding
    correct: true
    explanation: Correct. It exists so a model can be exercised through a web
      interface without writing code.
  - id: c
    text: A fine-tuning job on a small sample of data
    correct: false
    explanation: Fine-tuning changes the model and is far heavier than trying one out.
  - id: d
    text: The List models endpoint with `verbose=true`
    correct: false
    explanation: That returns model parameters rather than letting someone interact
      with a model.
evidence:
