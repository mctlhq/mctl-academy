stem: >-
  What dataset quality filter prevents a model from learning repetitive or template-dominated completions during fine-tuning?
options:
  - id: a
    text: Disabling system prompt headers entirely
    correct: false
    explanation: >-
      System prompts define behavior rules; removing them does not solve dataset template repetition.
  - id: b
    text: Doubling the learning rate parameter on every epoch
    correct: false
    explanation: >-
      Increasing learning rate does not deduplicate or clean repetitive dataset text.
  - id: c
    text: Semantic deduplication and near-duplicate removal across dataset lines
    correct: true
    explanation: >-
      Deduplication removes repetitive prompt/response pairs so the model learns generalizable skills rather than memorizing templates.
  - id: d
    text: Converting all floating-point weights into 8-bit integers
    correct: false
    explanation: >-
      8-bit quantization reduces memory, not dataset duplicate text patterns.
