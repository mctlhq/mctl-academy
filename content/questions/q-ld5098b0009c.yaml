stem: How is each available tool described to the model?
options:
  - id: a
    text: As a natural-language sentence in the system prompt
    correct: false
    explanation: Prompt text can add guidance, but tools are declared structurally.
  - id: b
    text: As an example request and response pair
    correct: false
    explanation: Examples may help behaviour, but they are not the tool definition.
  - id: c
    text: As a JSON Schema giving its name, input parameters and data types
    correct: true
    explanation: Correct. That schema is what tells the model how the tool should be
      invoked.
  - id: d
    text: As a URL the model calls directly when needed
    correct: false
    explanation: The model proposes calls rather than invoking endpoints itself.
