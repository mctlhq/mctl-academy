stem: "According to the Sandboxes documentation's state model, what does a saved
  image contain, and what does it not retain from the operation that produced
  it?"
options:
  - id: a
    text: "Filesystem state only; it does not retain a running process, process
      memory, open file handles, network connections, or a live terminal."
    correct: true
    explanation: "Correct. The documentation states a saved image contains
      filesystem state and does not retain a running process, process memory,
      open file handles, network connections, or a live terminal."
  - id: b
    text: "The complete process state, including open network connections and a live
      terminal, so the image can resume an interactive session."
    correct: false
    explanation: "Wrong. The documentation lists network connections and a live
      terminal among what a saved image does not retain."
  - id: c
    text: "Environment values, which persist automatically into every later
      operation once an image is saved."
    correct: false
    explanation: "Wrong. The documentation's survival table says environment values
      persist only when the interface explicitly saves both the image and
      supported environment metadata, not automatically."
  - id: d
    text: "Only the stdout and stderr produced during the run, without any
      filesystem changes."
    correct: false
    explanation: "Wrong. The documentation describes a saved image as containing
      filesystem state; stdout and stderr are available through the operation
      result, a separate item in the survival table."
