    text: "Choosing smaller specialized models for routine extraction and larger reasoning models for complex decision tasks"
    correct: true
    explanation: "Right-sizing model selection balances cost, latency, and reasoning accuracy for distinct workload tiers."
  - id: b
    text: "Using maximum parameter models exclusively for all data transformation tasks"
    correct: false
    explanation: "Using massive models for simple tasks causes unnecessary inference costs."
  - id: c
    text: "Disabling prompt validation rules for reasoning workloads"
    correct: false
    explanation: "Disabling validation leads to malformed prompts and unreliable model outputs."
  - id: d
    text: "Hardcoding fixed random seeds across all production endpoints"
    correct: false
    explanation: "Fixed random seeds do not alter model capability trade-offs."
