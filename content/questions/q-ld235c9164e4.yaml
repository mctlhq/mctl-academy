stem: How does speculative decoding raise throughput without degrading output
  quality?
options:
  - id: a
    text: An auxiliary model pre-generates likely tokens that the main model then
      verifies
    correct: true
    explanation: Correct. Verification by the main model is what preserves quality
      while cutting the number of forward passes.
  - id: b
    text: Low-confidence tokens are dropped from the response before it is returned
    correct: false
    explanation: Dropping tokens would change the output, which is exactly what this
      technique avoids.
  - id: c
    text: The prompt is truncated so fewer tokens need to be processed
    correct: false
    explanation: Truncating input is not part of the technique and would change results.
  - id: d
    text: Several user requests are merged into a single forward pass
    correct: false
    explanation: Batching multiple sequences together describes continuous batching instead.
