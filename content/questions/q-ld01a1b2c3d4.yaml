stem: "When selecting a model family for low-latency interactive applications,
  which model property provides the most significant operational efficiency?"
options:
  - id: a
    text: "Enforcing maximum parameter size regardless of inference latency
      requirements"
    correct: false
    explanation: "Overly large models increase compute cost and inference response time."
  - id: b
    text: "Balancing model capability against parameter size and token throughput
      rates"
    correct: true
    explanation: "Optimizing parameter scale to task requirements achieves efficient
      token throughput."
  - id: c
    text: "Disabling context window size restrictions"
    correct: false
    explanation: "Disabling limits leads to out-of-memory errors on context overflow."
  - id: d
    text: "Executing model inference exclusively via un-indexed local batch scripts"
    correct: false
    explanation: "Local batch scripts cannot support real-time interactive user requests."
