stem: According to the Data Lab overview, how do inference logs arrive in Data Lab?
options:
  - id: a
    text: They are uploaded manually as user-provided data
    correct: false
    explanation: Manual upload describes uploaded datasets, which the overview lists
      separately as user-provided datasets uploaded manually.
  - id: b
    text: Chat completions generated via API or Playground are collected
      automatically, unless Zero Data Retention is enabled
    correct: true
    explanation: The overview lists inference logs as automatically collected chat
      completions generated via API or Playground, unless Zero Data Retention is
      enabled.
  - id: c
    text: They are created from inference logs using SQL queries
    correct: false
    explanation: SQL queries create filtered datasets from inference logs; they do
      not bring the logs themselves into Data Lab.
  - id: d
    text: They are generated as the results of batch inference jobs
    correct: false
    explanation: Batch inference outputs are a separate data type, the results
      generated by batch inference jobs.
