stem: "What credential isolation practice prevents compromised training pods from modifying cloud production infrastructure?"
options:
  - id: a
    text: "Sharing organization admin credentials across all worker containers"
    correct: false
    explanation: "Shared admin credentials allow compromised pods to modify entire cloud account infrastructure."
  - id: b
    text: "Disabling pod authentication entirely"
    correct: false
    explanation: "Disabling authentication allows un-authenticated access to cluster APIs."
  - id: c
    text: "Embedding root SSH private keys inside container base images"
    correct: false
    explanation: "Hardcoding SSH keys in images exposes administrative access to any container user."
  - id: d
    text: "Binding short-lived scoped IAM service account tokens directly to workload pods via RBAC"
    correct: true
    explanation: "Scoped pod-level RBAC tokens ensure training pods hold no permissions over admin infrastructure."
