stem: "Nebius's field-failure-to-navigation-policy-improvement workflow writes a
  sealed `decision.json` recommending promotion or retaining the baseline. What
  must be true of the primary metric for that comparison to recommend
  promotion?"
options:
  - id: a
    text: "Any positive improvement on the primary metric, regardless of how small,
      as long as it is nonzero"
    correct: false
    explanation: "The comparison requires the improvement to reach the sealed
      minimum_improvement bound, not merely be positive by any amount."
  - id: b
    text: "A strictly positive primary mean improvement at least the sealed
      `minimum_improvement`, with no metric's degradation beyond its
      `maximum_regression`"
    correct: true
    explanation: "Correct. The decision requires a strictly positive primary mean
      improvement at least the sealed minimum_improvement, with no
      scenario/seed/metric degrading beyond that metric's maximum_regression."
  - id: c
    text: "An improvement measured only on the training-exposed replay cohort, since
      that cohort is diagnostic"
    correct: false
    explanation: "The training-exposed replay cohort is diagnostic only; the
      decision is a sealed comparison over the declared metrics and bounds, not
      a training-exposed-only check."
  - id: d
    text: "Every secondary metric must independently clear its own
      `minimum_improvement` as well"
    correct: false
    explanation: "Secondary metrics are regression guards whose minimum_improvement
      is only informational unless one is selected as the primary metric."
