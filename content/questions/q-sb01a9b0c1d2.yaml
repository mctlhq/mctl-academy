stem: Why do Sandboxes use VM-level isolation when running code produced by an
  AI agent?
options:
  - id: a
    text: So that untrusted code cannot escape the sandbox or affect other workloads
    correct: true
    explanation: "The Sandboxes overview lists secure isolation first: VM-level
      isolation ensures untrusted code cannot escape the sandbox or affect other
      workloads."
  - id: b
    text: To make model token generation faster
    correct: false
    explanation: Sandboxes execute code; they do not run model inference or change
      its throughput.
  - id: c
    text: To remove the need for an API key
    correct: false
    explanation: Isolation is about containing executed code; authentication is unaffected.
  - id: d
    text: To convert scripts into static web pages
    correct: false
    explanation: Sandboxes execute code and capture results; they do not transform
      code into HTML.
