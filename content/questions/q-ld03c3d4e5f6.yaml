stem: "When evaluating third-party API providers for enterprise AI integration,
  which operational factor is most critical for compliance?"
options:
  - id: a
    text: "Requiring proprietary API extensions that prevent industry standard
      compatibility"
    correct: false
    explanation: "Locking into non-standard interfaces increases migration risk."
  - id: b
    text: "Verifying data privacy policies, SLA guarantees, and enterprise security
      certifications"
    correct: true
    explanation: "Enterprise SLAs and privacy guarantees ensure compliance with
      regulatory standards."
  - id: c
    text: "Disabling rate limit controls across public endpoints"
    correct: false
    explanation: "Disabling rate limits leads to un-controlled resource usage and
      outage risk."
  - id: d
    text: "Selecting providers based solely on marketing announcements without API
      SLA validation"
    correct: false
    explanation: "Relying on claims without SLA verification exposes production
      applications to downtime."
