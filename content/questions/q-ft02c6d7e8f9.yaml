objective: domain-3/supervised-fine-tuning
stem: A fine-tuning job is running and you want to know whether the dataset was
  accepted and how training is progressing. What should you inspect?
options:
  - id: a
    text: The uploaded file's metadata, which records a validation verdict
    correct: false
    explanation: File metadata describes the upload. The job's view of processing
      appears in its events.
  - id: b
    text: The dataset query template, which reports parse errors
    correct: false
    explanation: Query templates concern reading dataset content, not monitoring a
      training run.
  - id: c
    text: Job events, which cover file validation, dataset processing and progress
    correct: true
    explanation: Events are the running narrative of a job, which is what makes them
      the right place to look while it is still in flight.
  - id: d
    text: The checkpoint list, which grows as validation succeeds
    correct: false
    explanation: Checkpoints tell you what was produced, not whether the input was
      accepted or where training has got to.
evidence:
