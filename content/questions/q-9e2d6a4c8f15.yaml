stem: "When labeling LeRobot subtasks in FiftyOne before exporting a derived
  dataset, what rule governs how adjacent subtask intervals (for example,
  `approach` ending and `grasp` beginning) may relate to each other?"
options:
  - id: a
    text: "Intervals are half-open, so they may touch at a boundary but must not
      overlap, and every frame in every exported episode must be covered"
    correct: true
    explanation: "Correct. The guide states intervals are half-open
      (`[start, end)`), so adjacent intervals may touch but must not overlap,
      and complete frame coverage is required before export."
  - id: b
    text: "Intervals may overlap by a few frames to make boundary review
      easier"
    correct: false
    explanation: "The guide explicitly requires that intervals must not
      overlap; overlapping boundaries are a documented export failure, not an
      allowed convenience."
  - id: c
    text: "Only the first and last frame of each episode need a subtask label;
      interior frames are optional"
    correct: false
    explanation: "The guide requires every frame in every exported episode to
      be covered by a label, not only the first and last frames."
  - id: d
    text: "Gaps between intervals are allowed as long as the gap is shorter
      than one second"
    correct: false
    explanation: "The guide requires complete coverage of every frame with no
      gaps; there is no documented gap-duration allowance."
