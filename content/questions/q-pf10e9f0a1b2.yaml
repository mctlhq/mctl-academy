stem: What happens when a base model version reaches its official deprecation
  date in Nebius Token Factory?
options:
  - id: a
    text: New request invocations are rejected and developers must migrate to an
      active model version
    correct: true
    explanation: Deprecated models are shut down for new inferences after the
      deprecation date passes.
  - id: b
    text: Requests are automatically routed to random third-party web search engines
    correct: false
    explanation: Deprecation stops inference requests rather than redirecting
      queries externally.
  - id: c
    text: The model automatically doubles its inference speed without cost changes
    correct: false
    explanation: Deprecation marks model end-of-life, not a performance upgrade.
  - id: d
    text: The project API key is permanently revoked
    correct: false
    explanation: Model deprecation does not invalidate project credentials or API keys.
