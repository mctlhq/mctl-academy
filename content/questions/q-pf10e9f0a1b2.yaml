stem: What happens to a Serverless model after its published deprecation date?
options:
  - id: a
    text: It can no longer be selected in the Playground or called by its model ID,
      and requests are not rerouted automatically
    correct: true
    explanation: The deprecation notice states that after the date you cannot select
      the model in the Playground or send API requests with its model ID, and
      Token Factory does not reroute requests automatically.
  - id: b
    text: Requests are automatically rerouted to the recommended replacement model
    correct: false
    explanation: The notice explicitly says Token Factory does not automatically
      reroute requests from deprecated models.
  - id: c
    text: Dedicated endpoints running the model are shut down at the same time
    correct: false
    explanation: The change only affects Serverless usage; dedicated endpoints for
      these models are unaffected.
  - id: d
    text: The project's API keys are revoked
    correct: false
    explanation: Deprecation concerns the model ID, not credentials.
