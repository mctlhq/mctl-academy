stem: Two security rules in one group match the same packet with conflicting
  access settings. One has priority 1 and the other priority 900. Which wins?
options:
  - id: a
    text: The rule with priority 900, because larger values are evaluated first
    correct: false
    explanation: 'The scale runs the other way: a larger number means lower priority.'
  - id: b
    text: The rule with priority 1, because 1 is the highest priority
    correct: true
    explanation: Correct. Priority 1 is the highest and 1000 the lowest, so the
      lower number takes precedence.
  - id: c
    text: Neither, because conflicting rules cause the group to be rejected
    correct: false
    explanation: Conflicts are resolved by priority rather than by refusing the
      configuration.
  - id: d
    text: Whichever rule is stateful, regardless of the priority values
    correct: false
    explanation: Stateful versus stateless controls connection tracking, not which
      of two matching rules is applied.
evidence:
  - source_id: src-co-vpc-security-groups
    excerpt: '`.spec.priority`: Priority of the rule. 1 is the highest priority,
      1000 is the lowest.'
