objective: domain-3/node-monitoring
stem: "What action should automated observability metrics trigger when a GPU
  compute node experiences unrecoverable hardware degradation?"
options:
  - id: a
    text: "Ignore the telemetry alert and continue routing new jobs to the node"
    correct: false
    explanation: "Routing jobs to degraded nodes leads to failed workloads."
  - id: b
    text: "Mark the node unhealthy, cordon it from scheduling, and alert cluster
      operators"
    correct: true
    explanation: "Cordoning degraded nodes prevents job failures while operators
      initiate recovery."
  - id: c
    text: "Delete all stored checkpoint data from shared storage"
    correct: false
    explanation: "Deleting checkpoints causes loss of progress."
  - id: d
    text: "Increase the resource quota limits on the degraded instance"
    correct: false
    explanation: "Increasing quotas on failing hardware does not resolve physical errors."
