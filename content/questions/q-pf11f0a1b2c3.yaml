stem: Which inference parameter in the Playground UI controls the randomness of
  generated model completions?
options:
  - id: a
    text: Temperature
    correct: true
    explanation: Temperature scales the logits before sampling, controlling response
      randomness and creativity.
  - id: b
    text: TCP Window Size
    correct: false
    explanation: TCP window size is a network transport layer configuration.
  - id: c
    text: CPU Core Affinity
    correct: false
    explanation: CPU affinity controls process execution on physical cores, not LLM
      sampling.
  - id: d
    text: Display Screen Refresh Rate
    correct: false
    explanation: Monitor refresh rate is a hardware display property.
