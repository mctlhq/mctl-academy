stem: "An architect is planning encryption for a new WEKA filesystem that
  will hold data subject to a later compliance investigation, and wants to
  leave the option of enabling encryption open for after the filesystem is
  already in production. Does the documented design support that plan?"
options:
  - id: a
    text: "Enable encryption at creation, since a WEKA filesystem cannot be
      converted to an encrypted filesystem after creation."
    correct: true
    explanation: "Correct. The documentation says you need to explicitly
      enable data encryption when you create a WEKA filesystem, and that it
      is not possible to convert a WEKA filesystem to an encrypted
      filesystem later."
  - id: b
    text: "Leave encryption disabled now, since a Local SSD disk in Compute
      is encrypted by default at the infrastructure level the same way a
      WEKA filesystem is."
    correct: false
    explanation: "The documentation says Local SSD disks are not encrypted
      and no other data protection method is applied to them, unlike the
      WEKA filesystem case in this plan."
  - id: c
    text: "Leave encryption disabled now, since enabling it later is
      possible the same way an optional Network SSD Non-replicated disk's
      encryption can be enabled after the disk already exists."
    correct: false
    explanation: "The documentation describes enabling encryption at
      creation time for that disk type too, through the same disk-creation
      flow, not as a change applied to an already-existing disk."
  - id: d
    text: "Leave encryption disabled now, since a shared filesystem in
      Compute lets you disable its infrastructure-level encryption later if
      the plan changes."
    correct: false
    explanation: "The documentation says shared filesystem encryption can't
      be disabled, which is the opposite of the flexibility this option
      describes."
