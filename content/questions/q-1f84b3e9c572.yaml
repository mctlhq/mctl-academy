stem: "A compliance team is designing the workflow that exports audit events to
  Object Storage for long-term retention, and is choosing the destination bucket
  for a given region's events. What constraint does the design need to satisfy?"
options:
  - id: a
    text: "The destination bucket must be in the same region as the events being
      exported."
    correct: true
    explanation: "Correct. The documentation says the destination bucket must be in
      the same region as the events, and repeats this requirement for the bucket
      ID parameter in each interface."
  - id: b
    text: "The destination bucket can be in any region, since audit event export is
      documented as copying events across regions automatically."
    correct: false
    explanation: "The documentation requires the destination bucket to be in the
      same region as the exported events; it does not describe cross-region
      copying as part of the export."
  - id: c
    text: "The exporting identity needs the admin or auditlogs.audit-event-exporter
      role on the destination bucket, while the storage.uploader role applies to
      the tenant instead."
    correct: false
    explanation: "The documentation assigns the admin or
      auditlogs.audit-event-exporter role to the tenant and the storage.uploader
      role to the destination bucket, the reverse of what this option
      describes."
  - id: d
    text: "The export writes events under a custom object prefix, since the
      documentation requires a prefix to be specified for every export."
    correct: false
    explanation: "The documentation says the object prefix is optional and the
      auditlogs prefix is used by default when omitted, not required on every
      export."
