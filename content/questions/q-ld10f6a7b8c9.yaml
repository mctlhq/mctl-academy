stem: "Which pricing model strategy optimizes operational costs for continuous 24/7 high-volume inference workloads?"
options:
  - id: a
    text: "Utilizing dedicated endpoint capacity or reserved infrastructure instead of pure pay-as-you-go per token pricing"
    correct: true
    explanation: "Dedicated endpoint capacity provides predictable flat-rate billing for continuous high-throughput production workloads."
  - id: b
    text: "Executing all inference via short-lived un-cached serverless functions without batching"
    correct: false
    explanation: "Un-batched serverless functions on high-volume 24/7 workloads incur massive per-request costs."
  - id: c
    text: "Disabling response caching across all client applications"
    correct: false
    explanation: "Disabling caching forces redundant API calls and increases token expenditure."
  - id: d
    text: "Multiplying input prompt lengths with redundant filler text"
    correct: false
    explanation: "Adding filler text increases token consumption and billing unnecessarily."
