stem: A finance lead asks when a dedicated endpoint incurs charges. What is the rule?
options:
  - id: a
    text: From creation until deletion, regardless of replica count
    correct: false
    explanation: Charges track running replicas, not the mere existence of the endpoint.
  - id: b
    text: Only while traffic is actively being served
    correct: false
    explanation: A running replica is billable whether or not requests are arriving.
  - id: c
    text: Whenever at least one replica is running
    correct: true
    explanation: Correct. One or more running replicas makes the endpoint active, accessible
      and billable.
  - id: d
    text: Monthly in advance, based on the maximum replica setting
    correct: false
    explanation: Billing follows actual running replicas rather than a pre-purchased maximum.
evidence:
  - source_id: src-ld-dedicated-billing-policy
    excerpt: A dedicated endpoint is considered **active, accessible, and billable** when
      **at least one replica is running**
