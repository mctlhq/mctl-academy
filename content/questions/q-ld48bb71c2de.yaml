objective: domain-3/structured-output
stem: A team already passes a JSON schema in the request. What additional
  practice does the documentation recommend?
options:
  - id: a
    text: Also describe the schema in the text prompt given to the model
    correct: true
    explanation: Correct. Practical testing showed it is always better to supply the
      schema in both places.
  - id: b
    text: Send the schema only in the prompt and drop the parameter
    correct: false
    explanation: Dropping the parameter would remove the mechanism that enforces the shape.
  - id: c
    text: Split the schema across several requests to stay within limits
    correct: false
    explanation: No such splitting is suggested.
  - id: d
    text: Validate the schema by first requesting an arbitrary JSON object
    correct: false
    explanation: A preliminary arbitrary-JSON call is not part of the recommendation.
