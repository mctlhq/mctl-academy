stem: What is the core benefit of Low-Rank Adaptation (LoRA) over full parameter
  fine-tuning?
options:
  - id: a
    text: It converts text data into 3D polygon meshes for graphics rendering
    correct: false
    explanation: LoRA is a parameter-efficient fine-tuning method for neural
      networks, not a 3D graphics renderer.
  - id: b
    text: It eliminates the requirement for system prompt instructions
    correct: false
    explanation: System prompts remain available and functional regardless of
      fine-tuning strategy.
  - id: c
    text: It trains small low-rank adapter matrix parameters while keeping base
      model weights frozen, drastically reducing memory usage
    correct: true
    explanation: LoRA freezes base model weights and trains rank-decomposition
      matrices, dramatically lowering compute/VRAM requirements.
  - id: d
    text: It forces all model responses to be formatted as CSV rows
    correct: false
    explanation: Output format is controlled by response formatting parameters, not
      adapter weight factorization.
