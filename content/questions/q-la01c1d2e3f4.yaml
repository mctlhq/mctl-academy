stem: "When a fine-tuning job is created with `lora: true`, which weights are
  trained?"
options:
  - id: a
    text: All base model parameters
    correct: false
    explanation: "That is full fine-tuning, the `lora: false` behaviour."
  - id: b
    text: Only the embedding layer
    correct: false
    explanation: Not what the LoRA option does.
  - id: c
    text: Only the LoRA adapter weights, while the base model weights stay frozen
    correct: true
    explanation: The `lora` hyperparameter is documented so that `true` trains only
      the LoRA adapter weights and keeps the base model weights frozen, whereas
      `false` applies full fine-tuning.
  - id: d
    text: The base weights, while the adapter weights stay frozen
    correct: false
    explanation: "Reversed: the adapters are trained and the base is frozen."
