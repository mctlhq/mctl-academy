stem: "Which practice speeds up resolution when escalating an infrastructure bug to cloud vendor support?"
options:
  - id: a
    text: "Providing minimal reproducible code snippets, node IDs, timestamped kernel logs, and system environment details"
    correct: true
    explanation: "Including reproducible code, exact node IDs, and kernel logs gives support engineers actionable diagnostics immediately."
  - id: b
    text: "Escalating verbal complaints without sharing system log files"
    correct: false
    explanation: "Verbal reports without logs delay root cause analysis."
  - id: c
    text: "Re-booting master nodes repeatedly while support is investigating"
    correct: false
    explanation: "Rebooting while support investigates destroys active diagnostic state."
  - id: d
    text: "Modifying production permissions during active incident triage"
    correct: false
    explanation: "Changing permissions mid-triage introduces secondary variables and confounds analysis."
