stem: Comparing two candidate models on their cards in the UI, a team wants a
  published measure of answer quality. Which field carries it?
options:
  - id: a
    text: Tokens per second, since faster models are better tuned
    correct: false
    explanation: That is an approximate generation speed and says nothing about
      answer quality.
  - id: b
    text: Input tokens, since richer models cost more per token
    correct: false
    explanation: That is a price in USD per million tokens, not a quality measure.
  - id: c
    text: Quality, which reports the MMLU score published by the model provider
    correct: true
    explanation: Correct. The Quality field on the card is the provider-reported MMLU score.
  - id: d
    text: Output tokens, which reflects how much reasoning the model produces
    correct: false
    explanation: That is the price of generated tokens, again a cost rather than a
      quality signal.
