stem: "When creating or recording a LeRobotDataset v3.0 dataset, what happens if
  `dataset.finalize()` is never called before `push_to_hub()`?"
options:
  - id: a
    text: "The dataset still loads correctly, but without any normalization
      statistics"
    correct: false
    explanation: "The documented failure mode is incomplete, improperly loading
      parquet files from unclosed writers — not merely missing normalization
      statistics."
  - id: b
    text: "The dataset uploads successfully but with videos stripped from the MP4
      shards"
    correct: false
    explanation: "The documentation does not describe `finalize()` as affecting
      video shards specifically; it describes parquet writer closure and
      metadata footers."
  - id: c
    text: "`push_to_hub()` automatically calls `finalize()` internally, so omitting
      it has no effect"
    correct: false
    explanation: "The documentation instructs callers to explicitly call
      `finalize()` before `push_to_hub()`, and warns of incomplete parquet files
      if it is skipped — it does not describe `push_to_hub()` calling it
      automatically."
  - id: d
    text: "The parquet files will be incomplete and the dataset won't load properly"
    correct: true
    explanation: "Correct. The documentation states that without calling
      `finalize()`, the parquet files will be incomplete and the dataset won't
      load properly, because `finalize()` closes the parquet writers and writes
      footer metadata."
