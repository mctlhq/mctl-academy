stem: With a bank card as the payment method, when is the card automatically charged?
options:
  - id: a
    text: At the start of the month if the balance is negative, or when the
      configured billing threshold is reached
    correct: true
    explanation: The automatic charging section lists exactly these two cases; the
      charge amount brings the balance back to zero.
  - id: b
    text: Only at the start of every month, regardless of balance
    correct: false
    explanation: A month-start charge applies when the balance is negative; a
      threshold-triggered charge can happen at any point in the month.
  - id: c
    text: Whenever the balance falls below the trial credit amount
    correct: false
    explanation: Trial credit is a sign-up bonus with its own 30-day validity; it is
      not the trigger for automatic charging.
  - id: d
    text: Only when a promo code is applied to the account
    correct: false
    explanation: Promo codes add free credits to the balance; they are not an
      automatic charging trigger.
