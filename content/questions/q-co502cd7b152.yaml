objective: domain-3/resource-quotas
stem: A team stops several GPU VMs overnight and expects the freed quota to let
  them launch a new cluster. Does it?
options:
  - id: a
    text: Yes, stopped VMs release their quota until they are started again
    correct: false
    explanation: Stopping does not release quota; the reservation persists while the
      VM exists.
  - id: b
    text: Yes, but only for GPU quotas, not for storage quotas
    correct: false
    explanation: The rule does not distinguish stopped from running for either category.
  - id: c
    text: No, quota is only released once the region's capacity is rebalanced
    correct: false
    explanation: Quota accounting is not tied to capacity rebalancing.
  - id: d
    text: No, a VM counts toward quota from creation to deletion regardless of power
      state
    correct: true
    explanation: Correct. Only deleting the VM releases what it counts against.
evidence:
  - source_id: src-co-compute-quotas
    excerpt: count towards the quotas throughout the VM's lifecycle, from its
      creation to deletion, regardless of whether it is running or stopped
