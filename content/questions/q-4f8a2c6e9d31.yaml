objective: domain-4/application-integration
stem: "A robot application's CI pipeline needs to push container images to
  Nebius Container Registry so a fleet service can pull and run them. What does
  running `nebius registry configure-helper` let the pipeline do?"
options:
  - id: a
    text: "Automatically create a new registry, replacing the separate `nebius
      registry create` step"
    correct: false
    explanation: "Creating a registry is a distinct documented step (`nebius
      registry create`); the credential helper only configures Docker
      authentication, it does not create registries."
  - id: b
    text: "Run Docker commands as root for faster image pushes"
    correct: false
    explanation: "The guide explicitly warns not to run Docker commands as root,
      since the credential helper is configured for the user account, not root."
  - id: c
    text: "Remove the need to install Docker Engine before pushing images"
    correct: false
    explanation: "Installing Docker Engine is a separate prerequisite step; the
      credential helper only configures authentication for an already-installed
      Docker."
  - id: d
    text: "Use registries in Container Registry without running `docker login`"
    correct: true
    explanation: "Correct. The credential helper lets you use registries in
      Container Registry without running docker login."
evidence:
