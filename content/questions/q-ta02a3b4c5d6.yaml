stem: What organization structure is initialized when a new user signs up for
  the platform?
options:
  - id: a
    text: A personal organization is created automatically for the user
    correct: true
    explanation: Account creation automatically initializes a personal organization
      for resource scoping.
  - id: b
    text: A global enterprise organization with 50 pre-configured team members
    correct: false
    explanation: Sign-up initializes a personal organization, not an enterprise team.
  - id: c
    text: A read-only sandbox account that cannot generate API keys
    correct: false
    explanation: Personal organizations have full access to generate API keys and
      manage projects.
  - id: d
    text: A temporary 24-hour trial organization that auto-deletes
    correct: false
    explanation: The created personal organization is a permanent account container.
