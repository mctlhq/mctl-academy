stem: "When isolating high-bandwidth GPU cluster traffic, which VPC networking setup prevents public internet exposure?"
options:
  - id: a
    text: "Deploying nodes in private subnets with internal security group rules"
    correct: true
    explanation: "Private subnets paired with restricted internal security groups isolate cluster traffic from public routing."
  - id: b
    text: "Attaching public IPv4 addresses to every GPU compute interface"
    correct: false
    explanation: "Public IP addresses expose interfaces directly to external internet threats."
  - id: c
    text: "Removing subnet routing tables completely"
    correct: false
    explanation: "Removing routing tables breaks all inter-node communication."
  - id: d
    text: "Routing all internal traffic through external third-party proxies"
    correct: false
    explanation: "External proxies add latency and introduce external security risks."
