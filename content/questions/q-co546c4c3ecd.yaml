stem: You have confirmed a CUDA initialization failure on a GPU VM. What is the documented
  range of remedies?
options:
  - id: a
    text: Restart the NVIDIA Fabric Manager service, the GPUs, or the entire VM
    correct: true
    explanation: Correct. These are the three documented remedies, in increasing order of
      disruption.
  - id: b
    text: Recreate the VM from a different boot disk image
    correct: false
    explanation: The failure is not attributed to the image, and rebuilding is not the documented
      fix.
  - id: c
    text: Detach and reattach the local SSD disks holding the workload data
    correct: false
    explanation: Storage attachment is unrelated to CUDA initialization.
  - id: d
    text: Move the VM into a different InfiniBand fabric
    correct: false
    explanation: Fabric choice concerns cluster networking and cannot be changed for an existing
      resource anyway.
