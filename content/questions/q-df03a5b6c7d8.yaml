stem: In a conversational fine-tuning dataset, which `role` values appear in the
  documented `messages` examples?
options:
  - id: a
    text: "`system`, `user`, `assistant`, and `tool` in function-calling
      conversations"
    correct: true
    explanation: The basic example uses `system`, `user`, and `assistant` messages;
      the tool-calling example adds `tool` messages carrying a `tool_call_id`.
  - id: b
    text: "`admin`, `moderator`, and `guest`"
    correct: false
    explanation: These are application permission roles, not message roles in a
      training conversation.
  - id: c
    text: "`input` and `output` only"
    correct: false
    explanation: Conversational examples are a `messages` array with roles;
      `input`/`output` is not the documented shape.
  - id: d
    text: "`query` and `document`"
    correct: false
    explanation: Query and document are rerank request fields, not roles in a chat dataset.
