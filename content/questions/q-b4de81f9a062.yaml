objective: domain-4/capacity-and-scaling
stem: A self-service dedicated endpoint is stopped for scheduled maintenance.
  According to the capacity documentation, what happens to the GPU capacity it
  was using?
options:
  - id: a
    text: It is released back to the shared pool, the same as if the endpoint had
      been stopped manually
    correct: true
    explanation: The capacity documentation states that GPU capacity is released
      back to the shared pool and that this applies regardless of why the
      endpoint stopped, naming scheduled maintenance as one of those reasons.
  - id: b
    text: It stays allocated under the minimum replicas guarantee until the endpoint
      restarts
    correct: false
    explanation: The minimum replicas guarantee is documented as applying only while
      the endpoint is active; it is not a long-term reservation that survives a
      stop.
  - id: c
    text: It remains available under the burst capacity used for scaling above the
      minimum replicas
    correct: false
    explanation: Burst capacity is documented as governing scaling above the minimum
      while an endpoint is running, not retaining capacity after a stop.
  - id: d
    text: It is automatically converted into reserved GPU capacity for the account
    correct: false
    explanation: Reserved capacity is documented as a separate, contract-based
      option arranged through Sales; stopping an endpoint does not convert
      anything into a reservation.
evidence:
