objective: domain-2/ie-training-cluster-lifecycle
stem: "A platform team increases a GPU node group's target node count to add
  training capacity, without changing the node group's template. Does Managed
  Kubernetes replace any of the group's existing nodes as part of this change?"
options:
  - id: a
    text: "No -- scaling a node group up or down, whether done manually or by the
      autoscaler, does not recreate any existing nodes"
    correct: true
    explanation: "Correct. The documentation states that scaling a node group up or
      down, whether you or the autoscaler does it, does not recreate any nodes."
  - id: b
    text: "Yes -- scaling up or down triggers the same cordon, drain, delete and
      recreate sequence used when the node template changes"
    correct: false
    explanation: "That cordon-drain-delete-create sequence is the deployment
      strategy used when the node group's template changes, not when it is only
      scaled."
  - id: c
    text: "Yes, if the node group additionally has a GPU cluster attached for
      high-speed InfiniBand interconnect"
    correct: false
    explanation: "Whether the group uses a GPU cluster is unrelated to whether
      scaling recreates nodes; the behavior described is the same either way."
  - id: d
    text: "No, but just when the autoscaler performs the scaling rather than a
      manual request"
    correct: false
    explanation: "The documentation treats manual and autoscaler-driven scaling the
      same way: neither recreates existing nodes."
