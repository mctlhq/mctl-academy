stem: An engineer created a security group with the intended rules, but the VM's
  traffic is still unfiltered. What step is most likely missing?
options:
  - id: a
    text: The security group has not been associated with the VM's project
    correct: false
    explanation: Security groups are associated with a network, and project
      membership is not what puts a group into effect for a VM.
  - id: b
    text: The rules were created without a priority, so none of them are evaluated
    correct: false
    explanation: Priority orders rules against one another; a missing association
      explains traffic being unfiltered altogether.
  - id: c
    text: The VM must be restarted before any security group takes effect
    correct: false
    explanation: A restart is not the documented requirement for a security group to apply.
  - id: d
    text: The VM's network interface has not been added to the security group
    correct: true
    explanation: Correct. A security group only applies to a VM once the VM's
      network interface has been added to that security group.
evidence:
  - source_id: src-co-vpc-security-groups
    excerpt: For a security group to apply to a VM, you need to add a VM's network
      interface to the security group.
