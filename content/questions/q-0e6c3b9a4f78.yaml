stem: "A production app runs Search calls near its 1,000 RPM limit, then starts sending Crawl calls at the same rate. Per Tavily's Rate Limits documentation, what should it expect?"
options:
  - id: a
    text: "The Crawl calls are governed by their own separate limit that applies equally to development and production keys, not the higher production Search limit"
    correct: true
    explanation: "Correct. The documentation states the crawl endpoint has a separate rate limit that applies to both development and production keys."
  - id: b
    text: "The Crawl calls share the same 1,000 RPM production limit as Search"
    correct: false
    explanation: "The documentation gives Crawl its own separate rate limit rather than sharing the default 1,000 RPM production limit."
  - id: c
    text: "Crawl has no documented rate limit at all"
    correct: false
    explanation: "The documentation states Crawl has its own separate rate limit; it is not undocumented or absent."
  - id: d
    text: "Crawl's separate limit applies only to development keys, not production"
    correct: false
    explanation: "The documented Crawl limit applies to both development and production keys, not development alone."
