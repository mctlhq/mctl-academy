objective: domain-4/rate-limit-handling
stem: "An application is sending Search calls near its account's rate limit,
  then begins sending Crawl calls at that same request rate. What should it
  expect from Tavily's per-endpoint rate limits?"
options:
  - id: a
    text: "Crawl is capped by its own separate limit that does not rise with
      the account's search limit"
    correct: true
    explanation: "Correct. Endpoints such as crawl keep their own fixed limit,
      separate from and not scaled to the account's general search limit,
      even once search traffic is already near that limit."
  - id: b
    text: "Crawl shares the account's general search limit, so the elevated
      rate carries over automatically"
    correct: false
    explanation: "Crawl, map and research keep their own fixed limit rather
      than inheriting or scaling with the account's broader search limit."
  - id: c
    text: "Crawl calls are throttled under the flex tier capacity restriction
      that applies during heavy load to live content fetches"
    correct: false
    explanation: "Flex tier capacity governs search requests that set
      max_age_hours during heavy load; it does not govern crawl's per-minute
      cap."
  - id: d
    text: "Crawl calls count against the separate usage-endpoint limit rather
      than against any per-minute cap"
    correct: false
    explanation: "The usage endpoint's rate limit governs calls to the usage
      endpoint itself, not calls to crawl."
evidence:
  - source_id: src-tv-rate-limits
    excerpt: "an organization with a 1,500 RPM limit can send up to 1,500
      search requests per minute, but no more than 100 crawl requests per
      minute"
