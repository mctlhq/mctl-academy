stem: An architect asks how much control a dedicated endpoint gives over the
  hardware behind a deployment. What is accurate?
options:
  - id: a
    text: GPU type and the number of GPUs per replica are both selectable
    correct: true
    explanation: Correct. Both are chosen to match the deployment's performance and
      throughput needs.
  - id: b
    text: Only the total number of replicas can be chosen; hardware is assigned
    correct: false
    explanation: GPU type and GPUs per replica are explicitly under the customer's control.
  - id: c
    text: Hardware is fixed per region and cannot be influenced
    correct: false
    explanation: Region is a separate control from GPU configuration.
  - id: d
    text: GPU type is selectable only under an enterprise contract
    correct: false
    explanation: Selecting GPU type is part of configuring a dedicated endpoint.
