stem: How does the Token Factory Embeddings API reference describe the `input`
  field of an embedding request?
options:
  - id: a
    text: Text to embed, encoded as a string or an array of tokens
    correct: true
    explanation: Correct. The `input` field description states it is text to embed,
      encoded as a string or array of tokens.
  - id: b
    text: A base64-encoded audio file to transcribe before embedding
    correct: false
    explanation: The endpoint embeds text you supply; it does not accept or
      transcribe audio.
  - id: c
