    correct: false
    explanation: "`input` is the text to embed, not a vector the caller has
      already computed."
  - id: d
    text: A URL pointing to a document the API should fetch and embed
    correct: false
    explanation: The API embeds the text you send in the request; it does not
      fetch documents from a URL.
