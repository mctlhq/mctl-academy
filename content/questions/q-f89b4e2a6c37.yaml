objective: domain-3/crawl-scope
stem: "A team wants a hard ceiling on the total number of pages a Crawl processes, regardless of its depth or breadth settings. Per Tavily's Crawl best practices, which parameter provides that?"
options:
  - id: a
    text: "`max_depth`, since it caps how many levels deep the crawl explores"
    correct: false
    explanation: "max_depth bounds how many levels deep the crawl explores, not the total number of pages."
  - id: b
    text: "`max_breadth`, since it caps how many links are followed per page"
    correct: false
    explanation: "max_breadth bounds links per page level (horizontal spread), not the total page count."
  - id: c
    text: "`limit`, the total maximum pages to crawl and a hard cap on pages"
    correct: true
    explanation: "Correct. The best practices describe limit exactly this way: total maximum pages to crawl, a hard cap on pages."
  - id: d
    text: "`extract_depth`, since it caps how thoroughly each page is extracted"
    correct: false
    explanation: "extract_depth controls extraction thoroughness per page, not the total number of pages crawled."
