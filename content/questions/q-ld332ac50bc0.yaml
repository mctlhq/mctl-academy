stem: Which optimization works by splitting an input sequence into smaller chunks that are
  processed separately?
options:
  - id: a
    text: Paged Attention
    correct: true
    explanation: Correct. Chunking the input this way reduces memory usage and computation.
  - id: b
    text: Context Caching
    correct: false
    explanation: That stores the output of previous layers for each input sequence to avoid
      recomputation.
  - id: c
    text: Flash Attention
    correct: false
    explanation: That is a modified attention mechanism that reduces the computations attention
      requires.
  - id: d
    text: Quantization
    correct: false
    explanation: That lowers numeric precision rather than restructuring the sequence.
