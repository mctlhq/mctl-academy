stem: "In the Serverless AI endpoint-creation tutorial, which web console setting makes the deployed endpoint require a bearer token on every request?"
options:
  - id: a
    text: "Bearer token authentication: Enabled"
    correct: true
    explanation: "Correct. The tutorial sets \"Bearer token authentication\" to Enabled when creating the endpoint and has you copy the generated token to authenticate requests."
  - id: b
    text: "Network: Public static IP"
    correct: false
    explanation: "That setting controls how the endpoint is exposed on the network; it does not require a bearer token on requests."
  - id: c
    text: "Computing resources: With GPU"
    correct: false
    explanation: "That setting requests GPU-backed compute for the endpoint; it is unrelated to request authentication."
  - id: d
    text: "Available platform: NVIDIA® L40S Intel"
    correct: false
    explanation: "That setting selects the hardware platform for the endpoint; it does not control authentication."
