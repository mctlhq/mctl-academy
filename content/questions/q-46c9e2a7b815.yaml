stem: According to the documented fine-tuning job status progression, which
  status comes first, before `queued` and `running`?
options:
  - id: a
    text: "`validating_files`"
    correct: true
    explanation: The job's key fields list the status progression as
      `validating_files` → `queued` → `running` → `succeeded` / `failed`, with
      `validating_files` first.
  - id: b
    text: "`queued`"
    correct: false
    explanation: "`queued` is the second status in the documented progression, after
      `validating_files`."
  - id: c
    text: "`running`"
    correct: false
    explanation: "`running` is the third status in the documented progression, after
      `validating_files` and `queued`."
  - id: d
    text: "`succeeded`"
    correct: false
    explanation: "`succeeded` is one of the two documented terminal statuses,
      reached at the end of the progression, not the start."
