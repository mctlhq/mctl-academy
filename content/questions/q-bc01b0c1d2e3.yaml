stem: How does pricing differ between public serverless endpoints and dedicated
  endpoints?
options:
  - id: a
    text: Serverless is billed by storage volume; dedicated is billed per SQL query
    correct: false
    explanation: Neither storage nor queries are the documented pricing basis for
      inference endpoints.
  - id: b
    text: Serverless is billed per token; dedicated is billed per GPU/hour with
      per-minute granularity
    correct: true
    explanation: The dedicated versus public comparison table lists pricing as per
      token for public serverless and per GPU/hour, billed with per-minute
      granularity, for dedicated.
  - id: c
    text: Serverless is free; dedicated carries a fixed annual licence fee
    correct: false
    explanation: Public serverless usage is billed per token, and dedicated pricing
      is per GPU/hour, not an annual fee.
  - id: d
    text: Both are billed a flat fee per HTTP request
    correct: false
    explanation: The documented bases are tokens for serverless and GPU-hours for
      dedicated, not request counts.
