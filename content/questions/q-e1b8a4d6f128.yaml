stem: "An agent wants to check how many credits its API key has consumed so
  far this billing cycle. Per the Usage API reference, which field should it
  read?"
options:
  - id: a
    text: "The top-level `credits` field returned by a single Search call
      with include_usage=true"
    correct: false
    explanation: "include_usage on Search reports that single call's cost, not
      the account's cumulative usage for the cycle."
  - id: b
    text: "The `failed_results` count returned by an Extract call"
    correct: false
    explanation: "failed_results lists URLs that could not be processed; it
      has nothing to do with credit usage."
  - id: c
    text: "`account.plan_limit`, the credits used for this API key this cycle"
    correct: false
    explanation: "plan_limit is the usage limit for the current plan, not the
      credits used so far."
  - id: d
    text: "`key.usage`, the total credits used for this API key during the
      current billing cycle"
    correct: true
    explanation: "Correct. The Usage API reference describes key.usage exactly
      this way."
