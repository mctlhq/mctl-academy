stem: In the Token Factory Playground, what does the "Quality" value shown on a
  model card represent?
options:
  - id: a
    text: The MMLU score reported by the model provider
    correct: true
    explanation: The model card documentation defines Quality as the MMLU score
      reported by the model provider.
  - id: b
    text: The approximate generation speed in tokens per second
    correct: false
    explanation: That is the separate "Tokens per second" metric on the model card,
      not Quality.
  - id: c
    text: The price per input token, in USD per million tokens
    correct: false
    explanation: That is the separate "Input tokens" price metric on the model card,
      not Quality.
  - id: d
    text: The price per output token, in USD per million tokens
    correct: false
    explanation: That is the separate "Output tokens" price metric on the model
      card, not Quality.
