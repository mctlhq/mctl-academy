stem: "A dedicated endpoint running one GPU per replica is showing per-request
  latency above the team's target, and they are considering just adding more
  replicas to fix it. What should they do instead first?"
options:
  - id: a
    text: "Scale the GPU type or the number of GPUs per replica before increasing
      the replica count, since more replicas do not fix latency caused by
      insufficient GPU resources"
    correct: true
    explanation: "Correct. The best-practices guide warns that more replicas help
      concurrency but do not fix poor per-request latency caused by insufficient
      GPU resources, and recommends scaling GPU type or GPU count per replica
      first."
  - id: b
    text: "Lower the minimum replicas count, since a smaller guaranteed baseline
      capacity frees up GPU resources that reduce per-request latency on the
      endpoint's remaining replicas"
    correct: false
    explanation: "Lowering the minimum replicas count changes the guaranteed
      baseline capacity, not the per-request performance of a single replica; it
      does not address insufficient GPU resources behind a latency problem."
  - id: c
    text: "Switch the deployment to a mid-range GPU type, since mid-range GPUs are
      the ones built for low per-request latency under heavy concurrent traffic"
    correct: false
    explanation: "The guide associates higher-end GPUs, not mid-range ones, with low
      latency requirements and heavy concurrent traffic; mid-range GPUs are
      positioned for cost-sensitive, moderate-traffic deployments instead."
  - id: d
    text: "Raise the maximum replicas count, since a higher scaling ceiling is what
      resolves per-request latency that a single, underpowered replica cannot
      meet on its own"
    correct: false
    explanation: "Raising the maximum replicas count changes how far autoscaling can
      expand under burst traffic; it does not fix the per-request latency of an
      individual, underpowered replica."
