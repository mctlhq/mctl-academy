objective: domain-1/web-access-operations
stem: "A team wants to see every URL on a site quickly, before deciding which
  pages are worth a full read. Which Tavily operation fits this step, saving
  full content extraction for later?"
options:
  - id: a
    text: "Map, for quick site structure discovery without extracting content"
    correct: true
    explanation: "Correct. Crawl's best-practices guide lists quick site
      structure discovery and URL collection without content extraction as
      what Map is for, while Crawl is for full content extraction and deep
      analysis."
  - id: b
    text: "Crawl, since it also discovers structure quickly before extracting
      content"
    correct: false
    explanation: "Crawl is listed for full content extraction and deep
      content analysis, not quick structure discovery; extracting content is
      what makes it slower than Map."
  - id: c
    text: "Extract, since it can list a site's URLs without reading them"
    correct: false
    explanation: "Extract pulls content from URLs you already have; it does
      not discover a site's URL structure the way Map does."
  - id: d
    text: "Search, since it returns a ranked list of site URLs first"
    correct: false
    explanation: "Search finds and ranks sources for a query across the web;
      it does not map a single site's URL structure."
