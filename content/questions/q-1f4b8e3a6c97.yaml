stem: "Nebius's physical-augmentation data-collection workflow records every
  attempted demonstration, including failures. What criteria must a collected
  attempt meet to be accepted into the final dataset?"
options:
  - id: a
    text: "Any attempt that completes without the robot colliding with the
      table"
    correct: false
    explanation: "Collision avoidance alone is not the documented acceptance
      criterion; specific measured thresholds for lift height, velocity,
      proximity and drift are required."
  - id: b
    text: "A measured lift of at least 10 cm, low object velocity, proximity to
      the closed tool, and limited lateral drift — a terminated attempt cannot
      pass"
    correct: true
    explanation: "Correct. The documentation states acceptance requires a
      measured lift of at least 10 cm, low object velocity, proximity to the
      closed tool, and limited lateral drift, and that a terminated attempt
      cannot pass."
  - id: c
    text: "All attempts are accepted, since the dataset is meant to include
      both successes and failures for analysis"
    correct: false
    explanation: "The documentation describes specific acceptance criteria that
      exclude attempts failing the measured thresholds; not every collected
      attempt is accepted into the dataset."
  - id: d
    text: "Only attempts under the nominal (non-displaced, non-mass-changed)
      condition are accepted"
    correct: false
    explanation: "All four sealed conditions, including displaced object,
      double mass and lower friction, are reported as having accepted trials;
      condition type is not an acceptance criterion."
