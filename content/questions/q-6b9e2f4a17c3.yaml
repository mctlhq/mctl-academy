objective: domain-2/retrieval-pipelines
stem: You are composing a retrieval pipeline. Candidate passages have already
  been retrieved from the corpus, and you now need them ordered by how relevant
  each one is to the user's query before the best few are passed to the model.
  Which documented API operation performs this ranking step?
options:
  - id: a
    text: Create embeddings for the query and each candidate passage
    correct: false
    explanation: The embeddings endpoint takes input text to embed and returns
      embedding vectors; it does not compare your documents against the query or
      return an ordering of them.
  - id: b
    text: Create a chat completion for the query
    correct: false
    explanation: The chat completion endpoint creates a model response for the
      given chat conversation; generating an answer is a later pipeline stage
      than ranking the retrieved passages.
  - id: c
    text: Rerank the candidate documents against the query
    correct: true
    explanation: The rerank operation reranks documents based on their relevance
      to a query; each result carries the document's index and a relevance
      score, so the pipeline can keep the most relevant passages.
  - id: d
    text: List the currently available models
    correct: false
    explanation: The List models operation lists the currently available models
      and basic information such as the owner and availability; it takes no
      documents and returns no ranking.
