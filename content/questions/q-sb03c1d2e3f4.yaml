stem: How should environment variables containing secret API keys be passed to
  an agent sandbox environment?
options:
  - id: a
    text: Hardcoded as plain text inside generated code scripts
    correct: false
    explanation: Hardcoding credentials exposes keys in code logs and version
      control artifacts.
  - id: b
    text: Written to a public world-readable file in `/tmp/keys.txt`
    correct: false
    explanation: World-readable temporary files leak secrets to any local process.
  - id: c
    text: Injected securely via ephemeral environment secrets without writing to disk
    correct: true
    explanation: Secrets should be injected in-memory at process initialization
      without disk persistence.
  - id: d
    text: Encoded as base64 strings in public GitHub issues
    correct: false
    explanation: Base64 encoding is not encryption; public posting leaks secrets instantly.
