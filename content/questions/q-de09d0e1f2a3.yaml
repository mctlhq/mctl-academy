objective: domain-4/rate-limits
stem: Which HTTP status does the API return when a request exceeds the active
  rate limit on a public serverless endpoint?
options:
  - id: a
    text: HTTP 429 Too Many Requests
    correct: true
    explanation: The rate limits page states that exceeding the active limit returns
      HTTP 429, and recommends tracking the remaining-requests and
      remaining-tokens headers to avoid it.
  - id: b
    text: HTTP 500 Internal Server Error
    correct: false
    explanation: 500 signals a server failure, not a client exceeding its quota.
  - id: c
    text: HTTP 404 Not Found
    correct: false
    explanation: 404 means the resource does not exist; it is unrelated to rate limiting.
  - id: d
    text: HTTP 401 Unauthorized
    correct: false
    explanation: 401 indicates a missing or invalid API key, not an exhausted rate limit.
evidence:
