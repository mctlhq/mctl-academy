objective: domain-1/sa-distributed-training
stem: "An architect is designing the scheduling strategy for a large
  distributed-training job that will run across many GPU virtual machines within
  one GPU cluster, and wants to minimize network communication latency and cost
  between workers. What should the design do?"
options:
  - id: a
    text: "Provide the cluster's topology file to the workload manager so it
      schedules workers on nodes that are topologically closest to each other."
    correct: true
    explanation: "Correct. The documentation says that when you provide a topology
      file to a workload manager, it schedules distributed jobs on the worker
      nodes that are topologically closest to each other."
  - id: b
    text: "Spread the job's workers evenly across as many points of delivery as
      possible, since connections between points of delivery carry no extra
      communication cost."
    correct: false
    explanation: "The documentation says the cost of network communication increases
      at higher layers such as between points of delivery, through a root switch
      -- the opposite of what this option claims."
  - id: c
    text: "Rely on the platform's GPU memory bandwidth alone to reduce latency,
      since topology files are documented as applying to CPU workloads instead
      of GPU scheduling."
    correct: false
    explanation: "Topology files describe the network layout of GPU virtual machines
      within a GPU cluster for topology-aware scheduling; they apply to GPU
      workloads, not CPU workloads."
  - id: d
    text: "Schedule workers without regard to their location in the cluster, since
      the InfiniBand topology layers exist purely for documentation and do not
      affect scheduling."
    correct: false
    explanation: "Topology-aware scheduling using the topology file is what places
      workers close together and reduces latency; the layers describe real
      placement that scheduling decisions act on, not a documentation-only
      detail."
