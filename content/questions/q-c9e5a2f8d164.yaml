stem: "The Sandboxes documentation lists several identifiers in its 'Core
  identifiers' table. Which one is described as 'a mutable name that points to
  an image'?"
options:
  - id: a
    text: "Image UUID"
    correct: false
    explanation: "Wrong. The documentation describes an Image UUID as identifying an
      immutable stored filesystem state, not a mutable name."
  - id: b
    text: "Tag"
    correct: true
    explanation: "Correct. The documentation's identifiers table defines a tag as a
      mutable name that points to an image."
  - id: c
    text: "Operation ID"
    correct: false
    explanation: "Wrong. The documentation describes an Operation ID as identifying
      one asynchronous service operation, not a name that points to an image."
  - id: d
    text: "Client session name"
    correct: false
    explanation: "Wrong. The documentation describes a client session name as
      client-side workflow state, such as the CLI's selected image and history,
      not a mutable pointer to an image."
