stem: Can a single Token Factory user account belong to more than one organization?
options:
  - id: a
    text: "Yes: a user can be invited to other organizations and can create
      additional organizations"
    correct: true
    explanation: Besides the personal organization created at sign-up, the docs say
      you can be invited to other organizations and create additional ones for
      separate teams or business units.
  - id: b
    text: "No: signing up locks the account to its personal organization permanently"
    correct: false
    explanation: The personal organization is created automatically, but invitations
      to other organizations are explicitly supported.
  - id: c
    text: Only if a separate payment card is registered per organization
    correct: false
    explanation: No such condition is documented for organization membership.
  - id: d
    text: Only during the first 24 hours after account creation
    correct: false
    explanation: No time window is documented.
