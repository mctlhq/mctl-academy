objective: domain-3/endpoint-selection
stem: "A team needs a single finished answer with citations synthesized from
  several sources, rather than raw source URLs to process themselves. Per
  Tavily's agent setup guide, which endpoint fits?"
options:
  - id: a
    text: "Search, since it always returns a synthesized final answer"
    correct: false
    explanation: "The guide says to use Search when you need raw source URLs and
      content to process yourself, not a finished synthesized answer."
  - id: b
    text: "Crawl, since reading more pages always produces better citations"
    correct: false
    explanation: "Crawl returns raw page content for you to process; it does not
      produce a synthesized, cited answer by itself."
  - id: c
    text: "Map, since it discovers which sources exist before synthesis"
    correct: false
    explanation: "Map only lists URLs; it does not synthesize an answer at all."
  - id: d
    text: "Research, since it is for a finished, multi-source answer with citations"
    correct: true
    explanation: "Correct. The guide states to use Research for exactly this: a
      finished, multi-source answer with citations."
evidence:
