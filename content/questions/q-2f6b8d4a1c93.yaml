objective: domain-3/release-management
stem: "A team pushed several checkpoints of a robot policy to the Hugging Face
  Hub during training with `--save_checkpoint_to_hub=true`, and now wants to
  roll back inference to the checkpoint saved at step 10000 without hunting for
  its commit hash. How can they select it?"
options:
  - id: a
    text: "Pass the exact commit sha of that push, since step numbers are not
      tracked on the Hub"
    correct: false
    explanation: "The documentation states checkpoints are tagged by step number
      specifically so a commit sha lookup is not needed."
  - id: b
    text: "Pass `--policy.pretrained_revision=010000`, since each pushed checkpoint
      is tagged with its step number"
    correct: true
    explanation: "Correct. The documentation states each pushed checkpoint is tagged
      with its step (for example `--policy.pretrained_revision=010000`), so a
      checkpoint can be recovered by step number without looking up its commit
      sha."
  - id: c
    text: "Re-run training from scratch for exactly 10000 steps to regenerate an
      equivalent checkpoint"
    correct: false
    explanation: "The documented workflow recovers an already-pushed checkpoint by
      its step tag; retraining from scratch is not the documented rollback
      method."
  - id: d
    text: "Use `--resume=true` without any revision argument, which always loads the
      step-10000 checkpoint"
    correct: false
    explanation: "`--resume=true` without a revision continues from the latest Hub
      checkpoint, not a specific earlier step; selecting step 10000 requires
      `--policy.pretrained_revision`."
