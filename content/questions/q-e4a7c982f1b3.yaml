objective: domain-2/response-fields
stem: "In a Tavily Search response, what does each result's `score` field represent?"
options:
  - id: a
    text: "The number of credits consumed by returning this result"
    correct: false
    explanation: "Credit consumption is reported in the top-level usage.credits
      field, not in each result's score."
  - id: b
    text: "The relevance score of the search result"
    correct: true
    explanation: "Correct. The API reference describes score exactly this way."
  - id: c
    text: "The time in seconds it took to complete the request"
    correct: false
    explanation: "That describes the top-level response_time field, not a per-result
      field like score."
  - id: d
    text: "Tavily's best estimate of when the source was published"
    correct: false
    explanation: "That describes the published_date field, not score."
