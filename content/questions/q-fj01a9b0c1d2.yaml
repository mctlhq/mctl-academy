stem: >-
  What is a fine-tuning checkpoint artifact?
options:
  - id: a
    text: A snapshot of model weights saved at intermediate epoch or step intervals during training
    correct: true
    explanation: >-
      Checkpoints save intermediate model weight snapshots throughout the fine-tuning run.
  - id: b
    text: An API token used to authenticate REST requests
    correct: false
    explanation: >-
      API tokens handle client authentication, not training weight storage.
  - id: c
    text: A list of active user accounts registered in an organization project
    correct: false
    explanation: >-
      Organization user rosters belong to IAM management, not fine-tuning job metrics.
  - id: d
    text: A static vector database index
    correct: false
    explanation: >-
      Vector databases store document embeddings for RAG, not fine-tuning weight checkpoints.
