stem: "An agent wants Tavily Search to prioritize trusted sources such as
  bloomberg.com and reuters.com, without risking zero results if none of them
  cover the query. Per Tavily's Search best practices, what should it do?"
options:
  - id: a
    text: "Set `include_domains` to those domains and set
      `include_domains_mode` to \"prefer\""
    correct: true
    explanation: "Correct. The documentation states that `include_domains_mode:
      \"prefer\"` prioritizes trusted sources without risking empty results if
      none of them cover the query."
  - id: b
    text: "Set `exclude_domains` to those domains"
    correct: false
    explanation: "`exclude_domains` filters those domains out of the results
      entirely; it does not prioritize them."
  - id: c
    text: "Set `include_domains` to those domains and leave
      `include_domains_mode` at its default"
    correct: false
    explanation: "The default `include_domains_mode` is a hard filter
      (`restrict`), which is exactly the empty-result risk this scenario asks
      to avoid."
  - id: d
    text: "Set `language` to \"english\""
    correct: false
    explanation: "`language` boosts results in a specific language; it has no
      connection to prioritizing specific trusted domains."
evidence:
