stem: In the first step of a retrieval pipeline you embed a batch of retrieved
  document chunks by calling `/v1/embeddings`. What can you supply as the
  `input` value in that request?
options:
  - id: a
    text: A `relevance_score` threshold used to filter chunks before embedding
    correct: false
    explanation: relevance_score is a rerank output field, not something you pass
      into an embeddings request.
  - id: b
    text: A previously computed embedding vector, to be re-normalized
    correct: false
    explanation: The embeddings endpoint takes text (or tokens) to embed; it does
      not accept an existing vector as input.
  - id: c
    text: A string, or an array of tokens
    correct: true
    explanation: "Correct. `input` is described as \"input text to embed, encoded
      as a string or array of tokens.\""
  - id: d
    text: A JSON Schema describing the desired output shape
    correct: false
    explanation: Schema-constrained output is a chat-completions feature
      (response_format), not a field on the embeddings request.
