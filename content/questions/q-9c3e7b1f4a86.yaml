stem: "A team is viewing metrics for a Serverless AI endpoint that serves their
  robot inference pipeline, but cannot find the endpoint's underlying VM listed
  anywhere under Compute. Per the monitoring documentation, why is that?"
options:
  - id: a
    text: "The underlying VMs aren't shown in Compute, even though the Metrics tab
      of the job or endpoint reports the same metrics"
    correct: true
    explanation: "Correct. The documentation states you view metrics on the Metrics
      tab of the job or endpoint, and that the underlying VMs aren't shown in
      Compute."
  - id: b
    text: "Because usage data only becomes available 5-10 minutes after the resource
      is created"
    correct: false
    explanation: "The 5-10 minute delay is about when usage data first appears on
      the dashboard, not about why the VM itself is absent from Compute."
  - id: c
    text: "Because the dashboards refresh only every 15 seconds by default"
    correct: false
    explanation: "The refresh interval controls how often displayed data updates; it
      does not explain why the VM is missing from the Compute page."
  - id: d
    text: "Because the dashboards exist mainly to help the Nebius support team
      investigate issues, not to show resources to customers"
    correct: false
    explanation: "The dashboards are for the customer to monitor utilization and
      schedule quota increases; support-team investigation is a secondary use,
      not the reason the VM is hidden from Compute."
