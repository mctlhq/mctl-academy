stem: "Before merging several LeRobot datasets into one with
  `lerobot-edit-dataset --operation.type merge`, what must be true of the input
  datasets?"
options:
  - id: a
    text: "They must have identical features; episodes are then concatenated in the
      order given in `repo_ids`"
    correct: true
    explanation: "Correct. The dataset tools guide states the datasets must have
      identical features for a merge, with episodes concatenated in the
      specified `repo_ids` order."
  - id: b
    text: "They must already be encoded as videos via the convert-to-video operation"
    correct: false
    explanation: "Convert-to-video is a separate, optional operation; the merge
      requirement documented is identical features, not a shared storage
      encoding."
  - id: c
    text: "They must use the same RGB and depth encoder settings configured for
      re-encoding videos"
    correct: false
    explanation: "Encoder settings are a separate, optional concern for re-encoding
      existing videos, not a stated requirement for merging."
  - id: d
    text: "They must already be split into train/val/test using the same fractions"
    correct: false
    explanation: "Splitting is a separate, independent operation; the documented
      merge requirement is identical features, not matching prior splits."
