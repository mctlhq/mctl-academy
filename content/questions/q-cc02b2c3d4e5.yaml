stem: According to the Chat Completions API reference, what effect does a low
  `temperature` value such as 0.2 have on sampling?
options:
  - id: a
    text: The output becomes more random across the vocabulary
    correct: false
    explanation: The reference attributes more random output to higher values such
      as 0.8, not to low values.
  - id: b
    text: The output becomes more focused and deterministic than at higher values
    correct: true
    explanation: The reference states that lower values like 0.2 make the output
      more focused and deterministic, while higher values like 0.8 make it more
      random.
  - id: c
    text: Nucleus sampling via `top_p` is disabled automatically
    correct: false
    explanation: "`top_p` is a separate parameter; the reference only recommends
      altering one of the two, it does not say one disables the other."
  - id: d
    text: Every repeated request is guaranteed to return byte-identical text
    correct: false
    explanation: The reference describes the output as more focused and
      deterministic; it does not promise identical output across requests.
evidence:
  - source_id: src-recovery-chat
    excerpt: Higher values like 0.8 will make the output more random, while lower
      values like 0.2 will make it more focused and deterministic.
