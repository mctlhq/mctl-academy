stem: "When fine-tuning a robot policy with PEFT in LeRobot, which command-line
  parameter selects which adaptation method (such as LoRA) to use?"
options:
  - id: a
    text: "`--peft.method_type`"
    correct: true
    explanation: "Correct. The guide names this parameter as the one that lets you
      select which PEFT method to use, such as LoRA."
  - id: b
    text: "`--peft.r`"
    correct: false
    explanation: "This sets the rank of the LoRA adapter once LoRA has already been
      selected as the method; it does not choose the method itself."
  - id: c
    text: "`--peft.lora_alpha`"
    correct: false
    explanation: "This sets the LoRA scaling factor (scaling = lora_alpha / r); it
      does not choose which PEFT method runs."
  - id: d
    text: "`--peft.target_modules`"
    correct: false
    explanation: "This specifies which layers a chosen PEFT method targets; it does
      not select the method itself."
evidence:
