status: published
domain: domain-3
objective: domain-3/sa-cost-tradeoffs
stem: "A batch-inference workload checkpoints its progress to persistent network
  storage and resumes automatically after an interruption. The team wants the
  lowest-cost VM option that still fits this pattern. What should the architect
  recommend, and what does the design still need to account for?"
options:
  - id: a
    text: "Preemptible VMs, which reduce computing costs for interruption-tolerant
      workloads but don't persist local SSD data when stopped."
    correct: true
    explanation: "Correct. The documentation says preemptible VMs can help reduce
      computing costs for workloads that tolerate interruptions, and separately
      warns that local SSD disks are ephemeral and lose their data when a
      preemptible VM stops."
  - id: b
    text: "Preemptible VMs, which guarantee availability for interruption-tolerant
      workloads and are billed at a fixed discounted rate regardless of demand."
    correct: false
    explanation: "The documentation says preemptible VMs don't provide guaranteed
      availability and are charged at the current spot price, not a fixed
      discounted rate."
  - id: c
    text: "Reserved VMs, since the documentation ties checkpoint-and-resume support
      specifically to reservations rather than to preemptible pricing."
    correct: false
    explanation: "Reservations guarantee GPU availability, but the documentation
      ties preemptible VMs, not reservations, to reduced cost for
      interruption-tolerant workloads like this one."
  - id: d
    text: "Regular on-demand VMs, since the documentation allows converting an
      existing VM between preemptible and regular whenever the spot price
      changes."
    correct: false
    explanation: "The documentation says you can't convert an existing VM from
      regular to preemptible or the other way around; a new VM is required
      either way."
