objective: domain-1/storage-volumes
stem: "Which storage architecture provides high-throughput shared access across distributed GPU training workers?"
options:
  - id: a
    text: "High-performance POSIX shared filesystems or fast Object Storage endpoints"
    correct: true
    explanation: "POSIX shared filesystems and object storage support concurrent high-speed data loading for multi-node jobs."
  - id: b
    text: "Single-node un-attached local RAM disks"
    correct: false
    explanation: "RAM disks are non-persistent and unaccessible across remote worker nodes."
  - id: c
    text: "Magnetic tape backup archives"
    correct: false
    explanation: "Tape archives are ultra-slow offline storage unsuitable for active training workloads."
  - id: d
    text: "Synchronous REST API polling over public HTTP endpoints"
    correct: false
    explanation: "REST API polling introduces extreme latency and network bottlenecks."
