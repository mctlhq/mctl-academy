stem: Two teams must not see each other's datasets or endpoints. Which level of
  the resource model isolates them?
options:
  - id: a
    text: The API key, since each key is scoped to a single resource
    correct: false
    explanation: Keys are issued within a project. They express access, but the
      project is what bounds it.
  - id: b
    text: An organization group, since groups own resources directly
    correct: false
    explanation: Groups configure identity and access for people. Resources belong
      to projects, not to groups.
  - id: c
    text: A project, since resources live inside it and inherit its access settings
    correct: true
    explanation: Because resources take their access from the enclosing project,
      giving each team its own project is what produces the isolation.
  - id: d
    text: The organization, since it is the top of the hierarchy
    correct: false
    explanation: The organization is the shared container above projects, so placing
      both teams in one does not separate them.
