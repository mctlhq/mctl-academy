objective: domain-2/structured-output
stem: You need a model to return data your code can parse without a
  post-processing step. Which request parameter controls this?
options:
  - id: a
    text: "`output_schema`"
    correct: false
    explanation: No such parameter exists. A schema is supplied inside
      `response_format`, not as a sibling of it.
  - id: b
    text: "`content_type`"
    correct: false
    explanation: Content type belongs to HTTP headers and describes the transport,
      not the shape of the generated content.
  - id: c
    text: "`strict_mode`"
    correct: false
    explanation: Strictness is expressed by choosing the schema-following type, not
      by a separate boolean parameter.
  - id: d
    text: "`response_format`"
    correct: true
    explanation: This is the parameter that switches a model from prose to JSON, and
      its type field selects which of the two JSON modes applies.
evidence:
  - source_id: src-structured-output
    excerpt: Use `response_format`parameter to get JSON output.
