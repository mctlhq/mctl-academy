domain: domain-3
objective: domain-3/tool-use
stem: A model returns a tool call for a function your application defined. Who
  runs the function?
options:
  - id: a
    text: The inference platform, which proxies the call to the named service
    correct: false
    explanation: The platform emits instructions; it does not reach out to external
      services on your behalf.
  - id: b
    text: Your application, which executes it and feeds the result back
    correct: true
    explanation: Correct. The model does not execute functions; parsing the output
      and running the code is your responsibility.
  - id: c
    text: The model, once the tool schema has been registered
    correct: false
    explanation: Registering a schema tells the model how a tool is invoked, not
      that the model runs it.
  - id: d
    text: Whichever MCP server is connected to the conversation
    correct: false
    explanation: MCP servers are one thing tools can reach, but execution is still
      driven by your code.
evidence:
  - source_id: src-function-calling
    excerpt: The model **does not execute** the functions itself. Instead, it
      outputs tool invocation instructions
