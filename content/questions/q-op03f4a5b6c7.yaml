stem: Which level of the Token Factory resource hierarchy directly contains API
  keys, fine-tuning jobs, dedicated endpoints, and files and datasets?
options:
  - id: a
    text: Projects
    correct: true
    explanation: Within a project you create and manage API keys, fine-tuning jobs,
      dedicated endpoints, and files and datasets.
  - id: b
    text: The user account
    correct: false
    explanation: User accounts belong to organizations through groups; they do not
      own these resources directly.
  - id: c
    text: Regions
    correct: false
    explanation: Regions are where endpoints run; projects can even be multi-region,
      so a region is not the owning scope.
  - id: d
    text: The organization, directly
    correct: false
    explanation: The organization contains projects, groups, and user accounts;
      resources exist inside a project.
