objective: domain-1/ie-identity-federation
stem: "A workload running on a Nebius AI Cloud virtual machine needs to
  authenticate to an external platform that supports OIDC Discovery, without
  storing a long-lived credential for that platform. Which mechanism should it
  use?"
options:
  - id: a
    text: "Exchange the workload's Nebius IAM access token for a signed ID token
      through Nebius STS, then send that token to the external platform"
    correct: true
    explanation: "Correct. The guide describes exactly this exchange: a Nebius
      access token is traded for a signed ID token via Nebius STS, which the
      workload then presents to the external system."
  - id: b
    text: "Generate an authorized key for the workload's Nebius service account,
      then send that key to the external platform"
    correct: false
    explanation: "An authorized key authenticates the workload to Nebius AI Cloud
      itself; sending it to an external platform would create the long-lived
      credential this scenario is trying to avoid."
  - id: c
    text: "Set up a VPN gateway between Nebius AI Cloud and the external platform's
      network"
    correct: false
    explanation: "A VPN gateway provides network connectivity between environments;
      it does not establish an identity trust relationship with an external
      platform."
  - id: d
    text: "Configure a SAML federation on the external platform to manage the
      workload's human user credentials"
    correct: false
    explanation: "SAML federation lets an external identity provider sign users into
      Nebius AI Cloud -- the opposite direction from a Nebius workload
      authenticating to an external platform."
