stem: Leadership asks what dedicated endpoints give the business that shared
  inference does not. Which pair of use cases is documented?
options:
  - id: a
    text: Free trial capacity and unlimited request rates
    correct: false
    explanation: Neither is offered; trial credit and rate limits are separate
      topics with their own rules.
  - id: b
    text: Automatic prompt optimization and managed evaluation
    correct: false
    explanation: No such capabilities are attributed to dedicated endpoints.
  - id: c
    text: Zero-cost idling and permanent GPU reservation
    correct: false
    explanation: Capacity is released when an endpoint stops, and billing follows
      running replicas.
  - id: d
    text: Predictable capacity and serving a finetuned base model with custom weights
    correct: true
    explanation: Correct. Those are the documented key use cases for dedicated endpoints.
