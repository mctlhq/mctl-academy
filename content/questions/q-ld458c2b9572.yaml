objective: domain-3/structured-output
stem: A downstream service needs the model's answer in a fixed shape it can
  parse. What does the platform provide by default, and what must change?
options:
  - id: a
    text: Output is JSON by default; a parameter switches it to prose
    correct: false
    explanation: The default is natural language, not JSON.
  - id: b
    text: Output is natural language by default; `response_format` forces JSON
    correct: true
    explanation: Correct. Text is the default, and the parameter is what makes the
      response machine-readable.
  - id: c
    text: Output shape is set per model and cannot be changed per request
    correct: false
    explanation: The shape is chosen per request through the parameter.
  - id: d
    text: Output must be reshaped by a second model after generation
    correct: false
    explanation: A second pass is unnecessary when the format can be requested directly.
