stem: "Per Tavily's Map tutorial, what distinguishes Map's output from Crawl's
  output?"
options:
  - id: a
    text: "Map returns a list of URLs discovered from a starting URL, and unlike
      Crawl does not extract page content"
    correct: true
    explanation: "Correct. The tutorial states Map returns a URL list and, unlike
      Crawl, does not extract page content."
  - id: b
    text: "Map returns full page content for every URL; Crawl returns only a URL
      list"
    correct: false
    explanation: "That reverses the actual distinction: Crawl extracts full content,
      Map does not."
  - id: c
    text: "Map and Crawl return identical output, differing only in the request's
      HTTP method"
    correct: false
    explanation: "The tutorial explicitly contrasts Map's URL-only output with
      Crawl's full-content output; they are not identical."
  - id: d
    text: "Map returns a ranked relevance score for each discovered URL"
    correct: false
    explanation: "Map's results are plain URL strings; a relevance score is a Search
      response field, not a Map one."
