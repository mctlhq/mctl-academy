stem: "After an Axolotl LoRA fine-tuning job on Nebius Serverless AI completes,
  where are the resulting adapter weights found?"
options:
  - id: a
    text: "In the `output` directory of the `fine-tuning-axolotl` Object Storage
      bucket mounted to the job"
    correct: true
    explanation: "Correct. The tutorial stores the LoRA adapter weights as files in
      the output directory of that bucket."
  - id: b
    text: "On the job's container disk, which persists after the job completes"
    correct: false
    explanation: "Serverless AI deletes the job (and its container VM) after
      completion, so results are not left on the job's own disk; they must be in
      the mounted bucket."
  - id: c
    text: "Pushed automatically to a Hugging Face Hub model repository"
    correct: false
    explanation: "That is how LeRobot training checkpoints can be shared; this
      Axolotl job writes its results to the mounted Object Storage bucket
      instead."
  - id: d
    text: "In the Nebius Container Registry, alongside the job's container image"
    correct: false
    explanation: "Container Registry stores container images, not job output; the
      fine-tuning results go to the mounted Object Storage bucket."
evidence:
  - source_id: src-pa-serverless-fine-tuning
    excerpt: "They are stored as files in the `output` directory, in the
      `fine-tuning-axolotl` bucket."
