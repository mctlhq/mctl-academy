id: q-sa4tenantsg7
status: published
domain: domain-4
objective: domain-4/sa-tenant-isolation-least-privilege
stem: "An architecture team manages VMs in two separate networks, one per tenant
  project, and wants a single reusable security group whose rules apply to VMs
  in both networks. Is this design workable as documented?"
options:
  - id: a
    text: "No -- a security group applies only to VMs within the one network it's
      associated with."
    correct: true
    explanation: "Correct. The documentation says each security group is associated
      with a network and can only apply to VMs in that network."
  - id: b
    text: "Yes -- security groups are documented as tenant-wide resources, so one
      group's rules apply to VMs in every network in the tenant."
    correct: false
    explanation: "The documentation associates a security group with one network,
      specified in its network_id parameter, not with the tenant as a whole."
  - id: c
    text: "No -- but referencing the group's ID as a destination_security_group_id
      inside a security rule is documented as a way to extend it across
      networks."
    correct: false
    explanation: "The documentation requires the security group referenced in a rule
      and the group containing the rule to be associated with the same network,
      so this cross-network reference would not work."
  - id: d
    text: "Yes -- as long as every security rule in the group is configured with the
      stateful type, which is documented as extending its reach across
      networks."
    correct: false
    explanation: "Stateful versus stateless only changes whether response traffic is
      automatically tracked within a connection; the documentation does not
      describe either type as extending a security group's rules to another
      network."
