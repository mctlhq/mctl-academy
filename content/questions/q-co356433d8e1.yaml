objective: domain-2/iam-roles
stem: An on-call rotation must be able to stop and start VMs during incidents,
  but should not gain broader Compute permissions. Which role fits?
options:
  - id: a
    text: '`editor`, scoped to the project containing the VMs'
    correct: false
    explanation: The editor role grants management of most resource types, which is
      broader than the task requires.
  - id: b
    text: '`compute.instance-power-operator`'
    correct: true
    explanation: Correct. It exists precisely to allow power operations on VMs
      without broader Compute permissions.
  - id: c
    text: '`compute.serial-console-user`'
    correct: false
    explanation: That role covers interactive troubleshooting over the serial
      console, not powering machines on and off.
  - id: d
    text: '`viewer`, which permits state changes on resources it can see'
    correct: false
    explanation: The viewer role is for viewing resources and accessing data in
      them, not for changing their power state.
