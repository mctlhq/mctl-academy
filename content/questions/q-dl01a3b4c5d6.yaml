stem: What is the primary function of a Data Lab tool in a dataset curation workflow?
options:
  - id: a
    text: Importing, filtering, cleaning, and formatting raw text datasets prior to
      model fine-tuning
    correct: true
    explanation: Data Lab tools automate dataset ingestion, filtering out
      low-quality rows and normalizing target formats.
  - id: b
    text: Managing DNS SSL TLS certificates for custom web domains
    correct: false
    explanation: Certificates handle domain HTTPS encryption, not training data processing.
  - id: c
    text: Provisioning Kubernetes worker nodes
    correct: false
    explanation: Kubernetes cluster node provisioning is cloud infrastructure
      management, not dataset curation.
  - id: d
    text: Executing SQL queries against relational production databases
    correct: false
    explanation: Production SQL databases serve application state, whereas Data Lab
      processes training datasets.
