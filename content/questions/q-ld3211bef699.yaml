stem: Which set of endpoint configuration factors does the inference overview
  identify as determining performance?
options:
  - id: a
    text: Only the number of parameters in the chosen model
    correct: false
    explanation: Model size matters, but the endpoint's configuration is what this
      list describes.
  - id: b
    text: Only the region the caller sends requests from
    correct: false
    explanation: Region affects latency for a dedicated deployment but is not this
      set of factors.
  - id: c
    text: The length of the system prompt supplied by the application
    correct: false
    explanation: Prompt length affects individual requests, not how the endpoint
      itself is configured.
  - id: d
    text: Batch size, GPU type, GPU count, and inference-time optimizations
    correct: true
    explanation: Correct. Performance follows from how the endpoint balances these four.
