stem: "A training workload runs as a Serverless AI job with the restart policy set to on-failure. The underlying preemptible VM is reclaimed mid-run, and the job moves to the ERROR status without restarting automatically. What should the team have done so this failure is recoverable?"
options:
  - id: a
    text: "Design the workload to write and resume from checkpoints, then resubmit the job after a preemption instead of relying on the restart policy"
    correct: true
    explanation: "Correct. The documentation recommends designing a workload to be resumable, for example by writing and resuming from checkpoints, and resubmitting the job for resilience against preemption or lost capacity."
  - id: b
    text: "Increase the number of restart attempts configured on the job, since a higher restart-attempts value also covers preemption and lost capacity"
    correct: false
    explanation: "The restart policy responds only to the container's own exit code; the documentation lists preemption and no available capacity at start as cases it doesn't recover from, regardless of the configured number of attempts."
  - id: c
    text: "Turn off automatic restarts entirely so the job runs once without retrying, since that removes any effect the restart policy could have during a preemption"
    correct: false
    explanation: "The restart policy's value doesn't change what preemption does to the underlying VM; the documentation describes preemption as a case that neither restart policy value recovers from automatically."
  - id: d
    text: "Run the workload on a Serverless AI endpoint instead of a job, since endpoints support automatic restarts that jobs don't"
    correct: false
    explanation: "The documentation says the opposite: automatic restarts aren't available for Serverless AI endpoints, so moving the workload to an endpoint would remove the restart capability jobs already have."
