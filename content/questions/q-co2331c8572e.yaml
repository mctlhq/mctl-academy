stem: You are creating a GPU cluster and must pick an InfiniBand fabric. Why
  does the choice constrain the cluster later?
options:
  - id: a
    text: The fabric fixes how many nodes the cluster may ever contain
    correct: false
    explanation: Fabric capacity is finite, but the documented consequence of the
      choice is which GPU platform can be added, not a fixed node count.
  - id: b
    text: The fabric determines which project the cluster's resources belong to
    correct: false
    explanation: Project membership is an IAM concern and is unrelated to the
      physical fabric a cluster sits in.
  - id: c
    text: The fabric sets the partition key that other tenants use to reach the
      cluster
    correct: false
    explanation: A partition key isolates a cluster rather than granting anyone
      access, and it is assigned per cluster.
  - id: d
    text: The fabric limits which GPU platform can be added to that cluster
    correct: true
    explanation: Correct. Each fabric serves particular GPU platforms, so the fabric
      must be chosen against the GPU type you intend to run.
