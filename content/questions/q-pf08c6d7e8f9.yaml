stem: Which base URL does the Quickstart use to configure an OpenAI SDK client
  for Token Factory inference?
options:
  - id: a
    text: "`https://api.tokenfactory.nebius.com/v1/`"
    correct: true
    explanation: The Quickstart constructs the OpenAI client with
      `base_url="https://api.tokenfactory.nebius.com/v1/"`.
  - id: b
    text: "`ftp://legacy.nebius.internal/storage`"
    correct: false
    explanation: FTP is not used for the inference API.
  - id: c
    text: "`ws://localhost:3000/raw-socket`"
    correct: false
    explanation: A local WebSocket is not the documented API base URL.
  - id: d
    text: "`https://docs.nebius.com/static/js`"
    correct: false
    explanation: That is a documentation asset path, not an inference endpoint.
