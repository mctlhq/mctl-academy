stem: "Which architectural strategy prevents runaway API token bills caused by unexpected infinite loops in agentic applications?"
options:
  - id: a
    text: "Enforcing hard upper bounds on maximum iteration depth, total token budgets, and execution timeout limits"
    correct: true
    explanation: "Setting max iteration counts and token budgets prevents recursive agent loops from consuming infinite API tokens."
  - id: b
    text: "Removing execution timeout limits on background worker tasks"
    correct: false
    explanation: "Removing timeouts allows runaway loops to execute indefinitely."
  - id: c
    text: "Disabling token usage alert notifications in administrative dashboards"
    correct: false
    explanation: "Disabling alerts prevents operators from detecting spending anomalies."
  - id: d
    text: "Setting temperature parameters to 2.0 on all API calls"
    correct: false
    explanation: "High temperature increases randomness, but does not prevent infinite loop execution."
