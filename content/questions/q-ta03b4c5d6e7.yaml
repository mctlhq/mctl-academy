objective: domain-4/team-access
stem: How is access to the resources inside one specific project controlled
  without granting access across the whole organization?
options:
  - id: a
    text: Through the organization's Organization Groups, which are the only access
      mechanism
    correct: false
    explanation: Organization Groups grant access to organizational resources;
      project-level access is controlled by the project's own groups.
  - id: b
    text: Through the Project Groups that each project includes
    correct: true
    explanation: Each project includes Project Groups that control access to project
      resources, separate from the Organization Groups at the organization
      level.
  - id: c
    text: By sharing the project's API key with the user
    correct: false
    explanation: Access is granted through group membership; API keys are resources
      inside the project, not an access-control mechanism.
  - id: d
    text: By making the project multi-region
    correct: false
    explanation: Multi-region grouping is about organising resources, not about who
      can access them.
evidence:
