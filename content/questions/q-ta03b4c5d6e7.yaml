objective: domain-4/team-access
stem: Which IAM permission role scope allows creating new API keys within a
  specific project without granting organization-level administrative access?
options:
  - id: a
    text: Organization Owner
    correct: false
    explanation: Organization Owner has full admin privileges across all org
      settings, not project-scoped access.
  - id: b
    text: Project Developer or Project Admin
    correct: true
    explanation: Project-level roles allow managing resources and API keys inside
      that specific project only.
  - id: c
    text: Global Billing Auditor
    correct: false
    explanation: Billing Auditor grants read-only access to invoices and financial
      usage reports.
  - id: d
    text: Anonymous Guest User
    correct: false
    explanation: Unauthenticated guests cannot access projects or issue API credentials.
evidence:
  - source_id: src-org-projects
    excerpt: exist inside a project and inherit its access settings.
