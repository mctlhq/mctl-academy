objective: domain-4/ie-gpu-rollouts
stem: "A platform team runs a multi-node training workload in a GPU cluster on
  an older GPU platform and is planning to move it to a newer GPU platform while
  keeping the workload in a GPU cluster. When choosing the preset for the new
  platform's VMs, what must they confirm?"
options:
  - id: a
    text: "That the chosen preset is one of the ones compatible with GPU clusters
      for that platform, since other presets are not compatible with GPU
      clusters"
    correct: true
    explanation: "Correct. The guide states that if you are adding a VM to a GPU
      cluster, you select from the platforms and presets compatible with GPU
      clusters, and that other presets and platforms are not compatible with GPU
      clusters."
  - id: b
    text: "That the chosen preset matches the exact preset name used on the old
      platform's GPU cluster configuration, since preset names carry over
      unchanged across every GPU platform"
    correct: false
    explanation: "Preset names describe the resources of a specific platform, such
      as its GPU count; the guide does not describe preset names as shared or
      interchangeable across different GPU platforms."
  - id: c
    text: "That the VMs are created without a boot disk image, since GPU cluster VMs
      install their GPU drivers through the GPU cluster instead of the boot
      disk"
    correct: false
    explanation: "GPU cluster VMs still need a boot disk image compatible with the
      platform; the guide ties GPU driver installation to the boot disk image,
      not to GPU cluster membership."
  - id: d
    text: "That the new platform's region also hosts the team's existing non-GPU
      node groups, since a GPU cluster must share a region with every other node
      group in the project"
    correct: false
    explanation: "The guide does not tie a GPU cluster's region to where a project's
      other, unrelated node groups are hosted; it requires VMs in the same GPU
      cluster to share a project, not a region with everything else."
