stem: When configuring OpenAI-compatible client SDKs to connect to an external
  inference endpoint, what two parameters must be updated?
options:
  - id: a
    text: model_type and system_prompt
    correct: false
    explanation: Prompt and model selections belong to request calls, not base
      client URL routing.
  - id: b
    text: storage_bucket and db_url
    correct: false
    explanation: Storage and database configuration belong to database credentials,
      not API endpoint setup.
  - id: c
    text: base_url and api_key
    correct: true
    explanation: Overriding base_url points client SDKs to the custom endpoint, and
      api_key authenticates requests.
  - id: d
    text: tcp_port and dns_server
    correct: false
    explanation: Network sockets are handled by standard HTTP client transports, not
      SDK client constructor parameters.
evidence:
  - source_id: src-inference-overview
    excerpt: Both deliver identical model outputs. Differences lie in token pricing,
      latency, and the level of applied optimizations.
