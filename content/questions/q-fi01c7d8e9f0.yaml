stem: In the Quickstart, which two constructor parameters are set on the OpenAI
  SDK client to point it at Token Factory?
options:
  - id: a
    text: "`model_type` and `system_prompt`"
    correct: false
    explanation: Model and prompt belong to individual requests; they do not
      configure the client.
  - id: b
    text: "`storage_bucket` and `db_url`"
    correct: false
    explanation: The SDK client has no storage or database settings; these are
      unrelated to inference.
  - id: c
    text: "`base_url` and `api_key`"
    correct: true
    explanation: The Quickstart constructs the client with `base_url` set to the
      Token Factory API and `api_key` read from `NEBIUS_API_KEY`.
  - id: d
    text: "`tcp_port` and `dns_server`"
    correct: false
    explanation: Networking is handled by the HTTP transport; the client is
      configured with a URL and a key.
