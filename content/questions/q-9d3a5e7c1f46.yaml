stem: "A team submits LeRobot training as a Hugging Face Job. The job fails
  before the trained model is pushed to its model repo. What happens to that
  model repo?"
options:
  - id: a
    text: "It is automatically deleted as soon as the job fails, to avoid
      clutter"
    correct: false
    explanation: "The documentation explicitly says a failed run's model repo
      is not deleted automatically; it is left on the Hub for inspection."
  - id: b
    text: "It is automatically retried with the same repo until the push
      succeeds"
    correct: false
    explanation: "No automatic retry of a failed job against the same repo is
      documented; the repo is simply left behind, uninspected unless the team
      checks it."
  - id: c
    text: "It is left on the Hub so the team can inspect it — it is not
      deleted automatically, so repeated failures can leave empty repos
      behind"
    correct: true
    explanation: "Correct. The documentation states the model repo is created
      up front, and if a run fails before the model is pushed, that repo is
      left on the Hub for inspection rather than deleted automatically."
  - id: d
    text: "It becomes a private draft that only becomes visible once the push
      succeeds"
    correct: false
    explanation: "The repo's visibility is governed by the `--policy.private`
      setting, not by whether the push succeeded; a failed run's repo is
      documented as being left on the Hub as-is."
