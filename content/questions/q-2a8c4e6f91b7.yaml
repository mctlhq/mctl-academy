stem: "A team wants to run a quick evaluation of a deployed robot policy with
  `lerobot-rollout`, just observing its behavior on the real robot without
  recording any data. Which `--strategy.type` is designed for this?"
options:
  - id: a
    text: "`sentry`"
    correct: false
    explanation: "`sentry` is continuous autonomous recording with periodic upload
      to the Hub, not a no-recording quick-evaluation mode."
  - id: b
    text: "`episodic`"
    correct: false
    explanation: "`episodic` mirrors lerobot-record's fixed episode/reset structure
      and records each episode, rather than running with no data recording."
  - id: c
    text: "`base`"
    correct: true
    explanation: "Correct. The `base` strategy is autonomous policy execution with
      no data recording, described for quick evaluation, demos, or observing the
      robot."
  - id: d
    text: "`dagger`"
    correct: false
    explanation: "`dagger` is human-in-the-loop data collection that alternates
      policy execution with teleoperator correction, not an observation-only
      strategy."
evidence:
