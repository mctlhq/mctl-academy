stem: "A platform team is rolling out a newer GPU platform for a Managed
  Service for Kubernetes training workload. They create a new node group with
  the new platform, then cordon and drain the nodes in the old node group.
  What happens to the Pods that were running on the old node group?"
options:
  - id: a
    text: "Kubernetes automatically moves the evicted Pods to suitable nodes,
      which is how the workload moves to the new node group"
    correct: true
    explanation: "Correct. The guide states that the workload is moved
      automatically after you evict it from the existing node group, and that
      Kubernetes automatically moves evicted Pods to suitable nodes."
  - id: b
    text: "The evicted Pods stay unscheduled until the team manually
      reschedules each one onto a node in the new node group"
    correct: false
    explanation: "The guide describes the move as automatic once nodes are
      drained; manually rescheduling each evicted Pod is not a step the
      procedure calls for."
  - id: c
    text: "The evicted Pods are moved after the team deletes the old node
      group, rather than right after the drain"
    correct: false
    explanation: "The guide moves Pods automatically right after the drain
      step; deleting the old node group is a separate, later step in the
      procedure, not a precondition for the move."
  - id: d
    text: "The evicted Pods restart on the same old nodes once draining
      finishes, since draining does not remove running Pods permanently"
    correct: false
    explanation: "Draining evicts Pods from the old nodes rather than letting
      them restart there; the guide describes those evicted Pods moving to
      suitable nodes elsewhere, not restarting in place."
