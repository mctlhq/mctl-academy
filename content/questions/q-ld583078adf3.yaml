objective: domain-4/cost-and-billing
stem: An endpoint has been scaled to zero replicas. What is the billing and
  availability position?
options:
  - id: a
    text: It remains billable so its capacity stays reserved
    correct: false
    explanation: Capacity is not retained once released, and charges do not apply.
  - id: b
    text: It is not accessible and no charges apply
    correct: true
    explanation: Correct. With zero replicas running, the endpoint serves nothing
      and is not billed.
  - id: c
    text: It is still accessible, served from a shared pool at a reduced rate
    correct: false
    explanation: There is no reduced-rate shared serving mode for a scaled-to-zero endpoint.
  - id: d
    text: It is billed at the minimum replica rate regardless
    correct: false
    explanation: Minimum replicas are allocated only while the endpoint is active.
evidence:
  - source_id: src-ld-dedicated-billing-policy
    excerpt: When **zero replicas are running**, the endpoint is not accessible and
      billing charges do not apply.
