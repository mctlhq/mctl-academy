objective: domain-3/resource-quotas
stem: A Managed Kubernetes node group fails to grow because of a quota limit,
  though no standalone VMs were created. Why is a Compute quota involved?
options:
  - id: a
    text: Node groups consume a separate Kubernetes quota that mirrors Compute limits
    correct: false
    explanation: There is no mirrored quota; the nodes count against the Compute
      quotas themselves.
  - id: b
    text: Managed Kubernetes nodes are based on Compute VMs and count against the
      same quotas
    correct: true
    explanation: Correct. The quotas cover Compute VMs and equally the Kubernetes
      and Soperator nodes built on them.
  - id: c
    text: The cluster's control plane counts as a virtual machine in the quota
    correct: false
    explanation: The nodes are what consume the quota here, not the managed control plane.
  - id: d
    text: Compute quota is only consulted when a node group uses a GPU cluster
    correct: false
    explanation: The accounting does not depend on whether the node group is
      attached to a GPU cluster.
