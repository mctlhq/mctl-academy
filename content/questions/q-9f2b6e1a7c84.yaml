stem: "A fine-tuning job request also accepts a dataset the model is evaluated against but never trained on. Which field carries that dataset's file ID?"
options:
  - id: a
    text: "`validation_file`, which takes the ID of a held-out dataset file"
    correct: true
    explanation: "The job's `validation_file` field is optional and takes the ID of a file with the validation dataset, in the same format as the training file."
  - id: b
    text: "`suffix`, which appends a human-readable label to the model name"
    correct: false
    explanation: "`suffix` appends a label to the resulting model name; it carries no file reference."
  - id: c
    text: "`seed`, which sets the random seed used during training"
    correct: false
    explanation: "`seed` sets the random seed used during training; it is unrelated to dataset files."
  - id: d
    text: "`hyperparameters`, which nests training settings like batch size"
    correct: false
    explanation: "`hyperparameters` nests training settings such as batch size and learning rate; it is not a file reference."
