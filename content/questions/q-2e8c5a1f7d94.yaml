objective: domain-4/key-rotation-secrets
stem: "Per Tavily's API Key Management guidance, how often should a team rotate
  its API keys as a general security best practice, separate from reacting to a
  suspected leak?"
options:
  - id: a
    text: "Periodically, on the order of every 90 days"
    correct: true
    explanation: "Correct. The guidance recommends rotating API keys periodically,
      e.g., every 90 days, to minimize the impact if a key is ever compromised
      without your knowledge."
  - id: b
    text: "Every 7 days on a fixed schedule"
    correct: false
    explanation: "The guidance's recommended cadence is on the order of every 90
      days, not a fixed 7-day schedule."
  - id: c
    text: "Only when a leak is suspected or confirmed, otherwise never"
    correct: false
    explanation: "The guidance separates periodic rotation as a general best
      practice from the leak-response steps; it does not say rotation should
      wait for a suspected leak."
  - id: d
    text: "Once, immediately after the key is first created, and never again
      afterward"
    correct: false
    explanation: "The guidance recommends rotating periodically throughout the key's
      life, not a single rotation right after creation."
evidence:
