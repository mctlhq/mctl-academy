stem: "A platform team wants to orchestrate a vLLM inference server on a Managed
  Service for Kubernetes cluster by using Managed Service for SkyPilot, and
  needs to know what Nebius AI Cloud bills for in this setup. What should they
  expect?"
options:
  - id: a
    text: "Charges only for the Managed Kubernetes nodes that run the vLLM workload,
      since Managed Service for SkyPilot itself is free of charge"
    correct: true
    explanation: "Correct. The tutorial states that Nebius AI Cloud only charges for
      running Managed Kubernetes nodes, and that Managed Service for SkyPilot is
      free of charge."
  - id: b
    text: "Charges for both the Managed Kubernetes nodes and a separate fee for the
      Managed SkyPilot server's API endpoint"
    correct: false
    explanation: "The tutorial describes Managed Service for SkyPilot as free of
      charge; there is no separate fee for its API endpoint."
  - id: c
    text: "Charges based on the number of SkyPilot environments launched, regardless
      of which cluster runs them"
    correct: false
    explanation: "Billing is tied to the Managed Kubernetes nodes running the
      workload, not to the count of SkyPilot environments launched."
  - id: d
    text: "Charges only while the vLLM server is actively answering chat requests,
      with no charge for idle GPU time on the node"
    correct: false
    explanation: "Managed Kubernetes node charges apply to the running nodes
      themselves, not only to the time the vLLM server is actively serving
      requests."
