stem: "Among Sandboxes' core identifiers, what distinguishes a Tag from an Image
  UUID?"
options:
  - id: a
    text: "A Tag is a mutable name that points to an image, while an Image UUID
      identifies an immutable stored filesystem state"
    correct: true
    explanation: "Correct. The overview's identifier table defines Image UUID as
      an immutable stored filesystem state and Tag as a mutable name that points
      to an image."
  - id: b
    text: "A Tag identifies one asynchronous service operation, while an Image UUID
      identifies a process inside that operation"
    correct: false
    explanation: "Those definitions belong to Operation ID and Subprocess ID
      respectively, not to Tag or Image UUID."
  - id: c
    text: "A Tag and an Image UUID both identify the same immutable filesystem
      state and can be used interchangeably"
    correct: false
    explanation: "The overview explicitly says these identifiers are not
      interchangeable, and only the Image UUID is immutable."
  - id: d
    text: "A Tag identifies uploaded content that can be attached to an operation"
    correct: false
    explanation: "That describes an Upload ID; a Tag is a mutable name pointing to
      an image, not uploaded content."
