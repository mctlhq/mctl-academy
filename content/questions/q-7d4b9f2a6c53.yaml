objective: domain-3/deployment-evaluation
stem: "Before a deployment decision, a team runs two candidate policies through
  the same LIBERO evaluation episodes to compare them head to head. What does
  the documentation recommend to keep that comparison fair?"
options:
  - id: a
    text: "Use a different `--seed` for each policy so the two runs are
      statistically independent"
    correct: false
    explanation: "The documentation recommends the same seed for both policies so
      they face identical episodes, not independent seeds."
  - id: b
    text: "Use the same `--seed`, keep `--env.init_states=true`, and run each task
      in a single batch"
    correct: true
    explanation: "Correct. To compare two policies on the same episodes, the
      documentation recommends the same seed, keeping init_states=true, and
      running each task in a single batch."
  - id: c
    text: "Disable `--env.init_states` so each policy encounters freshly randomized
      resets"
    correct: false
    explanation: "The recommendation is to keep init_states=true, which fixes the
      initial states both policies see, not to disable it."
  - id: d
    text: "Use soft resets instead of hard resets, since soft resets are faster for
      comparison runs"
    correct: false
    explanation: "The documentation says to use hard resets when reproducing
      benchmark results, because soft resets are not bit-identical to hard
      resets."
