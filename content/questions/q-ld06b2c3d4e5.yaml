stem: "Which architectural pattern ensures seamless recovery when an AI model endpoint encounters transient downtime?"
options:
  - id: a
    text: "Retrying failing requests infinite times in tight un-throttled loops"
    correct: false
    explanation: "Infinite retry loops exacerbate API rate limits and cause system lockup."
  - id: b
    text: "Deleting input user messages whenever an endpoint returns 5xx errors"
    correct: false
    explanation: "Deleting user input loses data without resolving endpoint failure."
  - id: c
    text: "Designing automated fallback handlers with circuit breakers and human-in-the-loop escalation"
    correct: true
    explanation: "Circuit breakers and fallback handlers prevent application crashes during model downtime."
  - id: d
    text: "Crashing the host web application immediately on first API timeout"
    correct: false
    explanation: "Crashing the host app creates poor user experience and service outages."
