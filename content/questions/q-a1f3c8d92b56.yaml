stem: "An agent's base model stops learning about the world at its training
  cutoff. Per Tavily's documentation, which capability does Tavily describe
  itself as adding to such an agent?"
options:
  - id: a
    text: "Real-time search, page extraction, site crawling and mapping, and
      cited research, returned as clean, LLM-ready content"
    correct: true
    explanation: "Correct. Tavily describes itself as the web layer for AI
      agents, providing exactly this live data."
  - id: b
    text: "Keyless access, which lets an agent call Search and Extract with no
      API key"
    correct: false
    explanation: "That describes the no-key access path, not what closes the
      knowledge-cutoff gap."
  - id: c
    text: "Session tracking via an X-Session-Id header that groups related API
      calls"
    correct: false
    explanation: "Session tracking is for attribution and analytics across calls,
      not for supplying live information."
  - id: d
    text: "A documentation MCP server that lets an agent search Tavily's own
      docs"
    correct: false
    explanation: "That server searches Tavily's documentation pages, not the
      live web the agent is missing."
