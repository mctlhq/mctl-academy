stem: "When an automatic node health recovery script cordons a degraded instance, what happens to running stateful pod workloads?"
options:
  - id: a
    text: "Workloads are safely drained and rescheduled onto healthy available nodes using recent storage checkpoints"
    correct: true
    explanation: "Draining worker pods allows stateful jobs to resume execution from storage checkpoints on healthy nodes."
  - id: b
    text: "Workloads remain stuck on the broken node until manual hard reboot"
    correct: false
    explanation: "Cordoning and draining actively migrates workloads off degraded hardware."
  - id: c
    text: "All shared storage volumes attached to the cluster are un-mounted globally"
    correct: false
    explanation: "Unmounting storage globally breaks healthy running cluster jobs."
  - id: d
    text: "Pod containers are permanently deleted without saving checkpoint progress"
    correct: false
    explanation: "Proper recovery mechanics preserve checkpoint state before terminating pods."
