objective: domain-1/network-vpc
stem: A team wants two test environments in the same region that use identical
  private IP addressing and must not be able to reach each other. What
  arrangement achieves this?
options:
  - id: a
    text: Put both in one network and rely on distinct subnet CIDR ranges
    correct: false
    explanation: One network gives direct private connectivity between resources,
      and duplicate addressing is not possible within it.
  - id: b
    text: Put both in one network and deny all traffic with security rules
    correct: false
    explanation: Rules could block traffic, but they cannot let the same private IP
      address be assigned to resources in both environments.
  - id: c
    text: Create a separate network for each environment
    correct: true
    explanation: Correct. Separate networks are the documented answer both for
      disabling connectivity and for reusing the same private addresses.
  - id: d
    text: Create one network per region and place the environments in different
      regions
    correct: false
    explanation: This places the environments in different regions, violating the
      requirement that both environments run in the same region.
