stem: A dedicated endpoint is serving traffic, but some replicas are still
  starting and capacity is below what was expected. Which readiness status does
  the documentation assign to this state?
options:
  - id: a
    text: Not ready
    correct: false
    explanation: Not ready means the endpoint cannot reliably serve requests; here
      it is serving, just below capacity.
  - id: b
    text: Ready
    correct: false
    explanation: Ready means fully provisioned and ready for expected traffic, which
      is not the case while replicas are still starting.
  - id: c
    text: Warning
    correct: false
    explanation: Warning is a lifecycle status describing a deployment issue, not a
      readiness status.
  - id: d
    text: Partially ready
    correct: true
    explanation: Partially ready is defined as serving traffic below expected
      capacity while some replicas are still starting, updating, or unavailable.
