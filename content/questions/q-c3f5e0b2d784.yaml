stem: "An agent is filtering Tavily Search results to drop low-relevance sources
  before using them. Per Tavily's documentation, which response field should it
  filter on?"
options:
  - id: a
    text: "`score`, discarding results below a threshold such as 0.5"
    correct: true
    explanation: "Correct. The documentation recommends using score to filter
      low-relevance results, e.g., discarding results below 0.5."
  - id: b
    text: "`published_date`, requiring it to be above a date threshold"
    correct: false
    explanation: "published_date supports recency filtering, not the relevance-based
      filtering this scenario calls for."
  - id: c
    text: "`favicon`, preferring sources with a recognizable icon"
    correct: false
    explanation: "favicon is just the site icon URL; it carries no relevance signal."
  - id: d
    text: "`raw_content`, preferring whichever result has the longest extracted text"
    correct: false
    explanation: "raw_content is the extracted page text; length is not a documented
      relevance measure."
