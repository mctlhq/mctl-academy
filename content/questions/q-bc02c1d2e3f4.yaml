stem: >-
  What cost control safeguard prevents unexpected usage charges on an organization account?
options:
  - id: a
    text: Disabling SSL certificate validation on requests
    correct: false
    explanation: >-
      Disabling SSL compromises transport security and has no impact on billing thresholds.
  - id: b
    text: Setting temperature to 1.0 on all completion calls
    correct: false
    explanation: >-
      Temperature controls output entropy, not monetary spend caps.
  - id: c
    text: Configuring spending budget alerts and hard credit caps on the organization account
    correct: true
    explanation: >-
      Budget thresholds and hard spending caps prevent unexpected cost overruns.
  - id: d
    text: Changing API request content-type to application/xml
    correct: false
    explanation: >-
      MIME headers specify payload format, not billing caps.
