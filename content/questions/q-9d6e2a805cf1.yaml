stem: "A team just created a new Serverless AI endpoint and wants to check
  its GPU utilization to plan capacity. How soon after creation does usage
  data appear on the Metrics dashboard?"
options:
  - id: a
    text: "5-10 minutes after the resource is created"
    correct: true
    explanation: "Correct. The monitoring documentation states usage data
      becomes available 5-10 minutes after a resource is created."
  - id: b
    text: "Immediately, with no delay"
    correct: false
    explanation: "The documentation states a 5-10 minute delay before
      usage data becomes available, not immediate availability."
  - id: c
    text: "Every 15 seconds, matching the dashboard's refresh interval"
    correct: false
    explanation: "The 15-second figure is how often already-available
      data refreshes, not how long it takes for data to first become
      available."
  - id: d
    text: "Only after the next scheduled quota increase review"
    correct: false
    explanation: "Quota increases are a separate, unrelated process; they
      do not gate when usage data appears on the dashboard."
evidence:
