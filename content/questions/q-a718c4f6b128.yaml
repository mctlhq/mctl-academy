objective: domain-2/search-extract-pipelines
stem: "An agent wants to curate and filter candidate URLs before extracting
  their content, rather than extracting from every Search result automatically.
  Per Tavily's best practices, which approach fits?"
options:
  - id: a
    text: "The direct Extract API, since it lets you choose exactly which URLs to
      extract from"
    correct: true
    explanation: "Correct. The documentation states the key difference is control:
      Extract lets you choose exactly which URLs to extract from."
  - id: b
    text: "Search with `include_raw_content=true`, since it extracts from all search
      results automatically"
    correct: false
    explanation: "That approach extracts from every result automatically, which is
      the opposite of curating URLs first."
  - id: c
    text: "The Map API, since it extracts full page content from discovered URLs"
    correct: false
    explanation: "Map only discovers URLs; it does not extract page content at all."
  - id: d
    text: "The Crawl API, since it is the fastest way to curate individual URLs"
    correct: false
    explanation: "Crawl follows links automatically from a starting URL; it does not
      let you hand-pick individual URLs to extract."
evidence:
  - source_id: src-tv-bp-extract
    excerpt: "The main distinction is control, with Extract you choose exactly which
      URLs to extract from, while Search with `include_raw_content` extracts
      from all search results."
