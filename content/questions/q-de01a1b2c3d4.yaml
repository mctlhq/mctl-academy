stem: According to the comparison table, how does capacity differ between
  dedicated endpoints and public serverless endpoints?
options:
  - id: a
    text: Dedicated endpoints get capacity reserved for your organization while
      serverless uses shared multi-tenant capacity
    correct: true
    explanation: The table lists capacity reserved for your organization against
      shared multi-tenant capacity; the capacity page adds that the reservation
      applies only while the endpoint is running.
  - id: b
    text: Dedicated capacity is a permanent reservation that survives stops and
      maintenance
    correct: false
    explanation: "The capacity page states the opposite: it is not a long-term
      reservation, and stopped endpoints release their GPUs to the shared pool."
  - id: c
    text: Both draw from the same shared pool with identical guarantees
    correct: false
    explanation: Dedicated endpoints are isolated from the multi-tenant pool that
      serves public serverless traffic.
  - id: d
    text: Public serverless endpoints reserve GPUs per organization
    correct: false
    explanation: Serverless capacity is shared and multi-tenant; reservation is the
      dedicated model.
