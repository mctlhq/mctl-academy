stem: Per the Token Factory Quickstart guide, what does the documentation
  identify as the authentication step before making API requests?
options:
  - id: a
    text: Getting an API key
    correct: true
    explanation: "Correct. The setup steps state it directly: \"For authentication,
      [get an API key]\"."
  - id: b
    text: Browsing the official Cookbook for reusable code snippets
    correct: false
    explanation: The Cookbook is offered to explore code examples and reusable
      snippets, not as the authentication step.
  - id: c
    text: Comparing models in the playground
    correct: false
    explanation: The playground is for testing and comparing models, not for
      authenticating requests.
  - id: d
    text: Setting up a third-party framework integration
    correct: false
    explanation: Framework integrations extend capabilities for building
      applications; they are not what the guide names as the authentication
      step.
