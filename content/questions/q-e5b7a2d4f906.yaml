stem: "In Tavily's Hybrid Research pattern, how does an agent combine a private
  knowledge base with live web search?"
options:
  - id: a
    text: "It replaces the internal RAG function entirely with Tavily's search once
      initialized"
    correct: false
    explanation: "The pattern keeps calling your internal RAG function; it
      supplements rather than replaces it."
  - id: b
    text: "It uploads all internal data to Tavily's servers before running any
      search"
    correct: false
    explanation: "The pattern calls your own RAG function locally; Tavily does not
      require internal data to be uploaded to it."
  - id: c
    text: "It discards internal data whenever a web result has a higher relevance
      score"
    correct: false
    explanation: "The documentation describes merging internal data with web
      findings, not discarding it based on score."
  - id: d
    text: "It identifies gaps in internal knowledge and fills them with web data,
      producing a comprehensive report with citations"
    correct: true
    explanation: "Correct. That is exactly how the Hybrid Research pattern is
      described in the documentation."
