stem: A VM was created two minutes ago and its Metrics tab is empty. What is the
  appropriate response?
options:
  - id: a
    text: Reinstall the monitoring agent, since an empty tab means collection failed
    correct: false
    explanation: Data is collected automatically; an empty tab this soon after
      creation is expected rather than a failure.
  - id: b
    text: Raise a support case, because usage data should appear immediately
    correct: false
    explanation: Immediate appearance is not what the platform promises, so there is
      nothing yet to escalate.
  - id: c
    text: Widen the time filter, because the data is there but outside the window
    correct: false
    explanation: Adjusting filters cannot surface data for a period in which none
      has been collected yet.
  - id: d
    text: Wait, because usage data becomes available 5-10 minutes after the VM is
      created
    correct: true
    explanation: Correct. There is a documented delay before a new VM's usage data appears.
evidence:
  - source_id: src-co-vm-monitoring
    excerpt: The VM usage data becomes available 5–10 minutes after the VM is created.
