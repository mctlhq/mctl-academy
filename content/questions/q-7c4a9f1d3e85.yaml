stem: "What is the difference between stopping a Serverless AI endpoint and
  deleting it, with respect to its underlying VM and boot disk?"
options:
  - id: a
    text: "Stopping leaves the VM and disk in place (uncharged for compute), while
      deleting automatically removes the VM and its boot disk"
    correct: true
    explanation: "Correct. The documentation states that stopping an endpoint simply
      stops billing for its computing resources, while deleting it automatically
      deletes the VM and the container (boot) disk."
  - id: b
    text: "Both stopping and deleting immediately remove the VM and boot disk"
    correct: false
    explanation: "Stopping an endpoint does not remove its VM or disk; only deleting
      the endpoint is documented as automatically deleting the VM and boot
      disk."
  - id: c
    text: "Deleting only removes the boot disk, while the VM must be deleted
      separately"
    correct: false
    explanation: "The documentation states that deleting the endpoint automatically
      deletes both the VM and the container (boot) disk together, not the disk
      alone."
  - id: d
    text: "Stopping permanently deletes the VM, while deleting only pauses billing"
    correct: false
    explanation: "This reverses the documented behavior: stopping pauses compute
      billing without deleting the VM, while deleting the endpoint is what
      removes the VM and disk."
