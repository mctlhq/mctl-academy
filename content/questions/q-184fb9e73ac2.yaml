stem: "When sizing GPU memory for a LeRobot training run, why does using the
  default AdamW optimizer increase memory usage beyond a plain forward and
  backward pass?"
options:
  - id: a
    text: "AdamW carries optimizer state that adds roughly 30-100% on top of
      a forward+backward pass alone"
    correct: true
    explanation: "Correct. The hardware guide states AdamW, the LeRobot
      default, carries optimizer state that adds ~30-100% over a
      forward+backward pass alone."
  - id: b
    text: "AdamW automatically shards parameters, gradients and optimizer
      state across every available GPU"
    correct: false
    explanation: "That describes FSDP, a separate feature for training
      large models across multiple GPUs, not what the AdamW optimizer
      itself does."
  - id: c
    text: "AdamW doubles the effective batch size for every optimizer step"
    correct: false
    explanation: "Effective batch size is `batch_size × num_gpus`,
      controlled by your launch configuration, not changed by choosing
      AdamW."
  - id: d
    text: "AdamW requires mixed precision (fp16/bf16) to be enabled, which
      increases activation memory"
    correct: false
    explanation: "Mixed precision is a separate, optional setting for
      multi-GPU training; AdamW does not require it."
