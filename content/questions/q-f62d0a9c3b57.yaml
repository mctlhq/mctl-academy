stem: "A team scales LeRobot training from 1 to 4 GPUs using `accelerate
  launch`. By default, what happens to the learning rate and the number of
  training steps?"
options:
  - id: a
    text: "They stay exactly as specified; LeRobot does not auto-scale either one
      for the number of GPUs"
    correct: true
    explanation: "Correct. The multi-GPU guide states LeRobot does not auto-scale
      the learning rate or the number of steps when the effective batch size
      grows, leaving hyperparameter adjustment to the user."
  - id: b
    text: "The learning rate is scaled automatically by the number of GPUs, as many
      distributed frameworks do"
    correct: false
    explanation: "The guide states the opposite: LeRobot does not auto-scale the
      learning rate as the effective batch size grows with more GPUs."
  - id: c
    text: "The number of training steps is automatically reduced to keep total
      samples seen constant"
    correct: false
    explanation: "The guide shows reducing steps for a larger effective batch size
      as something you do manually, not something LeRobot does automatically."
  - id: d
    text: "Both are automatically doubled to match the larger effective batch size
      from more GPUs"
    correct: false
    explanation: "The effective batch size does grow with more GPUs, but LeRobot
      does not automatically adjust the learning rate or step count in
      response."
