stem: Beyond calling the OpenAI-compatible API directly, what does the Token
  Factory Quickstart identify as a way to put inference into your applications?
options:
  - id: a
    text: Supported third-party integrations
    correct: true
    explanation: The Quickstart's "Third-party integrations" card describes building
      inference into applications based on supported third-party integrations.
  - id: b
    text: Fine-tuning datasets to increase output accuracy
    correct: false
    explanation: That describes the Quickstart's "Fine-tuning" card, not the
      third-party integrations path.
  - id: c
    text: Authenticating and making requests to the inference API
    correct: false
    explanation: That describes the Quickstart's "API" card, which is the direct API
      path the question excludes.
  - id: d
    text: Sending prompts, chats, or images and getting responses
    correct: false
    explanation: That describes the Quickstart's "Inference" card, a different
      capability from third-party integrations.
