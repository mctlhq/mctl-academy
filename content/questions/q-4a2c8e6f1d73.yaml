stem: "Nebius AI Cloud documents `dstack` as an orchestration tool for AI
  workloads. What does the documentation describe `dstack` as a streamlined
  alternative to?"
options:
  - id: a
    text: "Slurm and Kubernetes"
    correct: true
    explanation: "Correct. The documentation describes dstack as an open-source
      container orchestrator that is a streamlined alternative to Slurm and
      Kubernetes, designed especially for AI."
  - id: b
    text: "Soperator and Terraform"
    correct: false
    explanation: "Soperator and Terraform are separate, documented Nebius tools;
      the page names Slurm and Kubernetes as the alternatives dstack streamlines."
  - id: c
    text: "Managed Service for MLflow and Container Registry"
    correct: false
    explanation: "MLflow and Container Registry are unrelated managed services;
      they are not named as what dstack replaces."
  - id: d
    text: "Managed Service for Kubernetes and Object Storage"
    correct: false
    explanation: "Object Storage is a storage service, not an orchestrator; the
      documented alternatives are Slurm and Kubernetes."
