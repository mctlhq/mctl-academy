stem: According to the Embeddings API reference, which fields are required in a
  POST /v1/embeddings request body?
options:
  - id: a
    text: model and input
    correct: true
    explanation: "Correct. The EmbeddingRequest schema lists its required fields:
      \"required: - model - input\"."
  - id: b
    text: model and encoding_format
    correct: false
    explanation: encoding_format is optional, with a documented default of float; it
      is not part of the required list.
  - id: c
    text: model and dimensions
    correct: false
    explanation: dimensions is optional; the schema allows it to be an integer or
      null and does not list it as required.
  - id: d
    text: input and user
    correct: false
    explanation: model is required but omitted here, and user is an optional
      identifier for your end-user rather than a required field.
