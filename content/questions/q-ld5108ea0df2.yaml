stem: A product manager asks what function calling makes possible that a bare
  text model cannot do. Which capability is documented?
options:
  - id: a
    text: Retrieving real-time data through external code or services
    correct: true
    explanation: Correct. Reaching live data and third-party services is exactly
      what tool integration enables.
  - id: b
    text: Increasing the model's context window beyond its published limit
    correct: false
    explanation: Context length is a property of the model, unchanged by tool use.
  - id: c
    text: Guaranteeing the response is valid JSON
    correct: false
    explanation: That is what structured output settings are for.
  - id: d
    text: Removing per-token charges for tool responses
    correct: false
    explanation: Tool use does not alter how tokens are billed.
