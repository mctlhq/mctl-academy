schema_version: 1
id: ai-leader
prepares_for: "Nebius AI Leader"
title: "AI Leader"
description: "Practice for the Nebius AI Leader certification. Foundational business and product track covering AI fundamentals, product design, controlling model outputs, and platform capabilities."
disclaimer:
  short: "Not affiliated with, endorsed by, or sponsored by Nebius."
  full: "mctl Academy is an independent study tool. It is not affiliated with, endorsed by, or sponsored by Nebius. It does not reproduce, mirror, or predict any certification exam, and it is not a proctored assessment."

mock:
  question_count: 30
  time_limit_minutes: 60
  disclose_bank_size: true

# Domain titles reach client/src/course-catalog.json, so they stay
# vendor-neutral per LEGAL.md. The fourth domain is published upstream as
# "Capabilities of Nebius products"; it ships here as "Platform Capabilities"
# for that reason, and the vendor name lives only in `prepares_for` above.
domains:
  - id: domain-1
    title: "AI Fundamentals"
    weight: 40
    mock_questions: 12
    objectives:
      - id: ai-concepts
        title: "Generative model families, capabilities, and where each fits"
      - id: model-selection
        title: "Choosing a model: context windows, modality, and tradeoffs"
      - id: inference-basics
        title: "How inference is served and consumed through an API"

  - id: domain-2
    title: "AI Product Design"
    weight: 25
    mock_questions: 7
    objectives:
      - id: product-outcomes
        title: "Aligning model capabilities with business outcomes and user needs"
      - id: workflow-design
        title: "Designing AI-assisted workflows and integration patterns"

  - id: domain-3
    title: "Controlling AI Outputs"
    weight: 20
    mock_questions: 6
    objectives:
      - id: structured-output
        title: "Constraining responses to a schema for downstream systems"
      - id: tool-use
        title: "Grounding answers by letting a model call tools and functions"

  - id: domain-4
    title: "Platform Capabilities"
    weight: 15
    mock_questions: 5
    objectives:
      - id: platform-capabilities
        title: "Endpoint options, scaling, quotas, and team access"
      - id: cost-and-billing
        title: "Token economics, consumption pricing, and cost controls"
